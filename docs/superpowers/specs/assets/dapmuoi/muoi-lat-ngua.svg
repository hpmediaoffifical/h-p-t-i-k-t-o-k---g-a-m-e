<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- Muỗi bị đập: vẫn nhìn nghiêng, thân NẰM NGANG nhưng lật úp — lưng xuống dưới, bụng (màu sáng)
       ngửa lên, 6 chân co quắp chổng lên trời, cánh xoè cứng, mắt X. Game cho rơi + đung đưa nhẹ rồi mờ. -->
  <defs>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7a62"/><stop offset="1" stop-color="#5a3f30"/>
    </linearGradient>
    <linearGradient id="wing2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dff3ff" stop-opacity=".6"/><stop offset="1" stop-color="#9ec9ff" stop-opacity=".2"/>
    </linearGradient>
    <style>.leg{fill:none;stroke:#2a1c14;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.leg2{stroke:#4a3328}</style>
  </defs>
  <g id="muoi-lat">
    <!-- cánh xoè cứng, hai bên thân -->
    <path d="M112 128 C 160 150, 236 156, 266 140 C 236 122, 160 112, 112 128 Z" fill="url(#wing2)" stroke="#b9dcff" stroke-width="1.6"/>
    <path d="M112 128 C 150 168, 210 176, 236 170 C 214 150, 160 138, 112 128 Z" fill="url(#wing2)" stroke="#b9dcff" stroke-width="1.6"/>
    <!-- chân phía xa chổng lên -->
    <path class="leg leg2" d="M100 88 L 80 60 L 92 28"/>
    <path class="leg leg2" d="M114 84 L 120 50 L 136 24"/>
    <path class="leg leg2" d="M126 86 L 160 62 L 196 44"/>
    <!-- bụng ngửa lên (màu sáng), hơi vểnh -->
    <path d="M122 110 C 170 116, 222 104, 250 82 C 230 72, 172 78, 122 86 Z" fill="url(#belly)"/>
    <g fill="none" stroke="#f1e8d8" stroke-width="4" stroke-linecap="round" opacity=".7">
      <path d="M150 112 C 152 100, 152 92, 150 84"/><path d="M176 112 C 178 100, 178 90, 176 82"/>
      <path d="M202 106 C 204 96, 204 88, 202 80"/><path d="M226 98 C 228 90, 228 84, 226 78"/>
    </g>
    <!-- ngực (lưng chạm đất) -->
    <ellipse cx="108" cy="104" rx="24" ry="20" fill="#7a5a46"/>
    <!-- chân phía gần co quắp chổng lên -->
    <path class="leg" d="M94 88 L 64 66 L 52 30 L 60 22"/>
    <path class="leg" d="M108 84 L 104 48 L 96 18 L 104 12"/>
    <path class="leg" d="M122 84 L 150 50 L 182 34 L 186 44"/>
    <!-- đầu, mắt X -->
    <circle cx="70" cy="100" r="15" fill="#2a1c14"/>
    <circle cx="64" cy="104" r="8.5" fill="#b3122e"/>
    <path d="M59 99 L 69 109 M69 99 L 59 109" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <path class="leg" style="stroke-width:1.6" d="M66 114 C 56 128, 46 134, 34 138 M72 114 C 68 130, 60 140, 50 148"/>
    <!-- vòi cong queo -->
    <path d="M58 94 C 44 86, 30 92, 14 80" fill="none" stroke="#2a1c14" stroke-width="3.4" stroke-linecap="round"/>
    <!-- sao choáng -->
    <g fill="#ffd54a">
      <path d="M40 24 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/><path d="M290 60 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
    </g>
  </g>
</svg>
