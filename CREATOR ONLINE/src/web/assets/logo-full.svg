<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1160 380" width="1160" height="380">
  <!-- Creator Online logo for dark backgrounds: mark + wordmark -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6C3A8"/>
      <stop offset="1" stop-color="#E6A2D0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6C3A8"/>
      <stop offset="0.55" stop-color="#E6A2D0"/>
      <stop offset="1" stop-color="#B78CFF"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(10 20) scale(0.664)">
    <rect x="6" y="6" width="500" height="500" rx="112" fill="url(#bg)"/>
    <polygon points="236,78 276,78 330,232 182,232" fill="url(#beam)" opacity="0.55"/>
    <polygon points="152,80 176,80 236,214 150,214" fill="url(#beam)" opacity="0.45"/>
    <polygon points="336,80 360,80 362,214 276,214" fill="url(#beam)" opacity="0.45"/>
    <rect x="132" y="58" width="248" height="14" rx="7" fill="#ffffff"/>
    <circle cx="164" cy="80" r="15" fill="#ffffff"/>
    <circle cx="256" cy="80" r="17" fill="#ffffff"/>
    <circle cx="348" cy="80" r="15" fill="#ffffff"/>
    <text x="256" y="432" text-anchor="middle" font-family="Impact, Anton, 'Arial Black', sans-serif" font-size="288" fill="#ffffff" letter-spacing="-4">hp</text>
    <circle cx="432" cy="86" r="24" fill="#ff2d55" stroke="#ffffff" stroke-width="7"/>
  </g>
  <text x="378" y="182" font-family="Impact, Anton, 'Arial Black', sans-serif" font-size="168" fill="#ffffff" letter-spacing="2">CREATOR</text>
  <text x="378" y="338" font-family="Impact, Anton, 'Arial Black', sans-serif" font-size="168" fill="url(#word)" letter-spacing="2">ONLINE</text>
  <rect x="908" y="226" width="176" height="74" rx="18" fill="#ff2d55"/>
  <text x="996" y="285" text-anchor="middle" font-family="Impact, Anton, 'Arial Black', sans-serif" font-size="60" fill="#ffffff" letter-spacing="3">LIVE</text>
  <text x="910" y="340" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="30" fill="#c7c4dc">by HP Media</text>
</svg>
