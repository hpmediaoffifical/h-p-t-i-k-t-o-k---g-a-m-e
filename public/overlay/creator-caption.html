<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Creator Caption Overlay</title>
    <script src="/lib/overlay-resolution.js"></script>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: Arial, Helvetica, sans-serif; }
        #wrap {
            position: fixed;
            left: 50%;
            bottom: 7vh;
            transform: translateX(-50%);
            width: min(1120px, 92vw);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .line {
            max-width: 100%;
            padding: 16px 24px 18px;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(5, 8, 14, 0.78), rgba(18, 24, 38, 0.62));
            border: 1px solid rgba(37, 244, 238, 0.42);
            box-shadow: 0 18px 54px rgba(0,0,0,0.52), 0 0 34px rgba(37,244,238,0.16);
            backdrop-filter: blur(16px) saturate(1.25);
            color: #fff;
            text-align: center;
            animation: captionIn .34s cubic-bezier(.2,.9,.2,1.1);
        }
        .translated {
            font-size: clamp(28px, 3.4vw, 54px);
            line-height: 1.16;
            font-weight: 900;
            text-shadow: 0 3px 10px rgba(0,0,0,0.75);
        }
        .word {
            display: inline-block;
            opacity: 0;
            transform: translateY(0.38em) scale(0.96);
            filter: blur(4px);
            animation: karaokeWord .42s cubic-bezier(.2,.9,.2,1) forwards;
        }
        .word.active {
            color: #fff6a6;
            text-shadow: 0 0 16px rgba(255, 209, 102, 0.45), 0 3px 10px rgba(0,0,0,0.78);
        }
        .translated + .translated { margin-top: 8px; }
        .lang-label {
            display: inline-block;
            margin-right: 10px;
            color: #25F4EE;
            font-size: 0.62em;
            vertical-align: 0.12em;
        }
        .original {
            margin-top: 8px;
            font-size: clamp(16px, 1.5vw, 24px);
            line-height: 1.25;
            color: #bffefa;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }
        .route {
            margin-bottom: 6px;
            color: #ffd166;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .line.leaving { opacity: 0; transform: translateY(18px) scale(0.96); filter: blur(8px); transition: opacity .28s ease, transform .28s ease, filter .28s ease; }
        @keyframes captionIn { from { opacity: 0; transform: translateY(24px) scale(0.94); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }
        @keyframes karaokeWord { to { opacity: 1; transform: none; filter: none; } }

        /* Dòng chữ ĐANG NÓI (chưa dịch) — câu gốc mờ + "…" nhấp nháy, nằm dưới cụm phụ đề. */
        #interim {
            display: none;
            max-width: 100%;
            text-align: center;
            font-size: clamp(18px, 1.8vw, 28px);
            line-height: 1.3;
            font-style: italic;
            color: #d3d3d3;
            opacity: 0.85;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 6px rgba(0,0,0,0.6);
            white-space: pre-wrap;
        }
        #interim.show { display: block; }
        #interim::after {
            content: '…';
            display: inline-block;
            width: 1.2em;
            text-align: left;
            animation: dots 1.2s steps(3, end) infinite;
        }
        @keyframes dots {
            0%   { clip-path: inset(0 100% 0 0); }
            33%  { clip-path: inset(0 66% 0 0); }
            66%  { clip-path: inset(0 33% 0 0); }
            100% { clip-path: inset(0 0 0 0); }
        }

        /* Kiểu PHỤ ĐỀ: không nền, chữ trắng viền đen, mỗi ngôn ngữ một dòng, câu gốc nhỏ nghiêng trong ngoặc. */
        .line.subtitle {
            padding: 0;
            border: 0;
            border-radius: 0;
            background: none;
            box-shadow: none;
            backdrop-filter: none;
        }
        .line.subtitle .route, .line.subtitle .lang-label { display: none; }
        .line.subtitle .translated {
            font-size: 36px;
            line-height: 1.25;
            font-weight: 700;
            color: #fff;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 6px rgba(0,0,0,0.6);
            white-space: pre-wrap;
        }
        .line.subtitle .translated + .translated { margin-top: 4px; }
        .line.subtitle .word { opacity: 1; transform: none; filter: none; animation: none; color: inherit; text-shadow: inherit; }
        .line.subtitle .original {
            margin-top: 6px;
            font-size: 24px;
            font-style: italic;
            color: #d3d3d3;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 6px rgba(0,0,0,0.6);
        }
        .line.subtitle .original::before { content: '('; }
        .line.subtitle .original::after { content: ')'; }
    </style>
</head>
<body>
    <div id="wrap"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
    (function () {
        const wrap = document.getElementById('wrap');
        const socket = io({ reconnection: true, reconnectionDelay: 600, reconnectionDelayMax: 5000 });
        let config = { showOriginal: true, showInterim: true, style: 'card', maxItems: 3, holdSeconds: 12 };
        const INTERIM_HIDE_MS = 8000;
        let interimEl = null;
        let interimTimer = null;

        function trimItems(max) {
            const lines = Array.from(wrap.querySelectorAll('.line'));
            while (lines.length > max) lines.shift().remove();
        }
        function appendKaraokeText(parent, text) {
            const words = String(text || '').split(/(\s+)/).filter(Boolean);
            let wordIndex = 0;
            for (const part of words) {
                if (/^\s+$/.test(part)) {
                    parent.appendChild(document.createTextNode(part));
                    continue;
                }
                const span = document.createElement('span');
                span.className = 'word';
                span.textContent = part;
                span.style.animationDelay = Math.min(wordIndex * 0.055, 1.8) + 's';
                if (wordIndex < 7) span.classList.add('active');
                parent.appendChild(span);
                wordIndex += 1;
            }
        }
        function ensureInterim() {
            if (!interimEl) {
                interimEl = document.createElement('div');
                interimEl.id = 'interim';
            }
            // Luôn nằm cuối cụm (dưới câu đã dịch gần nhất).
            if (wrap.lastElementChild !== interimEl) wrap.appendChild(interimEl);
            return interimEl;
        }
        function hideInterim() {
            if (interimTimer) clearTimeout(interimTimer);
            interimTimer = null;
            if (interimEl) { interimEl.classList.remove('show'); interimEl.textContent = ''; }
        }
        function showInterim(text) {
            const t = String(text || '').trim();
            if (!t || config.showInterim === false) { hideInterim(); return; }
            const el = ensureInterim();
            el.textContent = t;
            el.classList.add('show');
            if (interimTimer) clearTimeout(interimTimer);
            interimTimer = setTimeout(hideInterim, INTERIM_HIDE_MS);
        }
        function addLine(item) {
            hideInterim();   // câu final tới → dòng tạm xoá ngay
            const style = item.style === 'subtitle' || (!item.style && config.style === 'subtitle') ? 'subtitle' : 'card';
            const el = document.createElement('div');
            el.className = 'line ' + style + (item.error ? ' error' : '');
            const route = document.createElement('div');
            route.className = 'route';
            const translations = Array.isArray(item.translations) && item.translations.length ? item.translations : [{ targetLangLabel: item.targetLangLabel, translatedText: item.translatedText }];
            route.textContent = `${item.sourceLangLabel || 'Creator'} → ${translations.map(x => x.targetLangLabel || 'Overlay').join(' · ')}`;
            el.appendChild(route);
            for (const row of translations) {
                const translated = document.createElement('div');
                translated.className = 'translated';
                const label = document.createElement('span');
                label.className = 'lang-label';
                label.textContent = row.targetLangLabel || row.targetLang || '';
                translated.appendChild(label);
                appendKaraokeText(translated, row.translatedText || item.originalText || '');
                el.appendChild(translated);
            }
            const allSame = translations.every(x => (x.translatedText || '') === item.originalText);
            if ((item.showOriginal ?? config.showOriginal) && item.originalText && !allSame) {
                const original = document.createElement('div');
                original.className = 'original';
                original.textContent = item.originalText;
                el.appendChild(original);
            }
            if (interimEl && interimEl.parentElement === wrap) wrap.insertBefore(el, interimEl);
            else wrap.appendChild(el);
            trimItems(item.maxItems || config.maxItems || 3);
            setTimeout(() => {
                el.classList.add('leaving');
                setTimeout(() => el.remove(), 260);
            }, Math.max(3, item.holdSeconds || config.holdSeconds || 12) * 1000);
        }

        socket.on('connect', () => socket.emit('subscribe', 'creatorCaptionOverlay'));
        socket.on('creatorCaption:config', cfg => {
            config = { ...config, ...(cfg || {}) };
            if (config.showInterim === false) hideInterim();
        });
        socket.on('creatorCaption:line', addLine);
        socket.on('creatorCaption:partial', p => showInterim(p && p.text));
    })();
    </script>
</body>
</html>
