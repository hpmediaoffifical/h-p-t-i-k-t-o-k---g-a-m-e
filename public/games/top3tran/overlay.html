<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>🏆 Top 3 Kết Thúc Trận — overlay</title>
<!-- OBS Browser Source 1080×1920, nền trong suốt. Link: /overlay/top3tran
     ?demo=1 → tự chạy kịch bản giả (khung xem trước trong app), nhận cfg qua postMessage {type:'top3tran:cfg'}.
     Dữ liệu thật: socket 'top3tran:state' (server.js rankEmit, luật lib/top3-tran.js). -->
<link rel="stylesheet" href="/games/top3tran/top3tran.css">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body.demo { background: repeating-conic-gradient(#ffffff0d 0 25%, #0000 0 50%) 0 0/24px 24px, linear-gradient(160deg, #1d2733, #2a2a4e 55%, #1b1f2a); }
  #stage { position: relative; width: 1080px; height: 1920px; transform-origin: 0 0; }
</style>
</head>
<body>
<div id="stage"><div id="t3"></div></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/lib/overlay-hello.js" data-game="top3tran"></script>
<script src="/games/top3tran/game.js"></script>
<script>
(function () {
  'use strict';
  const qs = new URLSearchParams(location.search);
  const DEMO = qs.get('demo') === '1';
  const stage = document.getElementById('stage');
  function fit() { const k = Math.min(innerWidth / 1080, innerHeight / 1920); stage.style.transform = 'scale(' + k + ')'; }
  addEventListener('resize', fit); fit();
  const R = window.HpTop3Tran.createRenderer(document.getElementById('t3'));

  if (DEMO) {
    document.body.classList.add('demo');
    // ?scene=N giữ cố định 1 cảnh (chụp ảnh / căn vị trí); không có thì tự chuyển cảnh.
    const SCENE = qs.get('scene');
    let k = SCENE != null ? Number(SCENE) || 0 : 0;
    R.update(window.HpTop3Tran.demoState(k));
    if (SCENE == null) setInterval(() => { k++; R.update(window.HpTop3Tran.demoState(k)); }, 6000);
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin) return;
      if (e.data && e.data.type === 'top3tran:cfg') R.setCfg(Object.assign({}, e.data.cfg, { enabled: true }));
    });
    if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'top3tran:ready' }, location.origin);
    return;
  }

  function loadCfg() {
    return fetch('/api/games/top3tran/config').then((r) => r.json()).then((c) => R.setCfg(c)).catch(() => {});
  }
  function loadState() {
    return fetch('/api/top3tran/state').then((r) => r.json()).then((d) => d && d.state && R.update(d.state)).catch(() => {});
  }
  loadCfg(); loadState();
  const socket = io({ transports: ['websocket', 'polling'] });
  socket.on('connect', () => { socket.emit('subscribe', 'overlay'); loadCfg(); loadState(); });
  socket.on('gameConfig', (d) => { if (d && d.gameId === 'top3tran') R.setCfg(d.config); });
  socket.on('top3tran:state', (s) => R.update(s));
  socket.on('overlay:reload', (d) => { if (!d || !d.gameId || d.gameId === 'top3tran') location.reload(); });
})();
</script>
</body>
</html>
