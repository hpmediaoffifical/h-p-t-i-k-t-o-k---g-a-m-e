<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>🎲 Đấu Trường Mini — overlay</title>
<meta name="viewport" content="width=1080, initial-scale=1">
<script src="/i18n/hp-i18n.js" data-scope="overlay"></script>
<link rel="stylesheet" href="/games/luotchoi/overlay.css">

<body>
