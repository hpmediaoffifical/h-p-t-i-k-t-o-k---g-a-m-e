<!doctype html>
<html lang="vi">
<head>
    <script src="/lib/overlay-resolution.js"></script>
<meta charset="utf-8" />
<title>HP VIP Welcome — OBS Overlay</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon" />
<link rel="stylesheet" href="/games/vipwelcome/joincard.css" />
<link rel="stylesheet" href="/games/vipwelcome/joinbar.css" />
<style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: transparent; overflow: hidden; font-family: Inter, "Segoe UI", Arial, sans-serif; }
    #stage { position: fixed; inset: 0; background: transparent; overflow: hidden; pointer-events: none; }
    #content {
        position: absolute;
        top: var(--y, 50%); left: var(--x, 50%);
        transform: translate(-50%, -50%) scale(var(--scale, 1));
        transform-origin: center center;
        width: 1080px; height: 1920px;
        background: transparent;
        display: flex; align-items: center; justify-content: center;
    }
    #player {
        max-width: 100%; max-height: 100%;
        object-fit: contain;
        display: none;
        filter: drop-shadow(0 0 60px rgba(0,0,0,0.5));
    }
    #player.show { display: block; animation: fxIn 260ms ease-out; }
    @keyframes fxIn {
        from { opacity: 0; transform: scale(0.82); }
        to { opacity: 1; transform: scale(1); }
    }
    /* Message label — base styles. Style variant áp dụng qua class style-* */
    #label {
        position: absolute; left: 50%; transform: translateX(-50%);
        padding: 14px 32px; border-radius: 999px;
        color: #fff; font-size: 32px; font-weight: 900; letter-spacing: 0.6px;
        text-shadow: 0 3px 10px rgba(0,0,0,0.65);
        box-shadow: 0 12px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.35);
        max-width: 92%;
        display: none;
        font-family: 'Segoe UI', 'Roboto', sans-serif;
        align-items: center; gap: 14px;
    }
    #label.show { display: flex; animation: labelIn 360ms cubic-bezier(.34,1.56,.64,1); }
    #avatar {
        width: 56px; height: 56px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.8);
        object-fit: cover;
        flex-shrink: 0;
        background: #1a1a1a;
        display: none;
    }
    #avatar.show { display: block; }
    #label-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #label.pos-top    { top: 96px; }
    #label.pos-middle { top: 50%; transform: translate(-50%, -50%); }
    #label.pos-bottom { bottom: 96px; }
    @keyframes labelIn {
        from { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.85); }
        to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    /* === 10 style variants — chọn từ Cài đặt === */
    /* 1. Gold-Pink (mặc định) */
    #label.style-goldpink {
        background: linear-gradient(135deg, rgba(255, 184, 0, 0.96), rgba(255, 45, 85, 0.96));
    }
    /* 2. Royal — tím hoàng gia + viền vàng */
    #label.style-royal {
        background: linear-gradient(135deg, #4a148c, #7c3aed);
        border: 2px solid #ffd700;
        box-shadow: 0 12px 32px rgba(124, 58, 237, 0.55), 0 0 25px rgba(255, 215, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
    }
    /* 3. Neon Cyan — xanh neon phát sáng */
    #label.style-neon {
        background: linear-gradient(135deg, #0ea5e9, #06b6d4);
        color: #fff;
        text-shadow: 0 0 12px rgba(6, 182, 212, 0.9), 0 0 24px rgba(6, 182, 212, 0.6);
        box-shadow: 0 0 24px rgba(6, 182, 212, 0.6), 0 12px 32px rgba(0,0,0,0.45);
        border: 1.5px solid rgba(255, 255, 255, 0.5);
    }
    /* 4. Fire — đỏ cam lửa */
    #label.style-fire {
        background: linear-gradient(135deg, #dc2626, #f97316, #fbbf24);
        text-shadow: 0 2px 8px rgba(220, 38, 38, 0.8), 0 0 16px rgba(251, 191, 36, 0.6);
        box-shadow: 0 12px 32px rgba(220, 38, 38, 0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    /* 5. Luxury — đen sang trọng + chữ vàng */
    #label.style-luxury {
        background: linear-gradient(135deg, #0a0a0a, #262626);
        color: #ffd700;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        border: 1.5px solid #ffd700;
        box-shadow: 0 12px 32px rgba(0,0,0,0.7), 0 0 16px rgba(255, 215, 0, 0.3);
    }
    /* 6. Pastel — nhẹ nhàng pink-purple */
    #label.style-pastel {
        background: linear-gradient(135deg, #fbcfe8, #c4b5fd);
        color: #4c1d95;
        text-shadow: none;
        box-shadow: 0 8px 24px rgba(196, 181, 253, 0.5);
    }
    /* 7. Emerald — xanh ngọc sang */
    #label.style-emerald {
        background: linear-gradient(135deg, #047857, #10b981);
        text-shadow: 0 2px 8px rgba(4, 120, 87, 0.6);
        box-shadow: 0 12px 32px rgba(16, 185, 129, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
    }
    /* 8. Ocean — xanh biển sâu */
    #label.style-ocean {
        background: linear-gradient(135deg, #1e3a8a, #2563eb, #06b6d4);
        text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        box-shadow: 0 12px 32px rgba(37, 99, 235, 0.5);
    }
    /* 9. Vietnam — đỏ vàng cờ Việt Nam */
    #label.style-vietnam {
        background: linear-gradient(135deg, #da251d, #ff0000);
        color: #ffff00;
        text-shadow: 0 2px 6px rgba(0,0,0,0.7);
        border: 2px solid #ffff00;
        box-shadow: 0 12px 32px rgba(218, 37, 29, 0.6), 0 0 18px rgba(255, 255, 0, 0.4);
    }
    /* 10. Rainbow — gradient cầu vồng động */
    #label.style-rainbow {
        background: linear-gradient(90deg, #ff0080, #ff8c00, #ffd700, #00c853, #00b8d4, #7c3aed, #ff0080);
        background-size: 400% 100%;
        animation: rainbowShift 4s linear infinite;
        text-shadow: 0 2px 8px rgba(0,0,0,0.85);
        box-shadow: 0 12px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    #label.style-rainbow.show { animation: labelIn 360ms cubic-bezier(.34,1.56,.64,1), rainbowShift 4s linear infinite; }
    @keyframes rainbowShift {
        0% { background-position: 0% 50%; }
        100% { background-position: 400% 50%; }
    }
    /* 11. Glass — kính mờ minimalist */
    #label.style-glass {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        box-shadow: 0 12px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    /* 12. Cyber — xanh tím cyber-punk */
    #label.style-cyber {
        background: linear-gradient(135deg, #0f172a, #1e1b4b);
        color: #00ffff;
        text-shadow: 0 0 8px #00ffff, 0 0 16px rgba(0, 255, 255, 0.6), 0 0 4px #ff00ff;
        border: 1.5px solid #00ffff;
        box-shadow: 0 0 24px rgba(0, 255, 255, 0.5), 0 0 40px rgba(255, 0, 255, 0.3), inset 0 0 12px rgba(0, 255, 255, 0.2);
    }
    .debug-pill {
        position: fixed; bottom: 8px; left: 8px;
        background: rgba(0,0,0,0.5); color: #fff;
        font: 11px/1.2 monospace; padding: 4px 8px; border-radius: 6px;
        z-index: 9999; opacity: 0.6;
    }
    .debug-pill.hidden { display: none; }
    body.offline #content { display: none; }
    body.offline .debug-pill { display: none !important; }
    body.offline #jc-stack { display: none; }
</style>
</head>
<body>
    <div id="stage">
        <div id="content">
            <video id="player" playsinline preload="auto"></video>
            <audio id="audioOnly" preload="auto"></audio>
            <video id="preloader" preload="auto" muted playsinline style="display:none"></video>
            <div id="label" class="pos-bottom style-goldpink">
                <img id="avatar" alt="" />
                <span id="label-text"></span>
            </div>
        </div>
    </div>
    <!-- Thẻ vào phòng: xếp chồng song song, tách khỏi khu media -->
    <div id="jc-stack" class="dir-up"></div>
    <div id="jb-stack"></div>
    <div class="debug-pill" id="debug">connecting…</div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/games/vipwelcome/bar-slots.js"></script>
    <script>
    (function () {
        const debugEl = document.getElementById('debug');
        const content = document.getElementById('content');
        const player = document.getElementById('player');
        const audioOnly = document.getElementById('audioOnly');
        const labelEl = document.getElementById('label');
        const labelTextEl = document.getElementById('label-text');
        const avatarEl = document.getElementById('avatar');
        let pendingStyleOverride = '';

        let currentCfg = null;
        let labelTimer = null;
        const queue = [];
        let playing = false;

        const LABEL_STYLES = ['goldpink','royal','neon','fire','luxury','pastel','emerald','ocean','vietnam','rainbow','glass','cyber'];
        function applyDisplay() {
            if (!currentCfg || !currentCfg.display) return;
            const w = window.innerWidth, h = window.innerHeight;
            const base = Math.min(w / 1080, h / 1920);
            const userScale = (currentCfg.display.scale || 100) / 100;
            content.style.setProperty('--scale', String(base * userScale));
            content.style.setProperty('--x', (currentCfg.display.xPercent ?? 50) + '%');
            content.style.setProperty('--y', (currentCfg.display.yPercent ?? 50) + '%');
            // Label position
            labelEl.classList.remove('pos-top', 'pos-middle', 'pos-bottom');
            const pos = currentCfg.display.textPosition || 'bottom';
            labelEl.classList.add(pos === 'top' ? 'pos-top' : pos === 'middle' ? 'pos-middle' : 'pos-bottom');
            // Label style — strip mọi style-* hiện có rồi apply style mới
            for (const s of LABEL_STYLES) labelEl.classList.remove('style-' + s);
            const style = currentCfg.display.labelStyle || 'goldpink';
            labelEl.classList.add('style-' + (LABEL_STYLES.includes(style) ? style : 'goldpink'));
        }
        function fitNoCfg() {
            const w = window.innerWidth, h = window.innerHeight;
            const s = Math.min(w / 1080, h / 1920);
            content.style.setProperty('--scale', String(s));
        }
        window.addEventListener('resize', () => currentCfg ? applyDisplay() : fitNoCfg());
        fitNoCfg();
        setTimeout(() => debugEl.classList.add('hidden'), 4000);

        function clearPlayer() {
            try { player.pause(); player.removeAttribute('src'); player.load(); } catch (e) {}
            player.classList.remove('show');
        }
        function clearAudio() {
            try { audioOnly.pause(); audioOnly.removeAttribute('src'); audioOnly.load(); } catch (e) {}
        }
        function hideLabel() {
            labelEl.classList.remove('show');
            clearTimeout(labelTimer); labelTimer = null;
        }
        // Apply style — ưu tiên override từ payload (rule-level), fallback currentCfg
        function applyLabelStyle(overrideStyle) {
            for (const s of LABEL_STYLES) labelEl.classList.remove('style-' + s);
            const style = overrideStyle || currentCfg?.display?.labelStyle || 'goldpink';
            labelEl.classList.add('style-' + (LABEL_STYLES.includes(style) ? style : 'goldpink'));
        }
        function showLabel(text, durationMs, opts) {
            applyLabelStyle(opts?.styleOverride);
            // Avatar — set src nếu có + showAvatar enabled từ config
            const showAvatar = currentCfg?.display?.showAvatar !== false;
            if (showAvatar && opts?.avatarUrl) {
                avatarEl.onerror = () => { avatarEl.classList.remove('show'); avatarEl.removeAttribute('src'); };   // link CDN hết hạn → ẩn thay vì ô đen
                avatarEl.src = opts.avatarUrl;
                avatarEl.classList.add('show');
            } else {
                avatarEl.classList.remove('show');
                avatarEl.src = '';
            }
            labelTextEl.textContent = text;
            labelEl.classList.remove('show');
            void labelEl.offsetWidth;
            labelEl.classList.add('show');
            clearTimeout(labelTimer);
            labelTimer = setTimeout(hideLabel, durationMs || 3500);
        }

        // ===== Media (video/âm thanh) — phát lần lượt, server chờ ack 'vipwelcome:done' mới gửi lượt kế =====
        const preloader = document.getElementById('preloader');
        let playWatchdog = null;
        const WATCHDOG_NO_META_MS = 15000;   // không đọc được thời lượng clip
        const WATCHDOG_PAD_MS = 2000;        // thời lượng clip + 2s
        function armWatchdog(ms, onTimeout) {
            clearTimeout(playWatchdog);
            playWatchdog = setTimeout(onTimeout, ms);
        }
        function preloadNext(url) {
            if (!url || !/\.(mp4|webm|mov)(\?|$)/i.test(url)) return;
            try { if (preloader.getAttribute('src') !== url) { preloader.src = url; preloader.load(); } } catch (e) {}
        }

        let currentFinish = null;   // phím tắt "bỏ qua" gọi hàm này để kết thúc mục đang phát
        function playMedia(p) {
            // Báo server đã phát xong lượt này → server gửi lượt kế (drain serial theo ack).
            let acked = false;
            const finish = () => {
                if (acked) return;
                acked = true;
                if (currentFinish === finish) currentFinish = null;
                clearTimeout(playWatchdog);
                clearPlayer(); clearAudio();
                try { socket.emit('vipwelcome:done', { seq: p && p.seq }); } catch (e) {}
                playing = false;
                advanceQueue();
            };
            if (!p || !p.mediaUrl) { finish(); return; }
            currentFinish = finish;
            const isVideo = (p.mediaType === 'video') || /\.(mp4|webm|mov)(\?|$)/i.test(p.mediaUrl);
            const vol = Math.max(0, Math.min(1, (p.volume ?? 100) / 100));
            // Nhãn chữ cũ cho trigger KHÔNG phải vào phòng (vào phòng đã có thẻ riêng)
            if (p.eventType !== 'join' && currentCfg?.display?.showText !== false && p.message) {
                showLabel(p.message, undefined, {
                    styleOverride: p.labelStyle || '',
                    avatarUrl: p.user?.profilePicture || ''
                });
            }
            const el = isVideo ? player : audioOnly;
            if (isVideo) clearAudio(); else clearPlayer();
            // Đọc tên gắn kèm lượt này (p.ttsUrl): phát ngay khi clip xong / lỗi / quá giờ, rồi mới báo xong lượt
            let ttsStarted = false;
            const afterMedia = () => {
                if (acked) return;
                if (!p.ttsUrl || ttsStarted) { finish(); return; }
                ttsStarted = true;
                clearPlayer();
                el.onended = el.onerror = el.onloadedmetadata = null;
                audioOnly.onloadedmetadata = null;
                audioOnly.onended = finish;
                audioOnly.onerror = finish;
                armWatchdog(WATCHDOG_NO_META_MS, finish);
                audioOnly.src = p.ttsUrl;
                audioOnly.volume = Math.max(0, Math.min(1, (p.ttsVolume ?? 90) / 100));
                audioOnly.play().catch(() => { if (!acked && audioOnly.getAttribute('src') === p.ttsUrl) finish(); });
            };
            el.onended = afterMedia;
            el.onerror = afterMedia;
            el.onloadedmetadata = () => {
                if (acked || ttsStarted) return;
                const d = Number(el.duration);
                if (Number.isFinite(d) && d > 0) {
                    armWatchdog(d * 1000 + WATCHDOG_PAD_MS, afterMedia);
                    // Clip dài hơn 20s → server giãn hạn chờ theo đúng thời lượng (+ thời gian đọc tên nếu có)
                    try { socket.emit('vipwelcome:playing', { seq: p.seq, durationMs: Math.round(d * 1000) + (p.ttsUrl ? 8000 : 0) }); } catch (e) {}
                }
            };
            armWatchdog(WATCHDOG_NO_META_MS, afterMedia);
            el.src = p.mediaUrl;
            el.currentTime = 0;
            el.volume = vol;
            el.muted = false;
            if (isVideo) player.classList.add('show');
            // OBS cho tự phát có tiếng; trình duyệt thường chặn → thử tắt tiếng, vẫn bị chặn thì bỏ lượt (không kẹt hàng)
            el.play().catch(() => {
                // Promise của clip CŨ bị huỷ sau khi đã sang clip mới → bỏ qua, đừng tắt tiếng clip mới
                if (acked || el.getAttribute('src') !== p.mediaUrl) return;
                if (!isVideo) { finish(); return; }
                player.muted = true;
                player.play().catch(() => { if (!acked && el.getAttribute('src') === p.mediaUrl) finish(); });
            });
            preloadNext(p.preloadNext);
        }

        function advanceQueue() {
            if (queue.length === 0) return;
            const next = queue.shift();
            playing = true;
            playMedia(next);
        }
        const CLIENT_QUEUE_MAX = 20;
        function fire(payload) {
            if (!payload || !payload.mediaUrl) return;
            if (queue.some(q => q.seq != null && q.seq === payload.seq)) return;   // server gửi lại cùng lượt → bỏ
            queue.push(payload);
            while (queue.length > CLIENT_QUEUE_MAX) queue.shift();               // không phình vô hạn khi clip kẹt
            if (!playing) advanceQueue();
        }

        // ===== Thẻ vào phòng — hiện song song, tối đa maxStack thẻ, thẻ mới đẩy thẻ cũ =====
        const stackEl = document.getElementById('jc-stack');
        const seenCards = new Set();
        const SEEN_MAX = 500;
        function cardCfg() {
            return Object.assign({ xPercent: 3, yPercent: 60, scale: 100, maxStack: 3, direction: 'up', durationMs: 5000 }, currentCfg?.joinCard?.card || {});
        }
        function applyCardLayout() {
            const c = cardCfg();
            const base = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
            stackEl.style.setProperty('--jc-x', c.xPercent + '%');
            stackEl.style.setProperty('--jc-y', c.yPercent + '%');
            stackEl.style.setProperty('--jc-scale', String(base * (c.scale || 100) / 100));
            stackEl.classList.toggle('dir-up', c.direction !== 'down');
            stackEl.classList.toggle('dir-down', c.direction === 'down');
        }
        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text != null) e.textContent = text;
            return e;
        }
        // Xu gọn cho vừa ô: 180.000 → 180K, 2.500.000 → 2,5Tr (số nhỏ giữ đủ chữ số)
        function fmtXu(v) {
            if (v >= 1e6) return (Math.floor(v / 1e5) / 10).toLocaleString('vi-VN') + 'Tr';
            if (v >= 1e5) return Math.floor(v / 1e3).toLocaleString('vi-VN') + 'K';
            return v.toLocaleString('vi-VN');
        }
        function countUp(node, target) {
            const t0 = performance.now(), dur = 1200;
            const step = (t) => {
                const k = Math.min(1, (t - t0) / dur);
                node.textContent = fmtXu(Math.round(target * (1 - Math.pow(1 - k, 3))));
                if (k < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
            setTimeout(() => { node.textContent = fmtXu(target); }, dur + 100);   // rAF có thể bị dừng khi trang ẩn
        }
        // Cho thẻ vừa khung 640px (cần thẻ đã gắn vào DOM để đo):
        //  - tên dài: thu cỡ chữ 40 → 26px trước khi phải cắt "…"
        //  - dải chip trên tràn: chuyển cỡ gọn (.tight)
        //  - dòng phụ tràn: bớt chip ít quan trọng trước (lần ghé → @id → chuỗi buổi); TOP/MOD/BẠN BÈ giữ lại
        function fitCard(card) {
            const W = 632;   // chừa mũi vát bên phải
            const top = card.querySelector('.jc-top');
            if (top && top.offsetLeft + top.scrollWidth > W) top.classList.add('tight');
            const sub = card.querySelector('.jc-sub');
            for (const sel of ['.jc-visit:not(.streak):not(.first)', '.jc-uid', '.jc-visit.streak', '.jc-visit.first']) {
                if (!sub || sub.offsetLeft + sub.scrollWidth <= W) break;
                const x = sub.querySelector(sel); if (x) x.remove();
            }
            const n = card.querySelector('.jc-name');
            if (!n || card.classList.contains('jc-group')) return;
            for (let fs = 40; fs > 26 && n.scrollWidth > n.clientWidth + 1; ) { fs -= 2; n.style.fontSize = fs + 'px'; }
        }
        // Thẻ gộp khi phòng đông: chồng ≤3 avatar + "A, B và N người khác"
        function buildGroupCard(c) {
            const skins = ['violet', 'ice', 'amber', 'flame', 'diamond', 'imperial'];
            const card = el('div', 'jc-card jc-group skin-' + (skins.includes(c.skin) ? c.skin : 'violet'));
            const avs = el('div', 'jc-group-avas');
            (c.members || []).slice(0, 3).forEach((m, i) => {
                const a = el('img', 'jc-group-ava');
                a.alt = '';
                a.style.zIndex = String(3 - i);
                a.onerror = () => { a.onerror = null; a.src = '/api/games/vipwelcome/avatar'; };
                a.src = m.avatar || '/api/games/vipwelcome/avatar';
                avs.appendChild(a);
            });
            card.appendChild(avs);
            const top = el('div', 'jc-top');
            top.appendChild(el('span', 'jc-chip jc-title', (c.total || 0) + ' NGƯỜI'));
            top.appendChild(el('span', 'jc-enter', c.enterText || 'VÀO PHÒNG'));
            card.appendChild(top);
            const body = el('div', 'jc-body');
            const names = (c.members || []).slice(0, 2).map(m => m.nickname || 'Người xem');
            const rest = Math.max(0, (c.total || 0) - names.length);
            body.appendChild(el('span', 'jc-name', names.join(', ') + (rest > 0 ? ' và ' + rest + ' người khác' : '')));
            card.appendChild(body);
            card.appendChild(el('div', 'jc-shine'));
            return { card, xuNum: null, xu: 0 };
        }
        function buildCard(c) {
            if (c.kind === 'group') return buildGroupCard(c);
            const skins = ['violet', 'ice', 'amber', 'flame', 'diamond', 'imperial'];
            const card = el('div', 'jc-card skin-' + (skins.includes(c.skin) ? c.skin : 'violet') + (c.late ? ' jc-late' : '') + (c.frameUrl ? ' has-frame' : ''));
            const u = c.user || {};
            // Avatar + khung
            const wrap = el('div', 'jc-ava-wrap');
            wrap.appendChild(el('div', 'jc-halo'));    // hào quang thở + hạt sáng bay quanh
            wrap.appendChild(el('div', 'jc-orbit'));   // luồng sáng sao chổi chạy quanh viền
            wrap.appendChild(el('div', 'jc-ring'));
            const ava = el('img', 'jc-ava');
            ava.alt = '';
            ava.onerror = () => { ava.onerror = null; ava.src = '/api/games/vipwelcome/avatar'; };   // route trả avatar mặc định
            ava.src = u.avatar || '/api/games/vipwelcome/avatar';
            wrap.appendChild(ava);
            if (c.frameUrl) { const fr = el('img', 'jc-frame'); fr.alt = ''; fr.src = c.frameUrl; fr.onerror = () => { card.classList.remove('has-frame'); fr.remove(); }; wrap.appendChild(fr); }
            card.appendChild(wrap);
            // Hàng chip trên: danh hiệu · LV · FAN LV · VÀO PHÒNG
            const top = el('div', 'jc-top');
            if (c.title) top.appendChild(el('span', 'jc-chip jc-title', c.title));
            if (u.level > 0) top.appendChild(el('span', 'jc-chip jc-lv', 'LV ' + u.level));
            if (u.fansLevel > 0) top.appendChild(el('span', 'jc-chip jc-fan', 'FAN LV.' + u.fansLevel));
            top.appendChild(el('span', 'jc-enter', c.late ? 'ĐANG Ở TRONG PHÒNG' : (c.enterText || 'VÀO PHÒNG')));
            card.appendChild(top);
            // Thân: tên + 💎
            const body = el('div', 'jc-body');
            body.appendChild(el('span', 'jc-name', u.nickname || u.uniqueId || 'Người xem'));
            const xu = el('span', 'jc-xu');
            xu.appendChild(el('span', 'gem', '💎'));
            const xuNum = el('b', '', '0');
            xu.appendChild(xuNum);
            const hideZero = currentCfg?.joinCard?.hideZeroXu !== false;
            if (!(c.xu > 0) && hideZero) xu.classList.add('hidden');
            body.appendChild(xu);
            card.appendChild(body);
            // Dòng phụ: @id + vai trò
            const sub = el('div', 'jc-sub');
            if (u.uniqueId) sub.appendChild(el('span', 'jc-uid', '@' + u.uniqueId));
            const r = c.roles || {};
            if (r.top > 0) sub.appendChild(el('span', 'jc-role top', 'TOP ' + r.top));
            if (r.mod) sub.appendChild(el('span', 'jc-role mod', 'MOD'));
            if (r.sub) sub.appendChild(el('span', 'jc-role sub', 'SUB'));
            if (r.friend) sub.appendChild(el('span', 'jc-role friend', 'BẠN BÈ'));
            // Khách quen: lần đầu / lần thứ N / chuỗi buổi liền (từ 3 buổi)
            const v = c.visit;
            if (v && v.visitNo > 0) {
                sub.appendChild(el('span', 'jc-visit' + (v.isFirst ? ' first' : ''), v.isFirst ? '🎉 Lần đầu ghé phòng' : 'Ghé lần thứ ' + v.visitNo));
                if (v.streak >= 3) sub.appendChild(el('span', 'jc-visit streak', '🔥 ' + v.streak + ' buổi liền'));
            }
            card.appendChild(sub);
            // Ánh quét + lấp lánh
            card.appendChild(el('div', 'jc-shine'));
            [[118, 18, 0], [260, 140, .5], [420, 8, .9], [600, 120, 1.3], [40, 130, 1.6]].forEach(([x, y, d]) => {
                const s = el('span', 'jc-spark');
                s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.animationDelay = d + 's';
                card.appendChild(s);
            });
            return { card, xuNum, xu: Number(c.xu) || 0 };
        }
        function removeCard(card, fast) {
            if (!card || card.classList.contains('out')) return;
            clearTimeout(card._jcTimer);
            card.classList.add('out');
            if (fast) card.classList.add('fast');
            setTimeout(() => card.remove(), fast ? 280 : 440);
        }

        // ===== Thanh chào gọn (joinCard.style = 'bar') — 3 tầng cố định sát mép trên bình luận =====
        // Xếp tầng / ưu tiên / hàng chờ / thời gian giữ / điểm nhấn: bar-slots.js (có test). CSS: joinbar.css.
        const barStackEl = document.getElementById('jb-stack');
        const BAR_TIER = { ice: 't1', violet: 't2', amber: 't3', flame: 't4', diamond: 't5', imperial: 't6' };
        const BAR_RANK = { ice: 0, violet: 1, amber: 2, flame: 3, diamond: 4, imperial: 5 };
        // OBS (CEF) cũ thiếu tính năng → tự lùi: không offset-path = bỏ sao băng (giãn sớm), không @property = tắt viền chạy
        const SUPPORT_PATH = !!(window.CSS && CSS.supports && CSS.supports('offset-path', "path('M 0 0')"));
        const SUPPORT_PROP = !!(window.CSS && CSS.registerProperty);
        const DEFAULT_AVA = '/api/games/vipwelcome/avatar';
        let barSlots = null, barSlotsN = 0;
        const barTimers = new Set();
        function isBarStyle() { return (currentCfg?.joinCard?.style || 'bar') !== 'card'; }
        function barCfg() {
            return Object.assign({ xPercent: 2, yPercent: 68, scale: 100, slots: 3, wow: true }, currentCfg?.joinCard?.bar || {});
        }
        function ensureBarSlots() {
            const n = Math.max(1, Math.min(3, Number(barCfg().slots) || 3));
            if (!barSlots || barSlotsN !== n) {
                clearBars();
                barSlots = HpBarSlots.createBarSlots({ slots: n, maxWaitMs: 8000, maxQueue: 6 });
                barSlotsN = n;
            }
            return barSlots;
        }
        function applyBarLayout() {
            const b = barCfg();
            const base = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
            barStackEl.style.setProperty('--jb-x', b.xPercent + '%');
            barStackEl.style.setProperty('--jb-y', b.yPercent + '%');
            barStackEl.style.setProperty('--jb-scale', String(base * (b.scale || 100) / 100));
            barStackEl.classList.toggle('wow', b.wow !== false);
            barStackEl.classList.toggle('no-prop', !SUPPORT_PROP);
            // đổi kiểu thẻ → dọn kiểu còn lại
            if (isBarStyle()) stackEl.innerHTML = ''; else clearBars();
        }
        // Nạp sẵn ảnh (tối đa ms) để avatar không lăn vào là vòng rỗng; lỗi → avatar mặc định
        function preloadImg(url, ms) {
            return new Promise(res => {
                if (!url) return res(DEFAULT_AVA);
                const im = new Image();
                let done = false;
                const fin = (v) => { if (!done) { done = true; res(v); } };
                im.onload = () => fin(url);
                im.onerror = () => fin(DEFAULT_AVA);
                setTimeout(() => fin(url), ms);   // quá giờ: vẫn dùng url, ảnh tự hiện khi tải xong
                im.src = url;
            });
        }
        function barAvatar(skin, src, frameUrl) {
            const host = el('div', 'jc-card skin-' + skin + (frameUrl ? ' has-frame' : ''));
            const w = el('div', 'jc-ava-wrap');
            w.append(el('div', 'jc-halo'), el('div', 'jc-orbit'), el('div', 'jc-ring'));
            const a = el('img', 'jc-ava');
            a.alt = '';
            a.onerror = () => { a.onerror = null; a.src = DEFAULT_AVA; };
            a.src = src || DEFAULT_AVA;
            w.appendChild(a);
            if (frameUrl) {
                const fr = el('img', 'jc-frame');
                fr.alt = ''; fr.src = frameUrl;
                fr.onerror = () => { host.classList.remove('has-frame'); fr.remove(); };
                w.appendChild(fr);
            }
            host.appendChild(w);
            const box = el('div', 'vb-ava');
            box.appendChild(host);
            return box;
        }
        // Tên tách TỪNG CHỮ để hiện so le. Quá 20 ký tự thì cắt trước (chữ inline-block không tự hiện "…").
        function barName(text) {
            const arr = Array.from(String(text || 'Người xem').normalize('NFC'));
            const shown = arr.length > 20 ? arr.slice(0, 19).concat('…') : arr;
            const nm = el('span', 'vb-name');
            shown.forEach((ch, i) => {
                const sp = el('span', 'ch', ch === ' ' ? '\u00a0' : ch);
                sp.style.setProperty('--i', i);
                nm.appendChild(sp);
            });
            return nm;
        }
        function buildBar(item) {
            const c = item.card;
            const group = c.kind === 'group';
            const skin = BAR_TIER[c.skin] ? c.skin : 'violet';
            const early = group || skin === 'ice' || !SUPPORT_PATH;
            const b = el('div', 'vb ' + (group ? 'group' : BAR_TIER[skin]) + (early ? ' early' : ''));
            if (group) {
                const avs = el('div', 'vb-avas');
                item.memberSrcs.forEach(src => {
                    const a = el('img');
                    a.alt = '';
                    a.onerror = () => { a.onerror = null; a.src = DEFAULT_AVA; };
                    a.src = src || DEFAULT_AVA;
                    avs.appendChild(a);
                });
                b.appendChild(avs);
            } else {
                b.appendChild(barAvatar(skin, item.avaSrc, c.frameUrl));
            }
            const bar = el('div', 'vb-bar');
            bar.appendChild(el('span', 'vb-edge'));
            if (!group && c.title) {
                const xt = el('span', 'vb-x');
                xt.append(el('span', 'vb-title', c.title), el('span', 'vb-sep', '✦'));
                bar.appendChild(xt);
            }
            if (group) {
                const names = (c.members || []).slice(0, 2).map(m => m.nickname || 'Người xem');
                const rest = Math.max(0, (c.total || 0) - names.length);
                bar.appendChild(el('span', 'vb-name', names.join(', ') + (rest > 0 ? ' và ' + rest + ' người khác' : '')));
            } else {
                bar.appendChild(barName(c.user?.nickname || c.user?.uniqueId));
            }
            const accent = group ? '' : HpBarSlots.accentOf(c);
            const xe = el('span', 'vb-x');
            xe.appendChild(el('span', 'vb-enter' + (accent ? ' accent' : ''), c.late ? 'ĐANG Ở TRONG PHÒNG' : (accent || c.enterText || 'VÀO PHÒNG')));
            bar.append(xe, el('span', 'vb-cap'));
            [[22, 8], [48, 70], [63, 18], [80, 64], [92, 26]].forEach(([x, y], i) => {   // bụi sao (CSS chỉ bật từ Đại gia + WOW)
                const sp = el('span', 'vb-spk', '✦');
                sp.style.left = x + '%'; sp.style.top = (y - 20) + '%';
                sp.style.animationDelay = ((early ? 1200 : 2700) + i * 330) + 'ms';
                bar.appendChild(sp);
            });
            b.appendChild(bar);
            if (!early) {
                b.appendChild(el('div', 'vb-meteor'));
                for (let i = 1; i <= 10; i++) {   // hạt đuôi trễ dần, nhỏ dần → vệt uốn theo đường tròn
                    const d = el('div', 'vb-trail');
                    d.style.animationDelay = (1000 + i * 26) + 'ms';
                    d.style.width = d.style.height = Math.max(2.5, 8 - i * 0.55) + 'px';
                    b.appendChild(d);
                }
                b.append(el('div', 'vb-glow'), el('div', 'vb-ripple'), el('div', 'vb-ripple'));
            }
            const hold = HpBarSlots.holdMs(group ? 0 : BAR_RANK[skin], cardCfg().durationMs, early);
            b.style.setProperty('--out', hold + 'ms');
            return { node: b, hold };
        }
        function setBarSlot(item, k) { if (item && item.node) item.node.style.setProperty('--slot', k); }
        function retireBar(item) {
            if (!item || !item.node || item.node._gone) return;
            item.node._gone = true;
            clearTimeout(item.timer); barTimers.delete(item.timer);
            item.node.classList.add('gone');
            setTimeout(() => item.node.remove(), 520);
        }
        function mountBar(item, r) {
            if (r.retired) retireBar(r.retired);
            for (const m of r.moves) setBarSlot(m.item, m.slot);
            const { node: bar, hold } = buildBar(item);
            item.node = el('div', 'vb-slot');
            item.node.appendChild(bar);
            setBarSlot(item, 0);
            barStackEl.appendChild(item.node);
            item.timer = setTimeout(() => {
                barTimers.delete(item.timer);
                if (item.node._gone) return;
                item.node.remove();
                const next = barSlots && barSlots.remove(item, Date.now());
                if (next) showWaitingBar(next);
            }, hold + 700);
            barTimers.add(item.timer);
        }
        function showWaitingBar(item) {
            const r = barSlots.place(item, Date.now());
            if (r.shown) mountBar(item, r);
        }
        // Ảnh tải SONG SONG nhưng thanh hiện đúng THỨ TỰ vào phòng (chuỗi barChain) — người tải ảnh chậm không bị người sau chen trước.
        let barChain = Promise.resolve();
        function showBar(c) {
            const slots = ensureBarSlots();
            const group = c.kind === 'group';
            const item = {
                id: c.id, card: c,
                // server gửi priority (bậc = 100 + minLevel, người chỉ định = 1000, gộp = 0); thiếu thì suy theo skin
                priority: Number.isFinite(Number(c.priority)) && c.priority != null ? Number(c.priority) : (group ? 0 : 100 + (BAR_RANK[c.skin] || 0) * 10)
            };
            const ready = group
                ? Promise.all((c.members || []).slice(0, 3).map(m => preloadImg(m.avatar, 500))).then(v => { item.memberSrcs = v; })
                : preloadImg(c.user?.avatar, 600).then(v => { item.avaSrc = v; });
            barChain = barChain.then(() => ready).then(() => {
                if (barSlots !== slots) return;   // cấu hình đổi trong lúc chờ ảnh
                const r = slots.place(item, Date.now());
                if (r.shown) mountBar(item, r);
            }).catch(() => {});
        }
        function clearBars() {
            barChain = Promise.resolve();
            for (const t of barTimers) clearTimeout(t);
            barTimers.clear();
            barStackEl.innerHTML = '';
            if (barSlots) barSlots.clear();
        }
        function showCard(c) {
            if (!c || !c.id || seenCards.has(c.id)) return;
            seenCards.add(c.id);
            if (seenCards.size > SEEN_MAX) seenCards.delete(seenCards.values().next().value);
            if (isBarStyle()) {
                showBar(c);
                try { socket.emit('vipwelcome:cardShown', { id: c.id }); } catch (e) {}
                return;
            }
            const cc = cardCfg();
            const live = [...stackEl.querySelectorAll('.jc-card:not(.out)')];
            // Đầy → thẻ cũ nhất rút ngắn, ra nhanh
            const max = Math.max(1, Number(cc.maxStack) || 3);
            const oldestFirst = cc.direction === 'down' ? live.reverse() : live;
            for (let i = 0; i <= oldestFirst.length - max; i++) removeCard(oldestFirst[i], true);
            const { card, xuNum, xu } = buildCard(c);
            if (cc.direction === 'down') stackEl.prepend(card); else stackEl.appendChild(card);
            if (xu > 0) xuNum.textContent = fmtXu(xu);   // đo tên với độ rộng ô xu cuối cùng
            fitCard(card);
            if (xu > 0) countUp(xuNum, xu);
            card._jcTimer = setTimeout(() => removeCard(card, false), Math.max(1500, Number(cc.durationMs) || 5000));
            try { socket.emit('vipwelcome:cardShown', { id: c.id }); } catch (e) {}
        }
        function clearCards() {
            stackEl.innerHTML = '';
            clearBars();
        }
        window.addEventListener('resize', applyCardLayout);
        window.addEventListener('resize', applyBarLayout);
        applyCardLayout();
        applyBarLayout();

        let offlineTimer = null;
        const OFFLINE_GRACE_MS = 3000;
        function showOffline() {
            document.body.classList.add('offline');
            clearPlayer(); clearAudio(); hideLabel(); clearCards();
            queue.length = 0; playing = false;
        }
        function hideOffline() { document.body.classList.remove('offline'); }
        function scheduleOffline() {
            clearTimeout(offlineTimer);
            offlineTimer = setTimeout(showOffline, OFFLINE_GRACE_MS);
        }
        function cancelOffline() {
            clearTimeout(offlineTimer); offlineTimer = null;
            hideOffline();
        }

        const socket = io({ reconnection: true, reconnectionDelay: 600, reconnectionDelayMax: 5000 });

        async function syncFromServer() {
            try {
                const r = await fetch('/api/games/vipwelcome/config');
                currentCfg = await r.json();
                applyDisplay();
                applyCardLayout();
                applyBarLayout();
            } catch (e) {}
            socket.emit('subscribe', 'overlay');
            socket.emit('subscribe', 'overlay:vipwelcome');   // room riêng → server đếm đúng overlay VIP đang mở
        }

        socket.on('connect', () => {
            debugEl.textContent = 'connected';
            debugEl.classList.remove('hidden');
            setTimeout(() => debugEl.classList.add('hidden'), 2500);
            cancelOffline();
            syncFromServer();
        });
        socket.on('disconnect', (reason) => {
            debugEl.textContent = 'disconnected: ' + reason;
            debugEl.classList.remove('hidden');
            scheduleOffline();
        });

        socket.on('gameConfig', ({ gameId, config }) => {
            if (gameId !== 'vipwelcome') return;
            currentCfg = config;
            applyDisplay();
            applyCardLayout();
            applyBarLayout();
        });

        socket.on('vipwelcome:play', (payload) => { fire(payload); });
        socket.on('vipwelcome:card', (card) => { showCard(card); });
        // Phím tắt "bỏ qua": kết thúc mục đang phát (video/âm thanh/giọng đọc) → báo xong → server phát mục kế
        socket.on('vipwelcome:skip', () => { if (currentFinish) currentFinish(); });
        socket.on('vipwelcome:stop', () => {
            queue.length = 0;
            clearTimeout(playWatchdog);
            currentFinish = null;
            clearPlayer(); clearAudio(); hideLabel(); clearCards();
            playing = false;
        });
        // Force reload — gửi từ app sau khi user đổi setting để OBS browser source cập nhật
        socket.on('vipwelcome:reload', () => {
            try { location.reload(true); } catch (e) { location.reload(); }
        });
        // Reload chung toàn app (mọi overlay khác đều nghe) — trước đây VIP là overlay duy nhất bỏ qua
        socket.on('overlay:reload', (data) => {
            if (!data || !data.gameId || data.gameId === 'vipwelcome') location.reload();
        });

        fetch('/api/games/vipwelcome/config').then(r => r.json()).then(cfg => {
            currentCfg = cfg; applyDisplay(); applyCardLayout();
        }).catch(() => { showOffline(); });
    })();
    </script>
</body>
</html>
