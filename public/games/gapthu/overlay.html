<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Gắp Thú</title>
<style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none;
        font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; color: #fff; }
    body.gapthu-bg { background: radial-gradient(ellipse at 50% 35%, #3a2c55 0%, #151225 70%); }
    #gapthu-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #gapthu-box { position: absolute; width: 720px; height: 1080px; transform-origin: 50% 50%; }
    #gapthu-box.off { display: none; }
    #gapthu-cv { position: absolute; inset: 0; width: 720px; height: 1080px; }
    .gapthu-who { position: absolute; left: 50%; top: -84px; transform: translate(-50%, -12px); display: flex; align-items: center; gap: 12px;
        padding: 8px 20px 8px 8px; border-radius: 40px; background: rgba(20, 14, 34, .82); border: 2px solid rgba(255,255,255,.25);
        font-size: 30px; font-weight: 800; white-space: nowrap; max-width: 640px; opacity: 0; transition: opacity .2s, transform .2s; }
    .gapthu-who.on { opacity: 1; transform: translate(-50%, 0); }
    .gapthu-who.steer { background: linear-gradient(90deg, #ff3d8b, #7b5cff); border-color: #fff; }
    .gapthu-who img, .gapthu-card img.av { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #443; flex: none; }
    .gapthu-who span { overflow: hidden; text-overflow: ellipsis; }
    .gapthu-who .gi { width: 40px; height: 40px; border-radius: 0; background: none; }
    .gapthu-who b { flex: none; font-size: 24px; padding: 2px 10px; border-radius: 14px; background: rgba(255,255,255,.22); }
    .gapthu-card { position: absolute; left: 50%; top: 360px; width: 580px; transform: translate(-50%, 0) scale(.6); opacity: 0;
        padding: 26px 26px 30px; border-radius: 34px; text-align: center; background: linear-gradient(180deg, #fff8fc, #ffe1ef);
        color: #3a1530; box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 0 0 6px rgba(255,255,255,.6) inset;
        transition: opacity .18s, transform .28s cubic-bezier(.2,1.6,.4,1); pointer-events: none; }
    .gapthu-card.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
    .gapthu-card.lose { background: linear-gradient(180deg, #f3f2f8, #d9d6e8); color: #2b2840; }
    .gapthu-card .top { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 30px; font-weight: 800; }
    .gapthu-card .top span { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gapthu-card .big { font-size: 120px; line-height: 1.1; margin: 8px 0 2px; }
    .gapthu-card .say { font-size: 44px; font-weight: 900; line-height: 1.15; }
    .gapthu-card .sub { font-size: 26px; font-weight: 600; opacity: .7; margin-top: 8px; }
    .gapthu-q { position: absolute; left: 50%; top: 1000px; transform: translateX(-50%); padding: 6px 20px; border-radius: 30px;
        background: rgba(0,0,0,.55); font-size: 28px; font-weight: 800; white-space: nowrap; }
    .gapthu-q[hidden] { display: none; }
    /* 🎮 bảng lệnh tự lái: phủ lên bệ máy */
    .gapthu-steer { position: absolute; left: 40px; top: 850px; width: 640px; height: 190px; box-sizing: border-box; border-radius: 26px;
        padding: 14px 18px; display: none; grid-template-columns: 1fr 230px; gap: 12px; align-items: center;
        background: rgba(16, 10, 30, .9); border: 3px solid rgba(255,255,255,.35); }
    .gapthu-steer.on { display: grid; }
    .gapthu-pad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 50px); gap: 6px; }
    .gapthu-key { display: grid; place-items: center; border-radius: 12px; background: rgba(255,255,255,.12); font-size: 22px; font-weight: 800;
        line-height: 1; text-align: center; transition: background .15s, transform .15s; }
    .gapthu-key i { font-style: normal; font-size: 26px; display: block; }
    .gapthu-key.hit { background: #ffd54a; color: #2a1a00; transform: scale(1.08); }
    .gapthu-key.grab { background: #ff3d8b; }
    .gapthu-key.dim { opacity: .35; }
    .gapthu-meter { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .gapthu-sec { font-size: 64px; font-weight: 900; line-height: 1; }
    .gapthu-sec.hurry { color: #ff6b6b; }
    .gapthu-bar { width: 200px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.18); overflow: hidden; }
    .gapthu-bar > div { height: 100%; width: 100%; background: linear-gradient(90deg, #ffd54a, #ff3d8b); transition: width .25s linear; }
    .gapthu-steps { font-size: 24px; font-weight: 800; opacity: .9; }
    /* 💃 khung "Streamer nhảy" phủ giữa khung hình */
    #gapthu-fx { position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none; }
    .gapthu-dance { position: absolute; left: 50%; top: 50%; width: 900px; transform: translate(-50%, -50%) scale(.6); opacity: 0;
        padding: 40px 40px 46px; box-sizing: border-box; border-radius: 48px; text-align: center; color: #fff;
        background: radial-gradient(circle at 50% 0%, #ff4fa3 0%, #7b3cff 60%, #2b1a6b 100%);
        box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 8px rgba(255,255,255,.85), 0 0 60px 10px rgba(255,79,163,.6);
        transition: opacity .25s, transform .4s cubic-bezier(.2,1.5,.4,1); }
    .gapthu-dance.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    /* tia sáng sân khấu xoay sau khung + lớp bóng kính phía trên (chiều sâu) */
    .gapthu-dance::before { content: ''; position: absolute; left: 50%; top: 50%; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; z-index: -1;
        background: repeating-conic-gradient(from 0deg, rgba(255,225,77,.22) 0 9deg, rgba(255,79,163,0) 9deg 18deg); border-radius: 50%;
        -webkit-mask: radial-gradient(circle, #000 18%, transparent 62%); mask: radial-gradient(circle, #000 18%, transparent 62%); animation: gapthu-spin 14s linear infinite; }
    .gapthu-dance::after, .gapthu-card::after { content: ''; position: absolute; left: 14px; right: 14px; top: 10px; height: 42%; pointer-events: none;
        border-radius: 40px 40px 50% 50% / 40px 40px 26px 26px; background: linear-gradient(rgba(255,255,255,.32), rgba(255,255,255,0)); }
    .gapthu-card { box-shadow: 0 26px 60px rgba(0,0,0,.5), 0 6px 0 rgba(0,0,0,.18), 0 0 0 6px rgba(255,255,255,.6) inset; }
    @keyframes gapthu-spin { to { transform: rotate(360deg); } }
    .gapthu-dance .pic { width: 300px; height: 300px; margin: -150px auto 6px; display: grid; place-items: center; animation: gapthu-bop .5s ease-in-out infinite alternate; }
    .gapthu-dance .pic img, .gapthu-dance .pic canvas { max-width: 300px; max-height: 300px; filter: drop-shadow(0 10px 20px rgba(0,0,0,.45)); }
    .gapthu-dance .who { display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 40px; font-weight: 800; }
    .gapthu-dance .who img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; }
    .gapthu-dance .say { font-size: 64px; font-weight: 900; line-height: 1.12; margin: 14px 0 22px; text-shadow: 0 4px 0 rgba(0,0,0,.25); }
    .gapthu-dance .clock { position: relative; width: 260px; height: 260px; margin: 0 auto; }
    .gapthu-dance .clock svg { position: absolute; inset: 0; transform: rotate(-90deg); }
    .gapthu-dance .clock b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 120px; font-weight: 900; }
    .gapthu-dance .clock.hurry b { color: #ffe14d; animation: gapthu-pulse .5s ease-in-out infinite alternate; }
    .gapthu-dance .sub { font-size: 34px; font-weight: 800; margin-top: 14px; opacity: .92; }
    .gapthu-dance.bye .clock, .gapthu-dance.bye .say { display: none; }
    @keyframes gapthu-bop { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-18px) rotate(6deg); } }
    @keyframes gapthu-pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
    body.gapthu-shot * { transition: none !important; animation: none !important; }
</style>
</head>
<body>
<div id="gapthu-stage">
    <div id="gapthu-box">
        <canvas id="gapthu-cv" width="720" height="1080"></canvas>
        <div class="gapthu-who" id="gapthu-who"></div>
        <div class="gapthu-card" id="gapthu-card"></div>
        <div class="gapthu-steer" id="gapthu-steer">
            <div class="gapthu-pad">
                <div></div><div class="gapthu-key" data-dir="0,1"><i>⬆</i>vào</div><div></div>
                <div class="gapthu-key" data-dir="-1,0"><i>⬅</i>trái</div><div class="gapthu-key grab" data-dir="grab"><i>✊</i>gắp</div><div class="gapthu-key" data-dir="1,0"><i>➡</i>phải</div>
                <div></div><div class="gapthu-key" data-dir="0,-1"><i>⬇</i>ra</div><div></div>
            </div>
            <div class="gapthu-meter">
                <div class="gapthu-sec" id="gapthu-sec">15</div>
                <div class="gapthu-bar"><div id="gapthu-bar"></div></div>
                <div class="gapthu-steps" id="gapthu-steps">còn 8 bước</div>
            </div>
        </div>
        <div class="gapthu-q" id="gapthu-q" hidden></div>
    </div>
    <canvas id="gapthu-fx" width="1080" height="1920"></canvas>
    <div class="gapthu-dance" id="gapthu-dance">
        <div class="pic" id="gapthu-dance-pic"></div>
        <div class="who" id="gapthu-dance-who"></div>
        <div class="say" id="gapthu-dance-say"></div>
        <div class="clock" id="gapthu-dance-clock">
            <svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="116" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="18"/>
                <circle id="gapthu-dance-ring" cx="130" cy="130" r="116" fill="none" stroke="#ffe14d" stroke-width="18" stroke-linecap="round" stroke-dasharray="728.85" stroke-dashoffset="0"/></svg>
            <b id="gapthu-dance-sec">30</b>
        </div>
        <div class="sub" id="gapthu-dance-sub">💃 Nhảy đi nào!</div>
    </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/lib/overlay-hello.js" data-game="gapthu"></script>
<script>
/* 🕹️ Gắp Thú — overlay OBS 1080×1920 trong suốt. Server quyết kết quả (socket 'gapthu:turn' / 'gapthu:steer' / 'gapthu:drop'),
 * overlay chỉ diễn. Đống giải = lưới 7×3 server gửi (layout: id giải mỗi ô, hàng 0 sát kính).
 * Lượt tự gắp: càng chạy tới ô → hạ → kẹp → nâng → về cửa / tuột, trong đúng turn.ms.
 * Lượt TỰ LÁI (quà lớn): bảng lệnh ở bệ máy, càng trượt theo lệnh bình luận của người tặng, "gắp"/hết giờ → 'gapthu:drop'.
 * ?review=1 khung xem thử, ?demo=1 lượt giả (có tự lái), ?bg=1 nền tối, ?mute=1 tắt tiếng,
 * ?shot=win:0.9 | lose:0.6 | empty:0.5 | steer | steerdrop:0.3 đóng băng 1 khung. Spec 2026-11-12-gapthu-xucxac-design.md §3 */
(function () {
    'use strict';
    const qs = new URLSearchParams(location.search);
    const isReview = qs.get('review') === '1', isDemo = qs.get('demo') === '1', muted = qs.get('mute') === '1';
    const shotSpec = qs.get('shot');
    if (qs.get('bg') === '1') document.body.classList.add('gapthu-bg');
    if (shotSpec) document.body.classList.add('gapthu-shot');
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const stage = $('gapthu-stage'), box = $('gapthu-box'), cv = $('gapthu-cv'), ctx = cv.getContext('2d');

    const THEMES = {
        pink: { frame: '#ff5c9d', frame2: '#c2306d', sign: '#ffe4f0', signText: '#c2306d', glass: 'rgba(255,214,234,.16)', base: '#ff7db0', bulb: ['#fff59d', '#ffffff'] },
        mint: { frame: '#26c6a2', frame2: '#12866b', sign: '#e0fff6', signText: '#0f7a61', glass: 'rgba(200,255,240,.14)', base: '#4fd8b8', bulb: ['#fffde7', '#b2fff0'] },
        night: { frame: '#5b5bd6', frame2: '#2f2f8f', sign: '#14143a', signText: '#9ef0ff', glass: 'rgba(140,160,255,.14)', base: '#6c6cf0', bulb: ['#ff6ad5', '#62f6ff'] }
    };
    let cfg = { enabled: true, prizes: [], display: { x: 50, y: 55, scale: 100, theme: 'pink', showQueue: true }, sound: { enabled: true, volume: 0.6 } };
    let disabled = false;

    // ---------- bố cục 1080×1920 → cửa sổ ----------
    function fit() {
        const k = Math.min(innerWidth / 1080, innerHeight / 1920);
        stage.style.transform = `scale(${k})`;
        stage.style.left = ((innerWidth - 1080 * k) / 2) + 'px';
        stage.style.top = ((innerHeight - 1920 * k) / 2) + 'px';
    }
    function layoutBox() {
        const d = cfg.display || {};
        box.style.left = (1080 * (d.x ?? 50) / 100 - 360) + 'px';
        box.style.top = (1920 * (d.y ?? 55) / 100 - 540) + 'px';
        box.style.transform = `scale(${(Number(d.scale) || 100) / 100})`;
        box.classList.toggle('off', disabled);
    }
    addEventListener('resize', fit); fit();

    // ---------- hình học tủ (toạ độ canvas 720×1080) + lưới giải 7×3 ----------
    const G = { glassL: 40, glassR: 680, glassT: 140, glassB: 820, rail: 176, homeX: 128, upY: 236, pileL: 230, pileR: 650, floor: 806 };
    const COLS = 7, ROWS = 3, CELLS = COLS * ROWS;
    const cellPos = i => ({ col: i % COLS, row: Math.floor(i / COLS) });
    const cellIndex = p => p.row * COLS + p.col;
    // hàng 0 sát kính (thấp, to), hàng 2 trong cùng (cao, nhỏ) — vẽ hàng trong trước
    function cellXY(i) {
        const { col, row } = cellPos(i);
        const jx = ((i * 37) % 11 - 5) * 1.6, jy = ((i * 13) % 7 - 3) * 1.6;
        return { x: G.pileL + (col + 0.5) / COLS * (G.pileR - G.pileL) + jx, y: G.floor - 36 - row * 54 + jy, s: 74 - row * 7, r: ((i * 29) % 9 - 4) * 0.06 };
    }
    const colX = col => G.pileL + (col + 0.5) / COLS * (G.pileR - G.pileL);
    const downYOf = cell => cellXY(cell).y - 70;
    let layout = null;          // id giải mỗi ô (server gửi)
    const DANCE = '__dance';
    const iconOf = id => id === DANCE ? DANCE : (((cfg.prizes || []).find(p => p.id === id) || {}).icon || (id ? '🎁' : ''));
    // ảnh giải Streamer (streamer tải lên); chưa có / lỗi → huy hiệu tự vẽ
    let danceImg = null, danceImgSrc = '';
    function loadDanceImg() {
        const src = cfg.dance && cfg.dance.image || '';
        if (src === danceImgSrc) return;
        danceImgSrc = src; danceImg = null;
        if (!src) return;
        const im = new Image(); im.onload = () => { if (danceImgSrc === src) danceImg = im; }; im.src = src;
    }
    function drawDanceToken(g, x, y, size, t) {
        g.save(); g.translate(x, y);
        // hào quang nhấp nháy
        const glow = g.createRadialGradient(0, 0, size * .1, 0, 0, size * .75);
        glow.addColorStop(0, 'rgba(255,225,77,.85)'); glow.addColorStop(1, 'rgba(255,225,77,0)');
        g.fillStyle = glow; g.globalAlpha = .7 + Math.sin((t || 0) / 200) * .3; g.beginPath(); g.arc(0, 0, size * .75, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
        if (danceImg) {
            const k = Math.min(size * 1.15 / danceImg.width, size * 1.15 / danceImg.height);
            g.drawImage(danceImg, -danceImg.width * k / 2, -danceImg.height * k / 2, danceImg.width * k, danceImg.height * k);
        } else {
            // sao vàng 5 cánh + 💃 + nhãn LIVE
            g.fillStyle = '#ffd23f'; g.strokeStyle = '#fff'; g.lineWidth = Math.max(2, size * .05);
            g.beginPath();
            for (let i = 0; i < 10; i++) { const r = i % 2 ? size * .26 : size * .55, a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
            g.closePath(); g.fill(); g.stroke();
            g.font = `${size * .5}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillText('💃', 0, size * .02);
            g.fillStyle = '#ff2e63'; const w = size * .62, h = size * .2;
            g.beginPath(); g.roundRect ? g.roundRect(-w / 2, size * .36, w, h, h / 2) : g.rect(-w / 2, size * .36, w, h); g.fill();
            g.fillStyle = '#fff'; g.font = `900 ${h * .78}px "Be Vietnam Pro","Segoe UI",sans-serif`; g.fillText('LIVE', 0, size * .36 + h * .55);
        }
        g.restore();
    }
    function localLayout() {     // demo / chụp ảnh / chưa nhận được từ server
        const ps = (cfg.prizes || []).filter(p => p && p.weight > 0);
        const ids = ps.length ? ps.map(p => p.id) : [null];
        return Array.from({ length: CELLS }, (_, i) => ids[(i * 5 + Math.floor(i / 3)) % ids.length]);
    }
    const getLayout = () => layout || (layout = localLayout());

    // ---------- trạng thái hoạt cảnh ----------
    let turn = null;            // lượt đang diễn
    let steer = null;           // { pos, stepsLeft, steps, sec, endsAt } khi đang tự lái (chưa thả)
    let lastIdleDraw = 0, clawX = G.homeX, lastFrame = 0;
    const queueLeft = { n: 0 };
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
    // pha theo phần của turn.ms; lượt thả sau tự lái bỏ gần hết pha chạy ngang (càng đã ở trên ô)
    const P_AUTO = { move: [0, .22], down: [.22, .42], close: [.42, .5], up: [.5, .7], carry: [.7, .85], card: .84 };
    const P_DROP = { move: [0, .06], down: [.06, .3], close: [.3, .38], up: [.38, .6], carry: [.6, .8], card: .8 };

    function clawState(now) {
        if (!turn || !turn.result) return { x: clawX, y: G.upY, open: .9, carry: null };
        const P = turn.P, r = turn.result;
        const p = clamp((now - turn.t0) / turn.ms, 0, 1.2);
        const tx = colX(cellPos(r.cell).col), dy = downYOf(r.cell), sx = turn.startX;
        let x = sx, y = G.upY, open = .9, carry = null;
        if (p < P.down[0]) x = sx + (tx - sx) * ease(seg(p, ...P.move));
        else if (p < P.close[0]) { x = tx; y = G.upY + (dy - G.upY) * ease(seg(p, ...P.down)); }
        else if (p < P.up[0]) { x = tx; y = dy; open = .9 - .9 * seg(p, ...P.close); }
        else if (p < P.carry[0]) {
            const u = ease(seg(p, ...P.up));
            x = tx; y = dy - (dy - G.upY) * u; open = 0;
            if (r.kind === 'slip' && seg(p, ...P.up) >= r.slipAt) { open = .35; if (!turn.dropT) { turn.dropT = now; turn.dropFrom = { x, y: y + 66 }; sfx('slip'); } }
        } else {
            const u = ease(seg(p, ...P.carry));
            x = tx + (G.homeX - tx) * u; y = G.upY; open = r.win ? (u > .92 ? .9 : 0) : .35;
            if (r.win && u > .92 && !turn.dropT) { turn.dropT = now; turn.dropFrom = { x, y: y + 66 }; sfx('win'); }
            if (!r.win && p >= P.carry[1] && !turn.loseSaid) { turn.loseSaid = true; sfx('lose'); }
        }
        if (p >= P.close[0] && !turn.grabbed) {
            turn.grabbed = true;
            turn.grabIcon = r.kind === 'empty' ? '' : (r.win && r.prize ? r.prize.icon : iconOf(getLayout()[r.cell]));
            sfx('clink');
        }
        if (p >= P.close[1] && !turn.dropT && turn.grabIcon) carry = turn.grabIcon;
        clawX = x;
        return { x, y, open, carry };
    }
    function steerClaw(now) {
        // càng trượt mượt tới cột đích (không nhảy cóc)
        const dt = Math.min(0.05, Math.max(0, (now - (lastFrame || now)) / 1000));
        const tx = colX(steer.pos.col);
        clawX += (tx - clawX) * Math.min(1, dt * 9);
        if (Math.abs(tx - clawX) < 0.5) clawX = tx;
        return { x: clawX, y: G.upY, open: .9, carry: null };
    }

    // ---------- vẽ 2.5D ----------
    // Lớp tĩnh (thân tủ, vách trong, sàn, kính, bệ) vẽ sẵn 1 lần vào canvas đệm theo màu tủ → mỗi khung chỉ dán ảnh +
    // vẽ phần động (đèn, đống giải, càng). Giải = viên nang gacha bóng loáng (cache theo biểu tượng + cỡ).

    // ---- viên nang giải thưởng (cache) ----
    const capCache = new Map();
    function hueOf(icon) { let h = 0; for (const ch of String(icon)) h = (h * 31 + ch.codePointAt(0)) % 360; return h; }

    function draw(now) {

            ctx.fillStyle = 'rgba(80,45,0,.85)'; ctx.font = `900 30px ${FONT}`; ctx.fillText('GẮP', 500, 944);
        }
        lastFrame = now;
    }
    // càng 3 chấu mạ chrome; carry = giải đang kẹp (vẽ giữa các chấu, chấu trước đè lên)
    function drawClaw(x, y, open, carry) {
        ctx.save(); ctx.translate(x, y);
        const prong = (side, front) => {
            const a = -side * (-0.12 + open * 0.62);
            ctx.save(); ctx.translate(side * 15, 10); ctx.rotate(a);
            ctx.fillStyle = lin(ctx, -6, 0, 6, 0, front ? [[0, '#8d93a6'], [.45, '#ffffff'], [1, '#6c7286']] : [[0, '#5d6274'], [1, '#9aa0b3']]);
            ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.lineTo(side * 22 + 4, 44); ctx.lineTo(side * 6 + 3, 82); ctx.lineTo(side * 2 - 3, 80); ctx.lineTo(side * 16 - 4, 44); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#3d4152'; ctx.beginPath(); ctx.arc(0, 2, 5, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        };
        prong(0, false);   // chấu sau (giữa, tối)
        if (carry) { ctx.restore(); emoji(carry, x, y + 64, 72, 0); ctx.save(); ctx.translate(x, y); }
        prong(-1, true); prong(1, true);
        // thân trụ chrome
        ctx.fillStyle = lin(ctx, -28, 0, 28, 0, [[0, '#6f7488'], [.35, '#ffffff'], [.6, '#c9cdd9'], [1, '#5b6073']]);
        rr(-28, -18, 56, 34, 12); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.6)'; rr(-20, -14, 40, 6, 3); ctx.fill();
        ctx.fillStyle = '#ff3d8b'; ctx.beginPath(); ctx.arc(0, 4, 4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    // ---------- thẻ người tặng + kết quả ----------
    function avatarImg(url) { return url ? `<img class="av" src="${esc(url)}" alt="" onerror="this.style.visibility='hidden'">` : ''; }
    function showWho(t, steering) {
        const w = $('gapthu-who');
        w.classList.toggle('steer', !!steering);
        w.innerHTML = `${avatarImg(t.avatar)}<span>${esc(t.nickname || 'Ẩn danh')}</span>${steering ? '<b>🎮 đang lái</b>' : ''}${t.giftImage ? `<img class="gi" src="${esc(t.giftImage)}" alt="">` : ''}`;
        w.classList.add('on');
    }
    let cardTimer = 0;
    function showCard(t) {
        const card = $('gapthu-card'), r = t.result;
        card.classList.toggle('lose', !r.win);
        const head = `<div class="top">${avatarImg(t.avatar)}<span>${esc(t.nickname || 'Ẩn danh')}</span></div>`;
        const pity = r.pityLeft ? `<div class="sub">Còn ${r.pityLeft} lượt trượt nữa là chắc trúng</div>` : '';
        card.innerHTML = r.win && r.prize.dance
            ? `${head}<div class="big">💃</div><div class="say">gắp trúng STREAMER!</div>`
            : r.win
            ? `${head}<div class="big">${esc(r.prize.icon)}</div><div class="say">gắp được ${esc(r.prize.name)}!</div>${r.pityHit ? '<div class="sub">🍀 Bảo hiểm gắp trúng</div>' : (t.mode === 'steer' ? '<div class="sub">🎮 Tay lái lụa!</div>' : '')}`
            : r.kind === 'empty'
                ? `${head}<div class="big">🫣</div><div class="say">Hụt rồi - khép vào khoảng không!</div>${pity}`
                : `${head}<div class="big">😝</div><div class="say">Tuột mất rồi!</div>${pity}`;
        card.classList.add('on');
        clearTimeout(cardTimer);
        cardTimer = setTimeout(hideCard, Math.max(1400, t.ms * 0.2 + 1500));
    }
    function hideCard() { $('gapthu-card').classList.remove('on'); }
    function renderQueue() {
        const q = $('gapthu-q');
        q.hidden = !(cfg.display?.showQueue !== false && queueLeft.n > 0) || !!steer;
        q.textContent = `⏳ còn ${queueLeft.n} lượt`;
    }

    // ---------- bảng lệnh tự lái ----------
    let steerTick = 0;
    function renderSteer() {
        const el = $('gapthu-steer');
        el.classList.toggle('on', !!steer);
        if (!steer) { clearInterval(steerTick); steerTick = 0; return; }
        const left = Math.max(0, Math.ceil((steer.endsAt - performance.now()) / 1000));
        $('gapthu-sec').textContent = left + 's';
        $('gapthu-sec').classList.toggle('hurry', left <= 5);
        $('gapthu-bar').style.width = Math.round(100 * clamp(left / (steer.sec || 15), 0, 1)) + '%';
        $('gapthu-steps').textContent = steer.stepsLeft > 0 ? `còn ${steer.stepsLeft} bước` : 'hết bước - bình luận "gắp"';
        el.querySelectorAll('.gapthu-key:not(.grab)').forEach(k => k.classList.toggle('dim', steer.stepsLeft <= 0));
        if (!steerTick) steerTick = setInterval(renderSteer, 250);
    }
    function flashKey(dir) {
        const key = $('gapthu-steer').querySelector(`[data-dir="${dir}"]`);
        if (!key) return;
        key.classList.add('hit'); setTimeout(() => key.classList.remove('hit'), 320);
    }

    // ---------- nhận lượt ----------
    function startTurn(t) {
        if (disabled || !t) return;
        hideCard();
        if (Array.isArray(t.layout)) layout = t.layout.slice();
        queueLeft.n = t.left || 0;
        if (t.mode === 'steer' && t.steer) {
            turn = { ...t, result: null };
            steer = { pos: { ...t.steer.pos }, stepsLeft: t.steer.stepsLeft, steps: t.steer.steps, sec: t.steer.sec, endsAt: performance.now() + t.steer.secLeft * 1000 };
            showWho(t, true); renderSteer(); renderQueue(); sfx('steer');
            return;
        }
        if (!t.result) return;
        steer = null; renderSteer();
        turn = { ...t, t0: performance.now(), P: P_AUTO, startX: G.homeX, grabbed: false, dropT: 0 };
        if (turn.result.cell == null) turn.result.cell = 3;
        renderQueue(); showWho(t, false); sfx('start');
        scheduleEnd(turn, t.layoutAfter);
    }
    function onSteer(d) {
        if (!steer || !turn || (d.id && turn.id && d.id !== turn.id)) return;
        steer.pos = { ...d.pos }; steer.stepsLeft = d.stepsLeft;
        if (Number.isFinite(d.secLeft)) steer.endsAt = performance.now() + d.secLeft * 1000;
        if (Array.isArray(d.dir)) { flashKey(d.dir.join(',')); sfx('move'); }
        renderSteer();
    }
    function onDrop(d) {
        if (disabled || !d || !d.result) return;
        if (Array.isArray(d.layout)) layout = d.layout.slice();
        flashKey('grab');
        const base = turn && turn.id === d.id ? turn : { id: d.id, nickname: d.nickname, avatar: d.avatar, mode: 'steer' };
        steer = null; renderSteer(); showWho(base, false);
        turn = { ...base, mode: 'steer', result: d.result, ms: d.ms, t0: performance.now(), P: P_DROP, startX: clawX, grabbed: false, dropT: 0 };
        renderQueue(); sfx('start');
        scheduleEnd(turn, d.layoutAfter);
    }
    function scheduleEnd(me, layoutAfter) {
        if (shotSpec) return;   // chụp ảnh: khung đứng yên, thẻ do shot() tự bật
        setTimeout(() => { if (turn === me) showCard(me); }, me.ms * me.P.card);
        setTimeout(() => {
            if (turn !== me) return;
            turn = null; clawX = G.homeX;
            if (Array.isArray(layoutAfter)) layout = layoutAfter.slice();
            $('gapthu-who').classList.remove('on');
        }, me.ms + 200);
    }

    // ---------- âm thanh (tổng hợp WebAudio, không cần file) ----------
    let ac = null;
    function tone(freq, dur, type, vol, slide) {
        if (muted || !cfg.sound || cfg.sound.enabled === false) return;
        try {
            ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
            o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
            if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
            const v = (Number(cfg.sound.volume) || 0.6) * (vol || 0.15);
            g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
        } catch (e) { /* không có âm thanh vẫn chơi được */ }
    }
    function sfx(kind) {
        if (kind === 'start') { tone(523, .08); setTimeout(() => tone(784, .1), 90); }
        else if (kind === 'steer') [392, 523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, .1, 'square', .12), i * 70));
        else if (kind === 'move') tone(880, .05, 'triangle', .14);
        else if (kind === 'clink') tone(1200, .07, 'triangle', .2);
        else if (kind === 'slip') tone(500, .35, 'sawtooth', .12, 160);
        else if (kind === 'lose') { tone(392, .18, 'triangle', .2); setTimeout(() => tone(311, .3, 'triangle', .2), 180); }
        else if (kind === 'win') [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .16, 'square', .14), i * 110));
    }

    // ---------- vòng vẽ: có lượt/tự lái thì 60 khung/s, rảnh thì ~6 khung/s (chỉ nháy đèn) ----------
    function loop(now) {
        if (turn || steer || now - lastIdleDraw > 160) { draw(now); lastIdleDraw = now; }
        requestAnimationFrame(loop);
    }

    // ---------- cấu hình + socket ----------
    function applyConfig(c) {
        if (!c) return;
        cfg = c; disabled = c.enabled === false && !isReview && !isDemo && !shotSpec;
        layoutBox(); renderQueue(); loadDanceImg();
    }

    // ---------- 💃 khung "Streamer nhảy" ----------
    const fx = $('gapthu-fx'), fctx = fx.getContext('2d');
    let dance = null, danceTick = 0, confetti = [], fxRaf = 0;
    function danceSound(on, kind) {
        if (!on) return;
        if (kind === 'start') [523, 659, 784, 1047, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .14, 'square', .16), i * 120));
        else [1047, 784, 659, 523].forEach((f, i) => setTimeout(() => tone(f, .18, 'triangle', .18), i * 140));
    }
    function showDance(d) {
        if (disabled || !d) return;
        hideCard();
        dance = { ...d, endsAt: performance.now() + (Number(d.secLeft ?? d.sec) || 30) * 1000, sec: Number(d.sec) || 30 };
        const box = $('gapthu-dance');
        box.classList.remove('bye');
        const pic = $('gapthu-dance-pic'); pic.innerHTML = '';
        if (d.image) { const im = new Image(); im.alt = ''; im.src = d.image; im.onerror = () => { pic.innerHTML = ''; pic.appendChild(defaultPic()); }; pic.appendChild(im); }
        else pic.appendChild(defaultPic());
        $('gapthu-dance-who').innerHTML = `${d.avatar ? `<img src="${esc(d.avatar)}" alt="" onerror="this.remove()">` : ''}<span>${esc(d.nickname || 'Ẩn danh')}</span>`;
        $('gapthu-dance-say').textContent = d.text || '';
        $('gapthu-dance-sub').textContent = '💃 Nhảy đi nào!';
        box.classList.add('on');
        burst(160);
        if (!shotSpec) { danceSound(d.sound !== false, 'start'); clearInterval(danceTick); danceTick = setInterval(renderDanceClock, 200); }
        renderDanceClock();
    }
    function defaultPic() { const c = document.createElement('canvas'); c.width = c.height = 300; drawDanceToken(c.getContext('2d'), 150, 150, 230, 0); return c; }
    function renderDanceClock() {
        if (!dance) return;
        const left = Math.max(0, (dance.endsAt - performance.now()) / 1000);
        $('gapthu-dance-sec').textContent = Math.ceil(left);
        $('gapthu-dance-clock').classList.toggle('hurry', left <= 5);
        $('gapthu-dance-ring').style.strokeDashoffset = String(728.85 * (1 - clamp(left / dance.sec, 0, 1)));
        if (Math.random() < .3) burst(6);
    }
    function endDance(d) {
        if (!dance) return;
        clearInterval(danceTick); danceTick = 0;
        const sound = d && d.sound !== false;
        dance = null;
        const box = $('gapthu-dance');
        box.classList.add('bye');
        $('gapthu-dance-sub').textContent = d && d.reason === 'skip' ? '⏭ Để lần sau nhé!' : '🎉 Cảm ơn cả nhà!';
        danceSound(sound, 'end'); burst(90);
        setTimeout(() => { if (!dance) box.classList.remove('on'); }, 1800);
    }
    // pháo giấy vẽ bằng canvas (chỉ chạy khi có hạt)
    let fxClear = 0;
    function burst(n) {
        clearTimeout(fxClear); fxClear = setTimeout(() => { confetti = []; fctx.clearRect(0, 0, 1080, 1920); }, 3200);
        const cols = ['#ff4fa3', '#ffe14d', '#62f6ff', '#7bff8a', '#ffffff', '#b98cff'];
        for (let i = 0; i < n; i++) confetti.push({ x: 540 + (Math.random() - .5) * 700, y: 700 + (Math.random() - .5) * 300, vx: (Math.random() - .5) * 900, vy: -400 - Math.random() * 900,
            r: Math.random() * Math.PI, vr: (Math.random() - .5) * 12, w: 12 + Math.random() * 14, h: 6 + Math.random() * 8, c: cols[i % cols.length], life: 2.4 });
        if (!fxRaf && !shotSpec) { let last = performance.now(); const step = now => { const dt = Math.min(.05, (now - last) / 1000); last = now; fxStep(dt); fxRaf = confetti.length ? requestAnimationFrame(step) : 0; }; fxRaf = requestAnimationFrame(step); }
        if (shotSpec) for (let k = 0; k < 40; k++) fxStep(.016);
    }
    function fxStep(dt) {
        fctx.clearRect(0, 0, 1080, 1920);
        confetti = confetti.filter(p => (p.life -= dt) > 0 && p.y < 2000);
        for (const p of confetti) {
            p.vy += 1500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
            fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.globalAlpha = Math.min(1, p.life);
            fctx.fillStyle = p.c; fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); fctx.restore();
        }
    }
    function onDance(d) { if (!d) return; if (d.phase === 'start') showDance(d); else if (d.phase === 'end') endDance(d); }
    const cfgReady = fetch('/api/games/gapthu/config', { cache: 'no-store' }).then(r => r.json()).then(applyConfig).catch(() => layoutBox());
    function syncState() {
        if (isDemo || shotSpec) return;
        fetch('/api/gapthu/state', { cache: 'no-store' }).then(r => r.json()).then(s => {
            if (Array.isArray(s.layout) && !turn) layout = s.layout.slice();
            if (s.dance && s.dance.phase === 'on' && !dance) showDance({ ...s.dance, sound: false });
            if (s.steer && !steer && s.current && s.current.id === s.steer.id) {
                startTurn({ ...s.current, layout: s.layout, steer: { pos: s.steer.pos, stepsLeft: s.steer.stepsLeft, steps: s.current.steer?.steps, sec: s.current.steer?.sec, secLeft: s.steer.secLeft } });
            }
        }).catch(() => {});
    }
    if (typeof io === 'function' && !shotSpec) {
        const token = qs.get('token') || '';
        const socket = io({ query: { role: 'aux' }, transports: ['websocket', 'polling'], auth: token ? { token } : undefined });
        socket.on('connect', () => { socket.emit('subscribe', isReview ? 'preview' : 'overlay'); syncState(); });
        if (!isDemo) {
            socket.on('gapthu:turn', startTurn);
            socket.on('gapthu:steer', onSteer);
            socket.on('gapthu:drop', onDrop);
            socket.on('gapthu:dance', onDance);
        }
        socket.on('gameConfig', d => { if (d && d.gameId === 'gapthu') applyConfig(d.config); });
        socket.on('overlay:reload', d => { if (!isReview && (!d || !d.gameId || d.gameId === 'gapthu')) location.reload(); });
    }

    // ---------- ?demo=1: lượt giả, cứ 3 lượt có 1 lượt tự lái ----------
    const names = ['Mây Hồng', 'Tí Nị', 'Anh Ba Khía', 'Bé Na'];
    function fakePrize(k) { const ps = (cfg.prizes || []).filter(p => p.weight > 0); return ps.length ? ps[k % ps.length] : { id: 'p1', icon: '🧸', name: 'Gấu bông' }; }
    if (isDemo) {
        let k = 0;
        const fake = () => {
            const n = k++, nick = names[n % names.length];
            if (n % 3 === 2) {
                startTurn({ id: 'd' + n, mode: 'steer', ms: 4000, left: 1, nickname: nick, steer: { pos: { col: 3, row: 1 }, stepsLeft: 8, steps: 8, sec: 15, secLeft: 15 } });
                const path = [[-1, 0], [-1, 0], [0, 1], [1, 0]];
                let pos = { col: 3, row: 1 }, used = 0;
                path.forEach((dd, i) => setTimeout(() => { pos = { col: pos.col + dd[0], row: pos.row + dd[1] }; used++; onSteer({ id: 'd' + n, pos, stepsLeft: 8 - used, secLeft: 14 - i, dir: dd }); }, 700 * (i + 1)));
                setTimeout(() => { const win = n % 2 === 0; onDrop({ id: 'd' + n, ms: 3600, result: { win, prize: win ? fakePrize(n) : null, cell: cellIndex(pos), kind: win ? 'grab' : 'slip', slipAt: .5, pityLeft: win ? 0 : 2 } }); }, 700 * 6);
                return 700 * 6 + 3800;
            }
            const win = n % 3 !== 1, cell = (n * 5) % CELLS;
            startTurn({ id: 'd' + n, ms: 4000, left: 2 - (n % 3), nickname: nick, avatar: '', result: { win, prize: win ? fakePrize(n) : null, cell, kind: win ? 'grab' : 'slip', slipAt: .5, pityLeft: win ? 0 : 3 } });
            return 4600;
        };
        const run = () => setTimeout(run, fake());
        setTimeout(run, 600);
    }

    // ---------- ?shot=… đóng băng 1 khung (chụp ảnh / kiểm tra khi trình duyệt ẩn, rAF đứng) ----------
    function shot(spec) {
        const [kind, pStr] = String(spec).split(':');
        const p = Math.min(1, Math.max(0, Number(pStr) || 0.5));
        const prize = fakePrize(0);
        getLayout();
        if (!layout.includes(DANCE)) layout[9] = DANCE;
        if (kind === 'dance') {
            for (let x = 0; x <= 400; x += 16) draw(x);
            showDance({ nickname: 'Mây Hồng', sec: 30, secLeft: 21, text: (cfg.dance && cfg.dance.text || '{name} gắp trúng! Streamer nhảy ngay!').replace(/\{name\}/g, 'Mây Hồng'), image: cfg.dance && cfg.dance.image });
            return;
        }
        if (kind === 'steer' || kind === 'steerdrop') {
            const pos = { col: 1, row: 2 };
            startTurn({ id: 's', mode: 'steer', ms: 4000, left: 2, nickname: 'Mây Hồng', steer: { pos: { col: 3, row: 1 }, stepsLeft: 8, steps: 8, sec: 15, secLeft: 11 } });
            onSteer({ id: 's', pos, stepsLeft: 5, secLeft: 11, dir: [-1, 0] });
            for (let x = 0; x <= 1500; x += 16) draw(x);
            renderSteer();
            if (kind === 'steer') return;
            onDrop({ id: 's', ms: 4000, result: { win: true, prize, cell: cellIndex(pos), kind: 'grab', slipAt: 0, pityLeft: 0 } });
            const t0 = turn.t0 = 0; lastFrame = 0;
            for (let x = t0; x <= p * 4000; x += 16) draw(x);
            if (p >= P_DROP.card) { showCard(turn); clearTimeout(cardTimer); }
            return;
        }
        const win = kind === 'win', ms = 4000;
        const t = { id: 'a', ms, left: 2, nickname: 'Mây Hồng', avatar: '', giftImage: '',
            result: { win, prize: win ? prize : null, cell: 11, kind: win ? 'grab' : (kind === 'empty' ? 'empty' : 'slip'), slipAt: .45, pityLeft: 3 } };
        startTurn(t);
        turn.t0 = 0;
        for (let x = 0; x <= p * ms; x += 16) draw(x);
        if (p >= P_AUTO.card) { showCard(turn); clearTimeout(cardTimer); }
    }
    window.__gapthu = { startTurn, onSteer, onDrop, onDance, shot, get cfg() { return cfg; }, draw: () => draw(performance.now()) };
    layoutBox();
    if (shotSpec) cfgReady.then(() => shot(shotSpec));
    else requestAnimationFrame(loop);
})();
</script>
</body>
</html>
