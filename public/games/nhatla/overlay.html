                const env = age < .18 ? age / .18 : age > .72 ? (1 - age) / .28 : 1;
                const k = fall * env;
                // 1. Quay tròn — không chia cho r, hữu hạn tại tâm.
                out.x += -t.spin * dy / R * k;
                out.y += t.spin * dx / R * k;
                // 2. Hút vào tâm. Đây là SINK CỐ Ý: "gom lá" đúng nghĩa là phá tính
                //    divergence-free — ngược hẳn mục đích của curl-noise bên phần gió.
                //    Hệ số core tắt dần ở lõi để lá tới sát tâm không rung qua lại.
                if (r > 1e-3) {
                    const core = Math.min(1, r / (R * .12));
                    const pull = t.inward * k * core / r;
                    out.x -= dx * pull;
                    out.y -= dy * pull;
                }
                // 3. Bốc lên (y âm là hướng lên).
                out.y -= t.lift * k;
            }
        }

        // ── Combo nhiều lượt ───────────────────────────────────────────────────
        // Tặng 1 lần chạy 1 lượt; combo x10 chạy đủ 10 lượt NỐI NHAU chứ không chồng chất
        // cùng lúc — 10 cơn gió nổ đồng thời thì thổi sạch đống lá trong một khoảnh khắc và
        // người xem không kịp thấy gì. Giãn đúng bằng thời lượng một cơn nên lượt sau bắt đầu
        // khi lượt trước vừa tắt.
        //
        // Trần lượt khớp với NHATLA_ACTION_MAX_REPEAT bên server: combo x500 mà chạy đủ thì
        // hiệu ứng khoá hàng chục phút, quà của người sau không còn chỗ hiện.
        // Lịch lượt chạy trong VÒNG LẶP FRAME, không dùng setTimeout.
        // Lý do là hành vi thật của trình duyệt: trang ẩn thì setTimeout bị đóng băng hoàn
        // toàn — đo được là timer đặt 600ms trong iframe ẩn KHÔNG BAO GIỜ chạy, nên combo
        // x3 chỉ nổ đúng lượt đầu rồi im. Bám theo cùng đồng hồ với physics thì lượt kế
        // luôn tới đúng nhịp, và kiểm thử tự động qua __nlStep() cũng chạy được.
        const ACTION_MAX_REPEAT = 20;
        let pendingActions = [];

        function queueActionRepeats(times, gapMs, run) {
            const n = clamp(parseInt(times, 10) || 1, 1, ACTION_MAX_REPEAT);
            const gap = Math.max(120, Number(gapMs) || 1000);
            const base = performance.now();
            run(0);
            for (let i = 1; i < n; i++) pendingActions.push({ at: base + i * gap, index: i, run });
        }

        function pumpPendingActions(now) {
            if (!pendingActions.length) return;
            // Chỉ chạy MỘT lượt mỗi frame. Sau một quãng treo dài (OBS ẩn source, máy ngủ)
            // có thể tới hạn cùng lúc cả chục lượt; bắn hết trong một frame thì thành đúng
            // cái "chồng chất cùng lúc" mà cơ chế này sinh ra để tránh.
            let due = -1;
            for (let i = 0; i < pendingActions.length; i++) {
                if (pendingActions[i].at <= now) { due = i; break; }
            }
            if (due < 0) return;
            const action = pendingActions.splice(due, 1)[0];
            action.run(action.index);
        }

        function clearActionRepeats() {
            pendingActions = [];
        }

        // Lá còn nằm trong vùng lốc thì CHƯA được đáp xuống. Không có chốt này, nửa dưới của
        // vòng xoay có vy > 0 nên vừa chạm mặt đống là lá đáp luôn: đo được 311 lá bị cuốn
        // lên chỉ còn 22 lá sau 2 giây, cơn lốc tan ngay trước mắt người xem.
        function insideTornado(x, y, now) {
            for (let i = 0; i < tornadoes.length; i++) {
                const t = tornadoes[i];
                const age = (now - t.start) / t.duration;
                if (age <= 0 || age >= 1) continue;
                const cx = t.x + t.driftX * (now - t.start) / 1000;
                const dx = x - cx, dy = y - t.y;
                if (dx * dx + dy * dy < t.radius * t.radius) return true;
            }
            return false;
        }

        const windVec = { x: 0, y: 0 };

        function windAt(x, y, now) {
            windVec.x = 0; windVec.y = 0;
            // Lá trong lốc dùng chung state 'blown' và chung đường vật lý với gió:
            // cùng steering, cùng trọng lực, cùng lực nâng theo vận tốc góc.
            if (tornadoes.length) tornadoAt(x, y, now, windVec);
            for (let i = 0; i < gusts.length; i++) {
                const gust = gusts[i];
                const env = gustEnvelope((now - gust.start) / gust.duration);
                if (env <= 0) continue;
                const fall = gustFalloff(gust, x, y);
                if (fall <= 0) continue;
                const t = (now - gust.start) / 1000;
                // 1. Luồng thẳng: phần đẩy lá BAY ĐI theo hướng cơn gió.
                //    Curl noise thuần chỉ xoáy tại chỗ, không có dịch chuyển tổng thể.
                windVec.x += gust.dirX * gust.strength * fall * env;
                windVec.y += gust.dirY * gust.strength * fall * env;
                // 2. Nhiễu xoáy: curl của (A·ψ), cho lá tản ra tự nhiên thay vì bay thành khối.
                if (gust.turbulence > 0) {
                    const e = WIND_CURL_EPS;
                    const dpdy = (gustPotential(gust, x, y + e, t) - gustPotential(gust, x, y - e, t)) / (2 * e);
                    const dpdx = (gustPotential(gust, x + e, y, t) - gustPotential(gust, x - e, y, t)) / (2 * e);
                    const scale = WIND_CURL_GAIN * gust.strength * gust.turbulence * env;
                    windVec.x += dpdy * scale;
                    windVec.y += -dpdx * scale;
                }
            }
            return windVec;
        }

        // Khởi động một cơn gió tại (x, y).
        //
        // CẨN THẬN với maxLeaves ở đây: nó KHÔNG phải cần gạt hiệu năng, dù trực giác nói vậy.
        // Đo thật trên máy dev (Chrome, stage 1080×1920, cùng cơn gió, chỉ đổi trần):
        //     300 lá bay trên đống 1800 = 19.15 ms/frame
        //     600 lá bay trên đống 1800 = 19.30 ms/frame   <- giảm nửa số lá, không đổi gì
        // Trong khi đó, đổi KÍCH THƯỚC ĐỐNG lại đổi hẳn:
        //     555 lá bay trên đống ~145 =  7.96 ms/frame
        //     620 lá rơi trên sân trống =  7.57 ms/frame
        // Nguyên nhân: lá bay tản khắp sân nên vùng bẩn phủ gần hết màn hình, và mọi lá TĨNH
        // nằm trong vùng đó đều phải vẽ lại. Chi phí do SỐ LÁ TĨNH BỊ QUÉT QUA quyết định,
        // gần như độc lập với số lá đang bay.
        // => Muốn nhẹ thì giảm cfg.drop.maxLeaves (đống lá), không phải giảm trần này.
        // => maxLeaves ở đây chỉ là cần gạt THẨM MỸ: gió cuốn cả mảng hay chỉ vài chiếc.
        // y bỏ trống (null/NaN) = tự bám MẶT ĐỐNG tại cột x.
        // Đừng truyền một y cố định sát đáy: đống lá cao dần theo thời gian, lá nằm ở
        // y ~950 khi đống dày, nên gió nhắm y~1780 sẽ hụt hoàn toàn và không cuốn được gì.
        // stackHeightAt() suy ra từ cùng tập lá trên mọi client nên overlay và preview
        // vẫn ra cùng một điểm — không phá đồng bộ.
        function startGust(x, y, options = {}) {
            const wind = cfg.wind || {};
            if (wind.enabled === false) return 0;
            const radius = Number(options.radius) || Number(wind.radius) || 420;
            if (!isFinite(y)) y = viewport.height - stackHeightAt(x) - radius * .15;
            const cap = clamp(parseInt(options.maxLeaves ?? wind.maxLeaves, 10) || 600, 1, 4000);
            // Hướng gió: NẰM NGANG hơi chếch lên, không phải thổi dựng đứng.
            // Bản đầu lấy gốc -π/2 (thẳng lên) nên lá bị bắn vọt lên gần hết chiều cao sân
            // khấu, trông như vụ nổ chứ không phải cơn gió. Nghiêng 10–29° cho lá trườn đi
            // ngang rồi mới rơi xuống — đúng dáng gió thổi qua đống lá khô.
            let dirX, dirY;
            if (options.angle != null) {
                const angle = Number(options.angle);
                dirX = Math.cos(angle); dirY = Math.sin(angle);
            } else {
                const tilt = rand(.18, .5);                       // radian chếch lên
                const side = options.dir === 'left' ? -1 : 1;
                dirX = side * Math.cos(tilt);
                dirY = -Math.sin(tilt);                           // âm = hướng lên
            }
            const gust = {
                x, y, radius,
                dirX, dirY,
                strength: Number(options.strength) || Number(wind.strength) || 640,
                turbulence: clamp((Number(options.turbulence ?? wind.turbulence) || 0) / 100, 0, 1),
                duration: Number(options.durationMs) || Number(wind.durationMs) || 1500,
                start: performance.now(),
                seed: (options.seed != null ? Number(options.seed) : Math.floor(Math.random() * 1e9)) | 0
            };

            // Chọn lá trong bán kính, gần tâm trước. Chỉ lấy lá đang nằm yên: lá đang rơi,
            // đang kéo hay đang bay vào thùng thì để yên, tránh giành quyền điều khiển.
            const candidates = [];
            const r2 = radius * radius;
            for (let i = 0; i < leaves.length; i++) {
                const leaf = leaves[i];
                if (leaf.state !== 'resting') continue;
                const dx = leaf.x - x, dy = leaf.y - y;
                const d2 = dx * dx + dy * dy;
                if (d2 <= r2) candidates.push({ leaf, d2 });
            }
            if (!candidates.length) return 0;
            if (candidates.length > cap) candidates.sort((a, b) => a.d2 - b.d2);
            const take = Math.min(cap, candidates.length);

            for (let i = 0; i < take; i++) {
                const leaf = candidates[i].leaf;
                refundPile(leaf);                       // trả lại độ cao đã cộng vào đống
                leaf.state = 'blown';
                leaf.el.classList.remove('resting');
                // Cú hẩy ban đầu để lá bật khỏi đống ngay, thay vì ì ra chờ gió ngấm.
                // Phần dựng đứng phải NHẸ: lá chỉ cần nhấc khỏi mặt đống rồi để luồng ngang
                // cuốn đi. Bản đầu cộng thêm tới 190px/s hướng lên nên lá vọt lên quá cao.
                const kick = .35 + .35 * (1 - candidates[i].d2 / r2);
                leaf.vx = gust.dirX * gust.strength * kick;
                leaf.vy = gust.dirY * gust.strength * kick - rand(20, 80, leaf.random);
                leaf.z = ++zIndex;
                leaf.el.style.zIndex = leaf.z;
                air.appendChild(leaf.el);   // rời đống lá -> lên layer không khí
            }
            gusts.push(gust);
            // Dọn cơn đã tắt; giữ mảng ngắn vì windAt() duyệt nó cho MỖI lá MỖI frame.
            gusts = gusts.filter(g => performance.now() - g.start < g.duration);
            return take;
        }

        // Khởi động lốc xoáy tại (x, y). y bỏ trống = bám mặt đống như startGust.
        // Lá bị cuốn dùng chung state 'blown' nên không cần thêm nhánh vật lý nào.
        function startTornado(x, y, options = {}) {
            const conf = cfg.tornado || {};
            if (conf.enabled === false) return 0;
            const radius = Number(options.radius) || Number(conf.radius) || 380;
            if (!isFinite(x)) x = viewport.width / 2;
            // Tâm lốc nâng lên khỏi mặt đống một chút để lá bị cuốn từ dưới lên,
            // thay vì nửa vùng xoáy nằm chìm dưới đáy sân khấu.
            if (!isFinite(y)) y = viewport.height - stackHeightAt(x) - radius * .45;
            const cap = clamp(parseInt(options.maxLeaves ?? conf.maxLeaves, 10) || 700, 1, 4000);
            const drift = Number(options.drift ?? conf.drift ?? 90);
            const tornado = {
                x, y, radius,
                spin: Number(options.spin) || Number(conf.spin) || 900,
                inward: Number(options.inward ?? conf.inward ?? 220),
                lift: Number(options.lift ?? conf.lift ?? 260),
                duration: Number(options.durationMs) || Number(conf.durationMs) || 3200,
                driftX: (options.dir === 'left' ? -1 : options.dir === 'right' ? 1 : (Math.random() < .5 ? -1 : 1)) * drift,
                start: performance.now()
            };

            // Vùng tuyển lá là VỆT QUÉT của tâm lốc, không phải một hình tròn tĩnh: lá nằm
            // trên đường lốc sắp đi qua cũng phải được đánh thức sẵn, nếu không nó nằm ì
            // tại chỗ trong lúc tâm lốc lướt ngang qua đầu.
            //
            // Phải là hình con nhộng (khoảng cách tới ĐOẠN THẲNG quét), đừng dùng hộp chữ
            // nhật: bốn góc hộp nằm ngoài vùng xoáy tới 1.41×R, nên lá ở góc bị đánh thức
            // rồi rơi lại vô nghĩa. Đo được lúc dùng hộp: 381 lá bị đánh thức nhưng chỉ ~181
            // thật sự bị cuốn — nửa còn lại chỉ tạo nhiễu và tốn hiệu năng.
            const endX = x + tornado.driftX * tornado.duration / 1000;
            const loX = Math.min(x, endX), hiX = Math.max(x, endX);
            const r2max = radius * radius;
            const candidates = [];
            for (let i = 0; i < leaves.length; i++) {
                const leaf = leaves[i];
                if (leaf.state !== 'resting') continue;
                // Drift chỉ theo phương ngang nên "chiếu lên đoạn thẳng" rút gọn thành clamp x.
                const dx = leaf.x - clamp(leaf.x, loX, hiX);
                const dy = leaf.y - y;
                const d2 = dx * dx + dy * dy;
                if (d2 > r2max) continue;
                candidates.push({ leaf, d2 });
            }
            if (!candidates.length) return 0;
            if (candidates.length > cap) candidates.sort((a, b) => a.d2 - b.d2);
            const take = Math.min(cap, candidates.length);
            for (let i = 0; i < take; i++) {
                const leaf = candidates[i].leaf;
                refundPile(leaf);
                leaf.state = 'blown';
                leaf.el.classList.remove('resting');
                leaf.vx = 0;
                leaf.vy = -rand(30, 120, leaf.random);   // hẩy nhẹ cho bật khỏi đống
                leaf.z = ++zIndex;
                leaf.el.style.zIndex = leaf.z;
                air.appendChild(leaf.el);
            }
            tornadoes.push(tornado);
            tornadoes = tornadoes.filter(t => performance.now() - t.start < t.duration);
            return take;
        }

        // ====== HÀNH ĐỘNG CỨU: tự nhặt lá ======
        // Quà chỉ định bật chế độ này trong N giây. Mỗi lượt hút bốc một ĐIỂM NGẪU NHIÊN trên
        // sân rồi lấy chiếc lá gần điểm đó nhất, nên đống vơi đều khắp mặt thay vì bị gặm dần
        // một góc quanh thùng rác.
        //
        // Chọn theo điểm chứ không bốc thẳng chỉ số mảng là có chủ ý: hai view có thể lệch nhau
        // vài chiếc (một bên đang cầm lá trên tay), bốc theo chỉ số thì cái lệch đó đẩy hai bên
        // hút hai bộ lá khác hẳn. Lấy lá gần một điểm thì bộ lá lệch chút vẫn ra gần như cùng
        // kết quả. Seed do server chốt nên mọi view bốc đúng cùng dãy điểm.
        //
        // Số lá dọn được tính theo THỜI GIAN THỰC nên khớp nhau dù fps mỗi view khác nhau.
        let autoCleanUntil = 0;
        let autoCleanRate = 40;
        let autoCleanDebt = 0;
        let autoCleanRandom = makeSeededRandom('autoclean');
        // Trần mỗi frame: tốc độ cao kết hợp một frame dài (máy khựng) sẽ dồn cả trăm lá vào
        // đúng một frame, gây giật ngay lúc đang cần cứu.
        const AUTO_CLEAN_MAX_PER_FRAME = 64;

        function startAutoClean(durationMs, leavesPerSec, seed) {
            const now = performance.now();
            // Combo x50 không mở 50 lượt song song — mỗi lượt chỉ nối thêm giờ.
            autoCleanUntil = Math.max(autoCleanUntil, now) + clamp(Number(durationMs) || 5000, 500, 60000);
            autoCleanRate = clamp(Number(leavesPerSec) || 40, 1, 500);
            if (seed != null) autoCleanRandom = makeSeededRandom(`autoclean:${seed}`);
        }

        // Lá gần một điểm bất kỳ nhất. Bỏ qua lá đang bay/đang cầm: chỉ hút lá đã nằm yên.
        function nearestRestingLeaf(px, py) {
            let best = null, bestD = Infinity;
            for (let i = 0; i < leaves.length; i++) {
                const leaf = leaves[i];
                if (leaf.state !== 'resting') continue;
                const dx = leaf.x - px, dy = leaf.y - py;
                const d = dx * dx + dy * dy;
                if (d < bestD) { bestD = d; best = leaf; }
            }
            return best;
        }

        function updateAutoClean(now, dt) {
            if (now >= autoCleanUntil) { autoCleanDebt = 0; return; }
            autoCleanDebt += autoCleanRate * dt;
            let take = Math.min(Math.floor(autoCleanDebt), AUTO_CLEAN_MAX_PER_FRAME);
            if (take <= 0) return;
            autoCleanDebt -= take;
            while (take-- > 0) {
                // Điểm hút rải khắp sân. Lấy lá GẦN NHẤT nên điểm rơi vào chỗ trống vẫn hút
                // được lá mép ngoài — đó cũng là lý do đống vơi đều thay vì thủng lỗ giữa.
                const leaf = nearestRestingLeaf(
                    autoCleanRandom() * STAGE.width,
                    autoCleanRandom() * STAGE.height
                );
                // Hết lá nằm yên thì thôi, và xoá luôn phần lẻ để không dồn nợ chờ lá mới rơi.
                if (!leaf) { autoCleanDebt = 0; break; }
                receiveLeaf(leaf);
            }
        }

        window.__nlAutoClean = (ms = 5000, rate = 40, seed = 1) => { startAutoClean(ms, rate, seed); return { until: autoCleanUntil, rate: autoCleanRate }; };

        function updateLeafAnimations(now, dt) {
            // Duyệt ngược trên chính mảng thay vì copy `[...leaves]`: bản copy 1000 phần tử
            // mỗi frame là 60k mảng rác/giây, đủ để GC gây khựng. Đi ngược nên settleLeaf /
            // removeLeaf splice giữa vòng lặp vẫn không nhảy sót phần tử nào.
            for (let i = leaves.length - 1; i >= 0; i--) {
                const leaf = leaves[i];
                if (leaf.state === 'resting') continue;
                if (leaf.state === 'falling') {
                    leaf.velocity += 245 * dt;
                    leaf.y += leaf.velocity * dt;
                    leaf.x = clamp(leaf.startX + Math.sin(now / 1000 * leaf.swaySpeed - (leaf.swayPhase || 0)) * leaf.sway, leaf.size * .2, viewport.width - leaf.size * .2);
                    leaf.rotation += leaf.spin * dt;
                    const floor = floorAt(leaf.x, leaf.size);
                    if (leaf.y >= floor) {
                        leaf.y = floor;
                        settleLeaf(leaf);
                    } else {
                        leafTransform(leaf);
                    }
                } else if (leaf.state === 'blown') {
                    const wind = windAt(leaf.x, leaf.y, now);
                    // Lái theo công thức steering kinh điển (Nature of Code): lực = vận tốc
                    // mong muốn − vận tốc hiện tại. Hệ số drag chính là "độ nhẹ" của lá:
                    // cao thì lá bám gió gần như tức thì, thấp thì lá ì như hòn sỏi.
                    // clamp về 1 để dt lớn (frame rớt) không làm hệ số vọt quá đà rồi rung.
                    const k = Math.min(1, (Number(cfg.wind?.drag) || 32) / 10 * dt);
                    leaf.vx += (wind.x - leaf.vx) * k;
                    leaf.vy += (wind.y - leaf.vy) * k;
                    leaf.vy += WIND_GRAVITY * dt;
                    // Lực nâng theo VẬN TỐC GÓC, không phải theo vận tốc tịnh tiến.
                    // Andersen, Pesavento & Wang (J. Fluid Mech. 2005) đo trên tấm phẳng rơi
                    // ở Re~10³ — đúng chế độ "chiếc lá rơi trong không khí" — và kết luận lực
                    // nâng bị chi phối bởi số hạng tỉ lệ ω; phần theo vận tốc tịnh tiến chỉ
                    // gánh ~5% trọng lực khi lộn vòng. Chính số hạng ω này tạo cú "hẫng lên"
                    // ở cuối mỗi nhịp đảo cánh — thứ khiến mắt tin đó là lá thật.
                    // https://dragonfly.tam.cornell.edu/publications/S002211200500594Xa.pdf
                    leaf.vy -= Math.abs(leaf.spin) * (Number(cfg.wind?.lift) || 35) / 100 * .4 * dt;
                    leaf.x += leaf.vx * dt;
                    leaf.y += leaf.vy * dt;
                    // Lá lật nhanh hơn khi bay nhanh hơn.
                    leaf.spin = clamp(leaf.vx * .75, -900, 900);
                    leaf.rotation += leaf.spin * dt;
                    const half = leaf.size * .2;
                    if (leaf.x < half) { leaf.x = half; leaf.vx = Math.abs(leaf.vx) * .35; }
                    else if (leaf.x > viewport.width - half) { leaf.x = viewport.width - half; leaf.vx = -Math.abs(leaf.vx) * .35; }
                    const floor = floorAt(leaf.x, leaf.size);
                    // Chỉ cho đáp khi đang đi XUỐNG. Không có điều kiện này, lá vừa bị hẩy lên
                    // từ mặt đống sẽ bị bắt lại ngay ở frame đầu và cơn gió thành vô hình.
                    if (leaf.y >= floor && leaf.vy >= 0) {
                        if (tornadoes.length && insideTornado(leaf.x, leaf.y, now)) {
                            // Còn trong lốc: trượt và nảy nhẹ trên mặt đống thay vì đáp hẳn,
                            // để vòng xoáy giữ được lá suốt thời gian cơn lốc sống.
                            leaf.y = floor;
                            leaf.vy = -Math.abs(leaf.vy) * .25;
                            leafTransform(leaf);
                        } else {
                            leaf.y = floor;
                            leaf.startX = leaf.x;
                            leaf.vx = 0; leaf.vy = 0;
                            settleLeaf(leaf);
                        }
                    } else {
                        leafTransform(leaf);
                    }
                } else if (leaf.state === 'returning') {
                    const t = clamp((now - leaf.returnStart) / 340, 0, 1);
                    const ease = 1 - Math.pow(1 - t, 3);
                    leaf.x = leaf.returnFrom.x + (leaf.returnTo.x - leaf.returnFrom.x) * ease;
                    leaf.y = leaf.returnFrom.y + (leaf.returnTo.y - leaf.returnFrom.y) * ease;
                    leaf.rotation = leaf.returnFrom.rotation + (leaf.returnTo.rotation - leaf.returnFrom.rotation) * ease;
                    leafTransform(leaf, leaf.x, leaf.y, .72 + .28 * ease);
                    if (t >= 1) {
                        leaf.state = 'resting';
                        leaf.el.classList.remove('dragging');
                        leaf.el.classList.add('resting');
                        leaf.el.style.zIndex = leaf.returnTo.z;
                        leafTransform(leaf);
                    }
                } else if (leaf.state === 'collecting') {
                    const t = clamp((now - leaf.collectStart) / 330, 0, 1);
                    const ease = 1 - Math.pow(1 - t, 3);
                    leaf.x = leaf.collectFrom.x + (leaf.collectTo.x - leaf.collectFrom.x) * ease;
                    leaf.y = leaf.collectFrom.y + (leaf.collectTo.y - leaf.collectFrom.y) * ease;
                    leaf.rotation = leaf.collectFrom.rotation + 180 * ease;
                    leafTransform(leaf, leaf.x, leaf.y, 1 - .86 * ease);
                    leaf.el.style.opacity = String(1 - t);
                    if (t >= 1) removeLeaf(leaf);
                }
            }
        }

        // OBS nhận toạ độ qua socket theo packet, còn render chạy mỗi frame.
        // Nội suy ở đây loại bỏ cảm giác "nhảy từng nấc" mà vẫn giữ stage native 1080×1920.
        function updateRemoteMotion(dt, now) {
            if (remoteHandTarget) {
                if (now - remoteHandAt > 350) {
                    remoteHandTarget = null;
                    hideLocalHand();
                } else {
                    handPoint.x = smoothToward(handPoint.x, remoteHandTarget.x, dt);
                    handPoint.y = smoothToward(handPoint.y, remoteHandTarget.y, dt);
                    positionHand();
                    renderHandImage();
                    showHand();
                    followActiveEffect(handPoint);
                }
            }
            remoteLeafTargets.forEach((target, leafId) => {
                const leaf = leaves.find(item => item.id === leafId);
                if (!leaf || leaf.state === 'collecting') return remoteLeafTargets.delete(leafId);
                leaf.x = smoothToward(leaf.x, target.x, dt);
                leaf.y = smoothToward(leaf.y, target.y, dt);
                leaf.rotation = smoothToward(leaf.rotation, target.rotation, dt);
                leafTransform(leaf, leaf.x, leaf.y, .72);
            });
        }

        function tick(now) {
            const rawDelta = now - lastFrame;
            const dt = Math.min(.05, rawDelta / 1000);
            lastFrame = now;
            const jsStart = perfOn ? performance.now() : 0;
            pumpSpawnQueue(now);
            pumpPendingActions(now);
            updateAutoClean(now, dt);
            updateRemoteMotion(dt, now);
            updateLeafAnimations(now, dt);
            if (perfOn) {
                // Bỏ frame đầu và frame sau khi tab bị treo: rawDelta khổng lồ sẽ kéo lệch
                // p95 mà không phản ánh chi phí render thật.
                if (rawDelta > 0 && rawDelta < 500) perfPush(perf.frame, rawDelta);
                perfPush(perf.js, performance.now() - jsStart);
                let moving = 0;
                for (let i = 0; i < leaves.length; i++) if (leaves[i].state !== 'resting') moving++;
                perf.moving = moving;
                perfPaint(now);
            }
            requestAnimationFrame(tick);
        }

        function moveHand(event) {
            const point = toStagePoint(event);
            handPoint = point;
            positionHand(point);
            showHand();
            followActiveEffect(point);
            return point;
        }

        function hideLocalHand() {
            if (!handShouldStay()) {
                handWasHidden = true;
                handWrap.style.opacity = '0';
            }
        }

        function relayHand(force) {
            if (!canEdit()) return;
            const now = performance.now();
            if (!socket?.connected || (!force && now - lastHandAt < 16)) return;
            lastHandAt = now;
            socket.emit('nhatla:transient', {
                type: 'hand', x: handPoint.x, y: handPoint.y,
                closed: !!(dragging || binDragging || hudDragging || topBoardDragging || topBoardResizing)
            });
        }

        function persistOverlayPositions() {
            if (!canEdit()) return;
            clearTimeout(saveBinTimer);
            saveBinTimer = setTimeout(() => {
                fetch('/api/games/nhatla/config', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ display: { ...cfg.display } })
                }).catch(() => {});
            }, 250);
        }

        // Bảng TOP nằm ở khối config riêng chứ không phải display, nên có đường relay/persist
        // riêng — nhét chung vào relayDragPosition() sẽ kéo theo cả 4 field thùng rác + HUD.
        // Gộp field đang chờ thay vì ghi đè: kéo bảng xong resize ngay trong vòng 250ms thì
        // lần hẹn sau sẽ huỷ lần trước, và vị trí vừa kéo bị mất nếu không cộng dồn ở đây.
        function persistTopDonors(fields) {
            if (!canEdit()) return;
            pendingTopSave = { ...(pendingTopSave || {}), ...fields };
            clearTimeout(saveTopBoardTimer);
            saveTopBoardTimer = setTimeout(() => {
                const topDonors = pendingTopSave;
                pendingTopSave = null;
                fetch('/api/games/nhatla/config', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topDonors })
                }).catch(() => {});
            }, 250);
        }

        function relayTopDonors(fields, force = false) {
            if (!canEdit()) return;
            const now = performance.now();
            if (!socket?.connected || (!force && now - lastTransientAt < 16)) return;
            lastTransientAt = now;
            socket.emit('nhatla:transient', { type: 'topdonors', topDonors: fields });
        }

        const topBoardPos = () => ({
            boardXPercent: cfg.topDonors.boardXPercent,
            boardYPercent: cfg.topDonors.boardYPercent
        });

        function relayDragPosition(type, force = false) {
            if (!canEdit()) return;
            const now = performance.now();
            if (!socket?.connected || (!force && now - lastTransientAt < 16)) return;
            lastTransientAt = now;
            socket.emit('nhatla:transient', {
                type,
                binXPercent: cfg.display.binXPercent,
                binYPercent: cfg.display.binYPercent,
                hudXPercent: cfg.display.hudXPercent,
                hudYPercent: cfg.display.hudYPercent
            });
        }

        function relayLeafDrag(leaf, type, action, collectTo) {
            if (!canEdit()) return;
            const now = performance.now();
            if (type === 'leaf' && (!socket?.connected || now - lastTransientAt < 16)) return;
            lastTransientAt = now;
            if (!socket?.connected) return;
            const packet = {
                type, action, leafId: leaf.id, x: leaf.x, y: leaf.y, rotation: leaf.rotation
            };
            // Kết thúc dọn dùng cùng điểm đích stage ở mọi cửa sổ, không phụ thuộc tỷ lệ preview.
            if (type === 'leafEnd') {
                packet.binXPercent = cfg.display.binXPercent;
                packet.binYPercent = cfg.display.binYPercent;
                if (collectTo) packet.collectTo = collectTo;
            }
            socket.emit('nhatla:transient', packet);
        }

        function cancelActiveDrag(pointerId = activePointerId) {
            let changed = false;
            if (dragging) {
                const leaf = dragging;
                dragging = null;
                relayLeafDrag(leaf, 'leafEnd', returnLeaf(leaf));
                changed = true;
            }
            if (binDragging) {
                binDragging = null;
                relayDragPosition('bin', true);
                persistOverlayPositions();
                changed = true;
            }
            if (hudDragging) {
                hudDragging = null;
                relayDragPosition('hud', true);
                persistOverlayPositions();
                changed = true;
            }
            if (topBoardDragging) {
                topBoardDragging = null;
                relayTopDonors(topBoardPos(), true);
                persistTopDonors(topBoardPos());
                changed = true;
            }
            if (topBoardResizing) {
                topBoardResizing = null;
                relayTopDonors({ boardScale: cfg.topDonors.boardScale }, true);
                persistTopDonors({ boardScale: cfg.topDonors.boardScale });
                changed = true;
            }
            if (topFlyDragging || topFlyResizing) {
                topFlyDragging = null;
                topFlyResizing = null;
                releaseFlyRow();
                relayTopDonors(topFlyLayout(), true);
                persistTopDonors(topFlyLayout());
                changed = true;
            }
            releaseRootPointer(pointerId);
            if (changed) {
                renderHandImage();
                relayHand(true);
            }
            hideLocalHand();
        }

        root.addEventListener('pointermove', event => {
            if (!canEdit() || !isActivePointer(event)) return;
            const point = moveHand(event);
            relayHand();
            if (dragging) {
                dragging.x = clamp(point.x - dragging.offsetX, dragging.size * .1, viewport.width - dragging.size * .1);
                dragging.y = clamp(point.y - dragging.offsetY, dragging.size * .1, viewport.height - dragging.size * .1);
                leafTransform(dragging, dragging.x, dragging.y, .72);
                relayLeafDrag(dragging, 'leaf');
            }
            if (binDragging) {
                cfg.display.binXPercent = clamp(point.x / viewport.width * 100, 5, 95);
                cfg.display.binYPercent = clamp(point.y / viewport.height * 100, 5, binYMax());
                applyBinPosition();
                relayDragPosition('bin');
            }
            if (hudDragging) {
                cfg.display.hudXPercent = clamp(point.x / viewport.width * 100 - hudDragging.x, 0, 90);
                cfg.display.hudYPercent = clamp(point.y / viewport.height * 100 - hudDragging.y, 0, 90);
                applyHudPosition();
                relayDragPosition('hud');
            }
            if (topBoardDragging) {
                cfg.topDonors.boardXPercent = clamp(point.x / viewport.width * 100 - topBoardDragging.x, 0, 92);
                cfg.topDonors.boardYPercent = clamp(point.y / viewport.height * 100 - topBoardDragging.y, 0, 92);
                applyTopDonorsLayout();
                relayTopDonors(topBoardPos());
            }
            if (topBoardResizing) {
                cfg.topDonors.boardScale = scaleFromDrag(topBoardResizing, point, 40, 250);
                applyTopDonorsLayout();
                relayTopDonors({ boardScale: cfg.topDonors.boardScale });
            }
            if (topFlyDragging) {
                cfg.topDonors.flyYPercent = clamp(point.y / viewport.height * 100 - topFlyDragging.y, 0, 92);
                applyTopDonorsLayout();
                relayTopDonors({ flyYPercent: cfg.topDonors.flyYPercent });
            }
            if (topFlyResizing) {
                cfg.topDonors.flyScale = scaleFromDrag(topFlyResizing, point, 40, 250);
                applyTopDonorsLayout();
                relayTopDonors({ flyScale: cfg.topDonors.flyScale });
            }
        });
        root.addEventListener('pointerleave', () => { if (activePointerId == null) hideLocalHand(); });

        root.addEventListener('pointerup', event => {
            if (!canEdit() || !isActivePointer(event)) return;
            if (dragging) {
                const leaf = dragging;
                dragging = null;
                renderHandImage();
                relayHand(true);
                if (binContains(event.clientX, event.clientY)) {
                    const collectTo = receiveLeaf(leaf);
                    relayLeafDrag(leaf, 'leafEnd', 'collect', collectTo);
                } else {
                    relayLeafDrag(leaf, 'leafEnd', returnLeaf(leaf));
                }
            }
            if (binDragging) {
                binDragging = null;
                renderHandImage();
                relayHand(true);
                relayDragPosition('bin', true);
                persistOverlayPositions();
            }
            if (hudDragging) {
                hudDragging = null;
                renderHandImage();
                relayHand(true);
                relayDragPosition('hud', true);
                persistOverlayPositions();
            }
            if (topBoardDragging) {
                topBoardDragging = null;
                renderHandImage();
                relayHand(true);
                relayTopDonors(topBoardPos(), true);
                persistTopDonors(topBoardPos());
            }
            if (topBoardResizing) {
                topBoardResizing = null;
                renderHandImage();
                relayHand(true);
                relayTopDonors({ boardScale: cfg.topDonors.boardScale }, true);
                persistTopDonors({ boardScale: cfg.topDonors.boardScale });
            }
            if (topFlyDragging || topFlyResizing) {
                topFlyDragging = null;
                topFlyResizing = null;
                releaseFlyRow();
                relayTopDonors(topFlyLayout(), true);
                persistTopDonors(topFlyLayout());
            }
            releaseRootPointer(event.pointerId);
        });

        root.addEventListener('pointercancel', event => { if (isActivePointer(event)) cancelActiveDrag(event.pointerId); });
        root.addEventListener('lostpointercapture', event => { if (isActivePointer(event)) cancelActiveDrag(event.pointerId); });
        addEventListener('blur', () => { cancelActiveDrag(); cancelEffectEditorDrag(); hideLocalHand(); });
        addEventListener('pagehide', () => { cancelActiveDrag(); cancelEffectEditorDrag(); hideLocalHand(); });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) { cancelActiveDrag(); cancelEffectEditorDrag(); hideLocalHand(); }
        });

        bin.addEventListener('pointerdown', event => {
            if (!canEdit() || activePointerId != null) return;
            event.preventDefault();
            event.stopPropagation();
            if (dragging) return;
            binDragging = true;
            moveHand(event);
            renderHandImage();
            relayHand(true);
            captureRootPointer(event.pointerId);
        });

        hud.addEventListener('pointerdown', event => {
            if (!canEdit() || activePointerId != null) return;
            event.preventDefault();
            event.stopPropagation();
            if (dragging || binDragging) return;
            const point = toStagePoint(event);
            hudDragging = { x: point.x / viewport.width * 100 - cfg.display.hudXPercent, y: point.y / viewport.height * 100 - cfg.display.hudYPercent };
            moveHand(event);
            renderHandImage();
            relayHand(true);
            captureRootPointer(event.pointerId);
        });

        topBoard.addEventListener('pointerdown', event => {
            if (!canEdit() || activePointerId != null) return;
            event.preventDefault();
            event.stopPropagation();
            if (dragging || binDragging || hudDragging) return;
            const point = toStagePoint(event);
            topBoardDragging = {
                x: point.x / viewport.width * 100 - cfg.topDonors.boardXPercent,
                y: point.y / viewport.height * 100 - cfg.topDonors.boardYPercent
            };
            moveHand(event);
            renderHandImage();
            relayHand(true);
            captureRootPointer(event.pointerId);
        });

        // ===== Kéo núm đổi cỡ + kéo hàng chữ bay lên xuống =====
        // Hàng chữ đang trôi ngang thì không nắm nổi, nên nắm vào là TẠM DỪNG lượt bay
        // (WAAPI pause), nhả ra bay tiếp từ đúng chỗ đang dở. Muốn ngắm lâu thì cứ giữ tay.
        function grabFlyRow() {
            topFlyAnim?.pause();
            topFlyRow.classList.add('nl-top-grabbed');
        }

        function releaseFlyRow() {
            topFlyRow.classList.remove('nl-top-grabbed');
            topFlyAnim?.play();
        }

        const topFlyLayout = () => ({
            flyYPercent: cfg.topDonors.flyYPercent,
            flyScale: cfg.topDonors.flyScale
        });

        topBoardResizeEl.addEventListener('pointerdown', event => {
            if (!canEditLayout || !canEdit() || activePointerId != null) return;
            event.preventDefault();
            event.stopPropagation();
            topBoardResizing = beginTopResize(topBoard, toStagePoint(event), cfg.topDonors.boardScale);
            moveHand(event);
            renderHandImage();
            relayHand(true);
            captureRootPointer(event.pointerId);
        });

        topFlyResizeEl.addEventListener('pointerdown', event => {
            if (!canEditLayout || !canEdit() || activePointerId != null) return;
            event.preventDefault();
            event.stopPropagation();
            grabFlyRow();
            topFlyResizing = beginTopResize(topFlyRow, toStagePoint(event), cfg.topDonors.flyScale, true);
            captureRootPointer(event.pointerId);
        });

        topFlyRow.addEventListener('pointerdown', event => {
            if (!canEditLayout || !canEdit() || activePointerId != null) return;
            event.preventDefault();
            event.stopPropagation();
            const point = toStagePoint(event);
            grabFlyRow();
            topFlyDragging = { y: point.y / viewport.height * 100 - cfg.topDonors.flyYPercent };
            captureRootPointer(event.pointerId);
        });

        function clearLeaves() {
            cancelActiveDrag();
            cancelEffectEditorDrag();
            hideLocalHand();
            // Xoá cả hàng chờ, nếu không lô đang bơm dở sẽ tiếp tục nhỏ lá xuống sau khi clear.
            spawnQueue = [];
            gusts = [];
            tornadoes = [];
            // Xoá hết mà còn lượt combo đang chờ thì lát nữa gió/lốc vẫn nổ trên sân trống.
            clearActionRepeats();
            // Đang cứu dở mà bấm Xoá hết thì dừng luôn, không để nó nhặt tiếp lá của đợt sau.
            autoCleanUntil = 0;
            autoCleanDebt = 0;
            for (const leaf of leaves) leaf.el.remove();
            leaves = [];
            heights = new Array(COLS).fill(0);
            totalDropped = 0;
            cleaned = 0;
            backlog = 0;
            refreshHud();
            scheduleStateSync();
        }

        function serializeState() {
            return {
                totalDropped,
                cleaned,
                // Snapshot chỉ chứa lá resting. Lá falling được tạo song song từ gameGift/gameCmd
                // để luôn rơi tự do, không bị nạp lại thành một lá đứng yên trên đầu màn hình.
                leaves: leaves.filter(leaf => leaf.state === 'resting').map(leaf => ({
                    id: leaf.id, src: leaf.el.src, size: leaf.size, x: leaf.x, y: leaf.y,
                    rotation: leaf.rotation, spin: leaf.spin, sway: leaf.sway, swaySpeed: leaf.swaySpeed,
                    velocity: leaf.velocity, startX: leaf.startX, state: leaf.state === 'falling' ? 'falling' : 'resting'
                }))
            };
        }

        function scheduleStateSync() {
            // Leaf state không còn được snapshot trong phiên live: review/OBS sinh cùng batch
            // bằng seed nên physics luôn là nguồn sự thật. Giữ hàm no-op cho các call site clear/remove.
            clearTimeout(stateSyncTimer);
        }

        function loadSharedState(state) {
            // Chỉ chấp nhận state RỖNG từ server khi clear/startup. Bỏ qua state lá cũ để
            // một snapshot trễ không bao giờ đặt lá đứng yên giữa màn hình nữa.
            if (!state || !Array.isArray(state.leaves) || state.leaves.length) return;
            // Tab đang render batch rơi của chính nó đã có animation chuẩn; không để snapshot
            // tĩnh từ tab khác xóa/đóng băng batch đó.
            if (leaves.some(leaf => leaf.state === 'falling')) return;
            cancelActiveDrag();
            remoteLeafTargets.clear();
            for (const leaf of leaves) leaf.el.remove();
            leaves = [];
            heights = new Array(COLS).fill(0);
            zIndex = 1;
            backlog = 0;
            totalDropped = Math.max(0, Number(state.totalDropped) || 0);
            cleaned = Math.max(0, Number(state.cleaned) || 0);
            state.leaves.forEach(data => {
                const el = document.createElement('img');
                const size = Math.max(20, Number(data.size) || 110);
                const leaf = {
                    id: data.id || `restored-${++zIndex}`, el, size,
                    x: clamp(Number(data.x) || size / 2, 0, STAGE.width),
                    y: clamp(Number(data.y) || size / 2, size * .25, STAGE.height - size * .2),
                    startX: clamp(Number(data.startX) || Number(data.x) || size / 2, 0, STAGE.width),
                    rotation: Number(data.rotation) || 0, spin: Number(data.spin) || 0,
                    sway: Number(data.sway) || 0, swaySpeed: Number(data.swaySpeed) || 1,
                    velocity: Number(data.velocity) || 100,
                    // Snapshot là điểm đồng bộ, không khôi phục animation dở dang vì lá sẽ bị pointer-events:none.
                    state: 'resting',
                    z: ++zIndex, original: null
                };
                el.className = 'nl-leaf' + (leaf.state === 'resting' ? ' resting' : '');
                el.src = data.src || leafUrls[0];
                el.draggable = false;
                el.style.setProperty('--leaf-size', `${size}px`);
                el.style.zIndex = leaf.z;
                el.addEventListener('pointerdown', event => startLeafDrag(event, leaf));
                pile.appendChild(el);
                leaves.push(leaf);
                if (leaf.state === 'resting') addToPile(leaf);
                leafTransform(leaf);
            });
            refreshHud();
        }

        // Danh mục skin đọc từ đĩa nên phải nạp lại mỗi lần reloadSettings: người dùng có
        // thể vừa thả thêm một bộ mới, hoặc thêm ảnh vào thư mục Tuỳ chỉnh trên Desktop.
        async function loadSkinCatalog() {
            try {
                const data = await (await fetch('/api/nhatla/skins', { cache: 'no-store' })).json();
                skinCatalog = { hat: data.hat || [], thung: data.thung || [] };
            } catch (e) {
                // Giữ nguyên danh mục cũ: mất mạng nội bộ một nhịp không đáng để đống hạt
                // đang chạy bị ném về bộ mặc định.
            }
        }

        // Tách riêng khỏi initialize() vì còn được gọi lại lúc app bật lên sau khi tắt.
        // Không được đụng tới requestAnimationFrame ở đây, gọi 2 lần là chạy 2 vòng lặp
        // song song và mọi animation nhanh gấp đôi.
        async function reloadSettings() {
            // Danh mục phải có TRƯỚC khi applyConfig, vì applyConfig là chỗ tra id skin ra
            // đường dẫn ảnh. Nạp ngược lại thì lần vẽ đầu luôn ra bộ mặc định rồi mới nhảy.
            await loadSkinCatalog();
            try {
                const response = await fetch('/api/games/nhatla/config', { cache: 'no-store' });
                applyConfig(await response.json());
            } catch (e) { applyConfig(cfg); }
        }

        async function initialize() {
            await reloadSettings();
            requestAnimationFrame(tick);
        }

        const socket = window.io({ transports: ['websocket', 'polling'] });
        socket.on('connect', () => {
            clearTimeout(offlineClearTimer);
            // Nhận gameGift thật và snapshot state mới nhất từ server.
            socket.emit('subscribe', isReview ? 'preview' : 'overlay');
            if (!wasOffline) return;
            // App vừa bật lại: hiện lại giao diện và nạp lại cài đặt, vì người dùng có thể
            // đã đổi vị trí thùng rác / cỡ lá / ảnh lá trong lúc overlay đang offline.
            wasOffline = false;
            document.body.classList.remove('nl-offline');
            reloadSettings();
        });
        // Server chạy chung tiến trình với app, nên mất socket = app đã tắt. OBS phải tự ẩn
        // sạch, nếu không thùng rác + bảng số + đống lá kẹt trên scene suốt lúc app đóng.
        // Chờ 4s để bỏ qua reconnect chớp nhoáng lúc app restart.
        socket.on('disconnect', () => {
            clearTimeout(offlineClearTimer);
            offlineClearTimer = setTimeout(() => {
                if (socket.connected) return;
                wasOffline = true;
                stopEffectSequence();
                handHitUntil = 0;
                clearHandHit();
                clearLeaves();
                hideLocalHand();
                document.body.classList.add('nl-offline');
            }, 4000);
        });
        socket.on('gameConfig', ({ gameId, config }) => { if (gameId === 'nhatla') applyConfig(config); });
        socket.on('gameStateSnapshot', ({ gameId, state }) => { if (gameId === 'nhatla') loadSharedState(state); });
        socket.on('nhatla:state', ({ sourceId, state }) => { if (sourceId !== socket.id) loadSharedState(state); });
        socket.on('nhatla:transient', data => {
            if (data?.type === 'display' && data.display && typeof data.display === 'object') {
                applyConfig({ ...cfg, display: { ...cfg.display, ...data.display } });
            }
            if (data?.type === 'bin') {
                // Không nội suy vị trí thùng: lúc thả lá, mọi view phải có đúng một tâm thùng.
                cfg.display.binXPercent = clamp(Number(data.binXPercent), 5, 95);
                cfg.display.binYPercent = clamp(Number(data.binYPercent), 5, binYMax());
                applyBinPosition();
            }
            if (data?.type === 'hud') {
                cfg.display.hudXPercent = clamp(Number(data.hudXPercent), 0, 90);
                cfg.display.hudYPercent = clamp(Number(data.hudYPercent), 0, 90);
                applyHudPosition();
            }
            if (data?.type === 'topdonors' && data.topDonors && typeof data.topDonors === 'object') {
                cfg.topDonors = game.normalizeConfig({ ...cfg, topDonors: { ...cfg.topDonors, ...data.topDonors } }).topDonors;
                // Đổi giãn cách/kiểu bay từ panel phải tính lại đồng hồ ngay, nếu không phải
                // chờ hết chu kỳ cũ (có thể tới 10 phút) mới thấy giá trị mới có tác dụng.
                applyTopDonors({ restartFly: true });
            }
            if (data?.type === 'leaf') {
                const leaf = leaves.find(item => item.id === data.leafId);
                if (!leaf || leaf.state === 'collecting') return;
                if (!leaf.original) leaf.original = { x: leaf.x, y: leaf.y, z: leaf.z, rotation: leaf.rotation };
                leaf.state = 'dragging';
                remoteLeafTargets.set(leaf.id, {
                    x: clamp(Number(data.x), leaf.size * .1, STAGE.width - leaf.size * .1),
                    y: clamp(Number(data.y), leaf.size * .1, STAGE.height - leaf.size * .1),
                    rotation: Number(data.rotation) || leaf.rotation
                });
                leaf.el.classList.remove('resting');
                leaf.el.classList.add('dragging');
                leaf.el.style.zIndex = 99999;
            }
            if (data?.type === 'leafEnd') {
                const leaf = leaves.find(item => item.id === data.leafId);
                if (!leaf) return;
                const target = remoteLeafTargets.get(leaf.id);
                if (target) { leaf.x = target.x; leaf.y = target.y; leaf.rotation = target.rotation; }
                remoteLeafTargets.delete(leaf.id);
                if (Number.isFinite(Number(data.binXPercent)) && Number.isFinite(Number(data.binYPercent))) {
                    cfg.display.binXPercent = clamp(Number(data.binXPercent), 5, 95);
                    cfg.display.binYPercent = clamp(Number(data.binYPercent), 5, binYMax());
                    applyBinPosition();
                }
                if (data.action === 'collect') receiveLeaf(leaf, data.collectTo);
                // Bên thả đã quyết định rơi tự do hay dán về chỗ cũ; các view khác thi hành
                // đúng quyết định đó thay vì tự tính lại theo đống lá của riêng mình.
                else if (data.action === 'fall') dropLeafFreely(leaf);
                else if (data.action === 'return') returnLeaf(leaf, false);
            }
            if (data?.type === 'effect') {
                const rule = findEffectRule(data.effectId);
                if (rule) playEffect(rule, { x: clamp(Number(data.x), 0, STAGE.width), y: clamp(Number(data.y), 0, STAGE.height) }, true);
            }
            if (data?.type === 'hand') {
                remoteHandTarget = { x: clamp(Number(data.x), 0, STAGE.width), y: clamp(Number(data.y), 0, STAGE.height), closed: !!data.closed };
                remoteHandAt = performance.now();
            }
        });
        socket.on('gameGift', gift => {
            if (!cfg.enabled) return;
            const count = game.leavesForGift(cfg, gift?.giftId, gift?.giftName, gift?.coinValue || gift?.diamondCount, gift?.repeatCount);
            if (count > 0) spawnLeaves(count, `gift-${gift?.ts || Date.now()}-${gift?.giftId || ''}-${gift?.repeatCount || 1}`);
        });
        // Quà thật và nút Chạy thử/phím tắt đi hai đường socket khác nhau nhưng phải xử lý
        // y hệt nhau: view đang cầm lá chạy đủ luồng buông lá, mọi view còn lại (kể cả
        // khung review và OBS) vẫn phát WEBM + bàn tay sưng để ba màn hình khớp nhau.
        function receiveEffectGift(rule, targetSocketId, repeat) {
            const isTarget = targetSocketId ? targetSocketId === socket.id : !!dragging;
            if (isTarget) triggerEffectGift(rule, { relay: false, repeat });
            else runEffectSequence(rule, repeat, true);
        }
        socket.on('nhatla:effect', data => {
            const rule = findEffectRule(data?.effectId);
            if (!rule) return;
            receiveEffectGift(rule, data.targetSocketId, data.repeat);
        });
        socket.on('gameCmd', ({ gameId, cmd, payload, seq }) => {
            if (gameId !== 'nhatla') return;
            if (cmd === 'clear' || cmd === 'reset') clearLeaves();
            if (cmd === 'drop') spawnLeaves(payload?.count || 1, `cmd-${seq || Date.now()}`);
            if (cmd === 'autoClean') startAutoClean(payload?.durationMs, payload?.leavesPerSec, payload?.seed);
            // Bay thử: bỏ qua đồng hồ đếm, bay ngay một lượt rồi trở lại nhịp bình thường.
            if (cmd === 'topFly' && !topFlyAnim) { clearTimeout(topFlyTimer); runTopFly({ demo: true }); }
            if (cmd === 'wind') {
                // seed đi kèm lệnh để overlay và preview dựng CÙNG một trường nhiễu,
                // nên hai bên thấy lá bay giống hệt nhau — cùng cơ chế seed như spawnLeaf.
                const p = payload || {};
                const gy = Number(p.y);
                const baseSeed = p.seed != null ? Number(p.seed) : ((Number(seq) || Date.now()) & 0x7fffffff);
                const gap = Number(p.durationMs) || Number(cfg.wind?.durationMs) || 1500;
                queueActionRepeats(p.repeat, gap, i => {
                    // Mỗi lượt lệch vị trí và seed theo chỉ số, nhưng suy ra từ seed gốc của
                    // server nên overlay và preview vẫn ra y hệt nhau.
                    const r = makeSeededRandom(`wind:${baseSeed}:${i}`);
                    const gx = i === 0 && isFinite(Number(p.x))
                        ? Number(p.x)
                        : rand(120, viewport.width - 120, r);
                    startGust(gx, gy, { ...p, seed: (baseSeed + i * 7919) & 0x7fffffff });
                });
            }
            if (cmd === 'tornado') {
                const p = payload || {};
                const baseSeed = p.seed != null ? Number(p.seed) : ((Number(seq) || Date.now()) & 0x7fffffff);
                const gap = Number(p.durationMs) || Number(cfg.tornado?.durationMs) || 3200;
                queueActionRepeats(p.repeat, gap, i => {
                    const r = makeSeededRandom(`torn:${baseSeed}:${i}`);
                    const tx = i === 0 && isFinite(Number(p.x))
                        ? Number(p.x)
                        : rand(200, viewport.width - 200, r);
                    startTornado(tx, Number(p.y), { ...p, dir: r() < .5 ? 'left' : 'right' });
                });
            }
            if (cmd === 'effect') {
                const rule = findEffectRule(payload?.effectId);
                if (!rule) return;
                receiveEffectGift(rule, payload?.targetSocketId, payload?.repeat);
            }
        });
        socket.on('nhatla:top', data => {
            topList = Array.isArray(data?.list) ? data.list : [];
            // Bảng đứng cập nhật ngay; lượt bay đang chạy thì applyTopDonors bỏ qua và để nó
            // bay nốt — thay thẻ giữa đường là tên đổi đột ngột ngay trước mắt người xem.
            applyTopDonors();
        });
        socket.on('gameDisabled', ({ gameId }) => { if (gameId === 'nhatla') document.body.classList.add('nl-stopped'); });
        socket.on('gameEnabled', ({ gameId }) => { if (gameId === 'nhatla') document.body.classList.remove('nl-stopped'); });
        socket.on('overlay:reload', data => { if (!data?.gameId || data.gameId === 'nhatla') location.reload(); });

        addEventListener('resize', () => {
            fitStage();
            applyBinPosition();
        });
        root.addEventListener('contextmenu', event => event.preventDefault());
        addEventListener('message', event => {
            if (event.origin !== location.origin || event.data?.type !== 'nhatla:effect-editor') return;
            if (Array.isArray(event.data.effectGifts)) cfg.effects.effectGifts = event.data.effectGifts;
            editingEffectId = event.data.effectId || null;
            renderEffectEditor();
        });
        effectEditor.addEventListener('pointerdown', event => {
            if (effectEditor.hidden) return;
            event.preventDefault();
            event.stopPropagation();
            effectEditorPointerId = event.pointerId;
            effectEditorResize = !!event.target.closest('[data-resize-corner]');
            effectEditor.setPointerCapture?.(event.pointerId);
        });
        effectEditor.addEventListener('pointermove', event => {
            if (event.pointerId !== effectEditorPointerId) return;
            const rule = editingEffectId && findEffectRule(editingEffectId);
            if (!rule) return;
            const point = toStagePoint(event);
            if (effectEditorResize) {
                const centerX = rule.positionXPercent / 100 * STAGE.width;
                const centerY = rule.positionYPercent / 100 * STAGE.height;
                rule.scale = clamp(Math.hypot(point.x - centerX, point.y - centerY) / Math.hypot(90, 60) * 100, 20, 500);
            } else {
                rule.positionXPercent = clamp(point.x / STAGE.width * 100, 0, 100);
                rule.positionYPercent = clamp(point.y / STAGE.height * 100, 0, 100);
            }
            renderEffectEditor();
        });
        const finishEffectEditorDrag = event => {
            if (event.pointerId !== effectEditorPointerId) return;
            cancelEffectEditorDrag();
        };
        effectEditor.addEventListener('pointerup', finishEffectEditorDrag);
        effectEditor.addEventListener('pointercancel', finishEffectEditorDrag);
        effectEditor.addEventListener('lostpointercapture', finishEffectEditorDrag);
        fitStage();
        initialize();
    })();
    </script>
</body>
