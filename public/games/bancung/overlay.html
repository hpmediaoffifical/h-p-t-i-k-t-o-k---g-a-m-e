    </div>

    <!-- Killing blow callout -->
    <div class="bc-killing-blow" id="bc-killing-blow">
        <div class="bc-kb-avatar"></div>
        <div class="bc-kb-text">
            <div class="bc-kb-title">💀 PHÁT KẾT LIỄU</div>
            <div class="bc-kb-name"></div>
        </div>
    </div>

    <!-- Top-3 podium -->
    <div class="bc-podium" id="bc-podium">
        <div class="bc-podium-title">🏆 TOP CUNG THỦ</div>
        <div class="bc-podium-row" id="bc-podium-row"></div>
        <div class="bc-podium-survival" id="bc-podium-survival"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/games/bancung/game.js"></script>
    <script src="/games/bancung/bow-anim.js"></script>
    <script>
    (function () {
        'use strict';
        const helper = window.HpGame.bancung;
        const $stageHearts = document.getElementById('bc-hearts-stage');
        const $innerHearts = document.getElementById('bc-hearts-inner');
        const $stageBow = document.getElementById('bc-bow-stage');
        const $innerBow = document.getElementById('bc-bow-inner');
        const $bow = document.getElementById('bc-bow');
        const $heartsRow = document.getElementById('bc-hearts-row');
        const $heartsNum = document.getElementById('bc-hearts-num');
        const $redflash = document.getElementById('bc-redflash');
        const $deathCountdown = document.getElementById('bc-dead-countdown');
        const $arrowsLayer = document.getElementById('bc-arrows-layer');
        const $banner = document.getElementById('bc-banner');
        const $topList = document.getElementById('bc-top-list');
        const $top = document.getElementById('bc-top');
        const $impact = document.getElementById('bc-impact-zone');
        const $combo = document.getElementById('bc-combo');
        const $comboNum = document.getElementById('bc-combo-num');
        const $survival = document.getElementById('bc-survival');
        const $survivalTime = document.getElementById('bc-survival-time');
        const $survivalRec = document.getElementById('bc-survival-record');
        const $killingBlow = document.getElementById('bc-killing-blow');
        const $podium = document.getElementById('bc-podium');
        const $podiumRow = document.getElementById('bc-podium-row');
        const $podiumSurv = document.getElementById('bc-podium-survival');
        // Cây cung vẽ + hoạt cảnh: lắp tên → kéo căng → buông → rung dây → lắp tên mới (bow-anim.js)
        const bowCtl = window.HpBow ? window.HpBow.mount($bow) : null;
        window.__bcBow = bowCtl;          // để soi/thử trong DevTools
        // Mũi tên đang bay / cắm trên người: khấc ở x=10, mũi nhọn ở x=132 trong viewBox 140×34 (như cũ)
        const ARROW_ART = window.HpBow ? window.HpBow.arrowSvg(122) : '<line class="shaft" x1="0" y1="0" x2="108" y2="0"/><polygon class="head" points="122,0 104,-8 104,8"/>';
        const $giftList = document.getElementById('bc-giftlist');

        // Edit mode (panel popout) — drag + wheel zoom + right-click close
        const isEdit = new URLSearchParams(location.search).get('edit') === '1';
        // 🔇 cam-frame-guard.js: khung đang được chơi (link riêng luôn true khi còn nối app). Chế độ sửa vị trí luôn chạy.
        const frameOn = () => isEdit || !window.HpCamFrame || window.HpCamFrame.active;
        // Nạp trong 🎥 Game Camera (/overlay/camgames → iframe ?cam=1): luôn bám người thật, khỏi bật ô bodyTrack.
        const isCamHub = new URLSearchParams(location.search).get('cam') === '1';
        if (isEdit) {
            document.body.classList.add('bc-edit');
            // Right-click anywhere → close window nhanh sau khi sửa xong
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                try { window.close(); } catch (err) {}
            });
        }

        let state = null;
        let config = null;
        let _prevHp = null;
        let _deadCountdownTimer = null;

        // ===== BÁM THEO NGƯỜI (camera trong OBS + MediaPipe Pose) =====
        // bodyTrack do module /games/bancung/body-track.mjs tạo rồi trao qua window.__bcTrackHost.ready().
        // trackWanted = cấu hình bật (và không ở chế độ sửa vị trí). Khi thấy người: hàng tim bám đỉnh
        // đầu, điểm trúng = tâm thân, mũi tên bay vào thân/đầu thật, vết máu + mũi tên cắm dính theo người.
        const $trackWarn = document.getElementById('bc-track-warn');
        let bodyTrack = null;
        // 👁 Vùng khung trang còn thấy trên OBS (Scene PK / Colab cắt ô khung cam): tim / cung / điểm trúng / bảng quà / top đặt % theo
        // vùng này (createCamView (/lib/obs-scene-map.mjs), toạ độ = px trang như body-track). Không bị cắt thì giữ '%' như cũ.
        let camView = null;
        const viewRect = () => (camView ? camView.rect : null);
        const viewCut = () => { const v = viewRect(); return !!v && (v.x > 0.5 || v.y > 0.5 || v.w < innerWidth - 1 || v.h < innerHeight - 1); };
        const atX = p => { if (!viewCut()) return p + '%'; const v = viewRect(); return (v.x + p / 100 * v.w) + 'px'; };
        const atY = p => { if (!viewCut()) return p + '%'; const v = viewRect(); return (v.y + p / 100 * v.h) + 'px'; };
        import('/lib/obs-scene-map.mjs').then(m => {
            camView = m.createCamView({ W: innerWidth, H: innerHeight, overlayId: 'bancung', getLayout: () => bodyTrack && bodyTrack.layout,
                onChange: () => { if (config) applyConfig(config); } });
        }).catch(e => console.warn('[bancung] cam-view:', e));
        let trackWanted = false;
        let trackingNow = false;          // khung vừa rồi có thấy người
        let lastHitPt = null;             // { x, y, at } — điểm mũi tên vừa chạm (cho hạt bụi / banner)
        const bodyMarks = [];             // [{ el, mark:{frame,a,b}, born, life, fadeFrom, alpha, tail }]
        let _warnAt = 0;
        // Chớp đỏ theo hình cơ thể: canvas nửa độ phân giải (CSS phóng 100%) + canvas phụ vẽ bóng người đặc.
        const $bodyFlash = document.getElementById('bc-body-flash');
        const bodyFlashCtx = $bodyFlash.getContext('2d');
        const bodyMask = document.createElement('canvas');
        const bodyMaskCtx = bodyMask.getContext('2d');
        let bodyFlashAt = -1e9;           // lúc trúng gần nhất (performance.now)
        // Trúng tên: người phủ đỏ nhạt — sáng lên 90ms, giữ tới 380ms rồi mờ hết ở 1100ms.
        // Bắn dồn thì mỗi phát kéo dài lại → người đỏ liên tục.
        const BODY_FLASH_MS = 1100, BODY_FLASH_UP = 90, BODY_FLASH_HOLD = 380;
        // Cháy đen khi hết máu: hiện dần lúc chết, mờ dần lúc hồi sinh.
        const $bodyChar = document.getElementById('bc-body-char');
        const bodyCharCtx = $bodyChar.getContext('2d');
        let charDeadAt = 0;               // performance.now lúc chết (0 = đang sống)
        let charReviveAt = -1e9;          // performance.now lúc hồi sinh — để mờ dần
        const CHAR_IN_MS = 650, CHAR_OUT_MS = 900;
        let _maskAt = -1;                 // khung đã vẽ bóng người (vẽ 1 lần / khung cho cả chớp đỏ lẫn cháy đen)
        let _maskSeg = false;             // bóng người khung này lấy từ mặt nạ model (true) hay vẽ từ khớp (false)

        // ===== Heart bar render (supports half hearts) =====
        function renderHearts(hp, maxHp) {
            const max = Math.max(1, Math.round(maxHp || 10));
            // Máu lớn (Boss/tự nhập 50, 999…) mà vẽ 1 tim/1 máu thì hàng tim tràn ngang khung → trên 20 máu chỉ vẽ 10 tim,
            // mỗi tim = max/10 máu. Số máu thật vẫn hiện ở dòng số bên dưới.
            const icons = max > 20 ? 10 : max;
            const unit = max / icons;
            $heartsRow.innerHTML = '';
            for (let i = 0; i < icons; i++) {
                const idx = i + 1;
                const h = document.createElement('div');
                h.className = 'bc-heart';
                // Mỗi tim = `unit` máu. fillThis = clamp((hp - i·unit) / unit, 0, 1)
                const fill = Math.max(0, Math.min(1, (hp - i * unit) / unit));
                if (fill >= 0.9) {
                    // full
                } else if (fill >= 0.4) {
                    h.classList.add('half');
                } else {
                    h.classList.add('empty');
                }
                // recently-lost: if was full and now isn't
                if (_prevHp != null && Math.ceil(_prevHp / unit) >= idx && Math.ceil(hp / unit) < idx) {
                    h.classList.add('recently-lost');
                }
                $heartsRow.appendChild(h);
            }
            $heartsNum.innerHTML = `<span>${(Math.round(hp * 10) / 10).toFixed(hp % 1 === 0 ? 0 : 1)}</span><span class="ratio"> / ${max}</span> ❤`;
            _prevHp = hp;
        }

        // ===== Màu vết máu: đỏ / xanh lá / xanh dương / hồng (lõi, giữa, nhạt) — chỉ vết máu, chớp đỏ giữ nguyên =====
        const BLOOD_COLORS = {
            red:   ['120,0,0',   '165,8,8',    '190,15,15'],
            green: ['12,90,16',  '30,150,36',  '70,195,50'],
            blue:  ['8,40,130',  '25,85,195',  '60,135,240'],
            pink:  ['140,15,85', '210,45,135', '245,100,180']
        };
        function applyBloodColor(name) {
            const p = BLOOD_COLORS[name] || BLOOD_COLORS.red;
            const st = document.body.style;
            st.setProperty('--blood-core', p[0]); st.setProperty('--blood-mid', p[1]); st.setProperty('--blood-lite', p[2]);
        }

        // ===== Apply config (skin, position, scale, toggles) =====
        function applyConfig(cfg) {
            config = cfg || {};
            const d = config.display || {};
            // Màu vết máu (PUBG-style) — chỉ vết máu chỗ mũi tên găm
        applyBloodColor(d.bloodColor);
        // Hearts position
            $stageHearts.style.left = atX(d.heartsXPercent ?? 50);
            $stageHearts.style.top  = atY(d.heartsYPercent ?? 14);
            const hScale = ((d.heartsScale ?? 100) / 100);
            $innerHearts.style.transform = 'scale(' + hScale + ')';
            document.body.style.setProperty('--hp-scale', hScale);
            // Bow position
            $stageBow.style.left = atX(d.bowXPercent ?? 85);
            $stageBow.style.top  = atY(d.bowYPercent ?? 80);
            $innerBow.style.transform = 'scale(' + ((d.bowScale ?? 100) / 100) + ')';
            // Bow skin colors
            const skin = helper.getBowSkin(d.bowSkin || 'classic');
            document.body.style.setProperty('--bow-color', skin.bowColor);
            document.body.style.setProperty('--string-color', skin.stringColor);
            document.body.style.setProperty('--arrow-color', skin.arrowColor);
            document.body.style.setProperty('--skin-glow', skin.glow || 'transparent');
            // Heart style class
            document.body.classList.remove('bc-heart-pixel','bc-heart-glossy','bc-heart-fire','bc-heart-crystal');
            document.body.classList.add('bc-heart-' + (d.heartStyle || 'pixel'));
            // Effect intensities
            document.body.style.setProperty('--flash-strength', ((d.redFlashIntensity ?? 60) / 100).toFixed(2));
            document.body.style.setProperty('--death-opacity', ((d.deathTintOpacity ?? 75) / 100).toFixed(2));
            // Toggles
            document.body.classList.toggle('no-hearts', d.showHearts === false);
            document.body.classList.toggle('no-bow', d.showBowWidget === false);
            document.body.classList.toggle('no-top', d.showTopContrib === false);
            document.body.classList.toggle('no-deathpanel', d.showDeathPanel !== true);
            // Top position
            $top.style.left = $top.style.right = $top.style.top = $top.style.bottom = '';
            const pos = d.topContribPos || 'bottom-left';
            if (pos.includes('top')) $top.style.top = 'calc(var(--cv-t, 0px) + 24px)';
            else $top.style.bottom = 'calc(var(--cv-b, 0px) + 40px)';
            if (pos.includes('right')) $top.style.right = 'calc(var(--cv-r, 0px) + 24px)';
            else $top.style.left = 'calc(var(--cv-l, 0px) + 24px)';
            // Impact zone position (where arrows land)
            $impact.style.left = atX(d.impactXPercent ?? 50);
            $impact.style.top = atY(d.impactYPercent ?? 18);
            // Survival timer visibility
            if ($survival) $survival.style.display = (d.showSurvivalTimer !== true) ? 'none' : '';
            // Bow charge ring visibility
            if (d.bowChargeEnabled !== true) { bowCtl?.setCharge(0); $bow.classList.remove('charge-full'); }
            // Gift list visibility + position + scale + layout
            document.body.classList.toggle('no-giftlist', d.showGiftList === false);
            document.body.classList.toggle('no-hpnum', d.showHpNumber === false);
            if ($giftList) {
                $giftList.style.left = atX(d.giftListXPercent ?? 4);
                $giftList.style.top = atY(d.giftListYPercent ?? 30);
                $giftList.style.transform = 'scale(' + ((d.giftListScale ?? 100) / 100) + ')';
                $giftList.classList.toggle('layout-horizontal', d.giftListLayout === 'horizontal');
            }
            renderGiftList();
            // Bow auto-aim toward impact zone — calculated AFTER layout settles
            requestAnimationFrame(updateBowAim);
            syncBodyTrack();
        }

        // ===== Bám theo người =====
        function syncBodyTrack() {
            const d = config?.display || {};
            trackWanted = (d.bodyTrack === true || isCamHub) && !isEdit;
            if (bodyTrack) { bodyTrack.maskSmooth = d.maskSmooth !== false; bodyTrack.setEnabled(trackWanted); }
            if (!trackWanted) { restoreLayout(); showTrackWarn(''); }
        }
        // Vị trí/cỡ theo cấu hình (khi không thấy người hoặc tắt bám).
        function restoreLayout() {
            if (!trackingNow && !document.body.classList.contains('bc-tracking')) return;
            trackingNow = false;
            document.body.classList.remove('bc-tracking');
            const d = config?.display || {};
            $stageHearts.style.left = atX(d.heartsXPercent ?? 50);
            $stageHearts.style.top  = atY(d.heartsYPercent ?? 14);
            const hScale = ((d.heartsScale ?? 100) / 100);
            $innerHearts.style.transform = 'scale(' + hScale + ')';
            document.body.style.setProperty('--hp-scale', hScale);
            $impact.style.left = atX(d.impactXPercent ?? 50);
            $impact.style.top = atY(d.impactYPercent ?? 18);
            requestAnimationFrame(updateBowAim);
        }
        function showTrackWarn(text) {
            if (!$trackWarn) return;
            if (!text) { $trackWarn.classList.remove('show'); return; }
            $trackWarn.textContent = '🧍 Bám theo người: ' + text;
            $trackWarn.classList.add('show');
        }
        // Hàng tim lên đỉnh đầu, điểm trúng về tâm thân — gọi mỗi khung khi thấy người.
        function followBody(B) {
            const d = config?.display || {};
            if (!trackingNow) { trackingNow = true; document.body.classList.add('bc-tracking'); }
            const W = window.innerWidth, H = window.innerHeight;
            // Cỡ tim theo cỡ đầu: đứng gần camera đầu to → tim to, có giới hạn để không phá bố cục.
            const headW = B.head ? B.head.width : B.shoulderW * 0.55;
            const k = Math.max(0.65, Math.min(1.4, headW / 180));
            const hScale = ((d.heartsScale ?? 100) / 100) * k;
            $innerHearts.style.transform = 'scale(' + hScale + ')';
            document.body.style.setProperty('--hp-scale', hScale);
            const crown = B.head ? B.head.crown : { x: B.torso.O.x, y: B.torso.O.y - B.shoulderW * 0.95 };
            const r = $innerHearts.getBoundingClientRect();
            const h = r.height || 60, w = r.width || 200;
            const gap = 14 + headW * 0.08;
            // Giữ trọn hàng tim trong khung (vùng thấy — Scene PK cắt ô): hàng rộng hơn khung thì căn giữa khung.
            const v = viewRect() || { x: 0, y: 0, w: W, h: H };
            const x = w + 12 < v.w ? Math.max(v.x + w / 2 + 6, Math.min(v.x + v.w - w / 2 - 6, crown.x)) : v.x + v.w / 2;
            const y = Math.max(v.y + h / 2 + 6, Math.min(v.y + v.h - h / 2, crown.y - gap - h / 2));
            $stageHearts.style.left = x + 'px';
            $stageHearts.style.top = y + 'px';
            // Điểm trúng = tâm thân → cung tự xoay theo người (chỉ tính lại khi dời > 3px cho nhẹ).
            $impact.style.left = B.center.x + 'px';
            $impact.style.top = B.center.y + 'px';
            updateBowAim(B);              // mỗi khung — tự bỏ qua khi góc gần như không đổi
        }
        // Vòng vẽ: lọc pose, bám đầu, kéo vết máu/mũi tên cắm theo thân, mờ dần theo tuổi.
        function trackFrame(now) {
            requestAnimationFrame(trackFrame);
            if (!frameOn()) return;                 // khung không được chơi (ẩn trong 🎥 Game Camera / mất kết nối app)
            if (!bodyTrack) { updateMarks(now, null); return; }
            let B = null;
            if (trackWanted) {
                bodyTrack.tick(now);
                B = bodyTrack.body();
                if (B) followBody(B); else restoreLayout();
                if (now - _warnAt > 1000) { _warnAt = now; showTrackWarn(B || trackingNow ? '' : bodyTrack.problem()); }
            }
            drawBodyFlash(now, B);
            drawBodyChar(now, B);
            updateMarks(now, B);
        }
        // Vết máu / mũi tên cắm: mark → dính theo thân (toạ độ cục bộ); pos → đứng yên tại điểm trúng (không bám người).
        function updateMarks(now, B) {
            for (let i = bodyMarks.length - 1; i >= 0; i--) {
                const m = bodyMarks[i], age = now - m.born;
                if (age > m.life) { m.el.remove(); bodyMarks.splice(i, 1); continue; }
                const p = m.pos || (B && bodyTrack ? bodyTrack.toStage(m.mark, B) : null);
                if (!p) { m.el.style.opacity = '0'; continue; }     // mất người: ẩn, thấy lại thì hiện đúng chỗ
                const fade = age < m.fadeFrom ? 1 : 1 - (age - m.fadeFrom) / (m.life - m.fadeFrom);
                m.el.style.opacity = (m.alpha * fade).toFixed(3);
                m.el.style.transform = 'translate(' + p.x + 'px, ' + p.y + 'px) ' + m.tail;
            }
        }
        // Mũi tên vừa chạm người tại (x,y): mũi tên GĂM lại (lắc nhẹ) + vết máu loang/chảy, dính theo thân rồi mờ dần.
        // B = null → không bám người: đứng yên tại điểm trúng.
        function landOnBody(x, y, frame, fallbackMark, angle, B) {
            const mark = B ? (bodyTrack.toLocal(x, y, frame, B) || fallbackMark) : null;
            if (B && !mark) return;
            const pos = mark ? null : { x, y };
            const sw = B ? B.shoulderW : 300;
            const born = performance.now();
            if (config?.display?.bloodMarks !== false) {
                const el = document.createElement('div');
                el.className = 'bc-blood';
                const k = sw * (0.24 + Math.random() * 0.1) / 80;           // vết ~ 1/4 bề vai
                el.innerHTML = '<div class="splat" style="transform-origin:50% 50%;rotate:' + Math.floor(Math.random() * 360) + 'deg"></div>'
                             + '<div class="drip" style="--drip:' + Math.round(30 + Math.random() * 40) + 'px;left:' + Math.round(-8 + Math.random() * 10) + 'px"></div>';
                el.style.opacity = '0';
                $arrowsLayer.insertBefore(el, $arrowsLayer.firstChild);   // máu nằm dưới mũi tên
                bodyMarks.push({ el, mark, pos, born, life: 4500, fadeFrom: 2600, alpha: 1,
                    tail: 'scale(' + k.toFixed(3) + ')' });
            }
            const ar = document.createElement('div');
            ar.className = 'bc-stuck-arrow';
            ar.innerHTML = '<svg viewBox="0 0 140 34"><g transform="translate(10,17)">' + ARROW_ART + '</g></svg>';
            ar.style.opacity = '0';
            $arrowsLayer.appendChild(ar);
            const scl = Math.max(0.6, Math.min(1.1, sw / 360));
            bodyMarks.push({ el: ar, mark, pos, born, life: 3000, fadeFrom: 1900, alpha: 1, tail: 'rotate(' + angle + 'rad) scale(' + scl.toFixed(2) + ')' });
            // Combo lớn (tới 999 mũi): giữ tối đa 80 vết máu / mũi găm trên trang, bỏ cái cũ nhất trước — OBS không nặng dần.
            while (bodyMarks.length > 80) { const old = bodyMarks.shift(); try { old.el.remove(); } catch (_) {} }
        }
        // Bóng người đặc từ 33 điểm pose: đầu (elip), thân (tứ giác vai–hông), tay/chân (nét tròn đầu).
        // Vẽ đặc màu trắng lên canvas phụ → chồng lên nhau không bị đậm gấp đôi.
        function paintSilhouette(ctx, P, B, k) {
            const ok = i => P[i] && (P[i].v ?? 1) >= 0.5;
            const X = i => P[i].x * k, Y = i => P[i].y * k;
            const sw = B.shoulderW * k;
            ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            // thân: tứ giác vai–hông (hông thiếu thì dùng khung v đã suy ra), nở ra chút cho ôm người
            const T = B.torso;
            const quad = [[T.O.x - T.u.x / 2, T.O.y - T.u.y / 2], [T.O.x + T.u.x / 2, T.O.y + T.u.y / 2],
                          [T.O.x + T.u.x * 0.42 + T.v.x, T.O.y + T.u.y * 0.42 + T.v.y], [T.O.x - T.u.x * 0.42 + T.v.x, T.O.y - T.u.y * 0.42 + T.v.y]];
            ctx.beginPath(); quad.forEach(([x, y], i) => i ? ctx.lineTo(x * k, y * k) : ctx.moveTo(x * k, y * k)); ctx.closePath();
            ctx.lineWidth = sw * 0.22; ctx.fill(); ctx.stroke();
            // đầu: elip quanh tâm đầu, cao hơn rộng
            if (B.head) {
                const h = B.head, ang = Math.atan2(h.u.y, h.u.x);
                ctx.save(); ctx.translate(h.c.x * k, h.c.y * k); ctx.rotate(ang);
                ctx.beginPath(); ctx.ellipse(0, -h.width * k * 0.16, h.width * k * 0.68, h.width * k * 0.95, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                // cổ
                ctx.beginPath(); ctx.moveTo(h.c.x * k, h.c.y * k); ctx.lineTo(T.O.x * k, T.O.y * k); ctx.lineWidth = sw * 0.3; ctx.stroke();
            }
            // tay (vai→khuỷu→cổ tay) và chân (hông→gối→cổ chân): chỉ đoạn nào thấy đủ 2 đầu
            const limbs = [[11, 13, 0.36], [13, 15, 0.3], [12, 14, 0.36], [14, 16, 0.3], [23, 25, 0.5], [25, 27, 0.42], [24, 26, 0.5], [26, 28, 0.42]];
            for (const [a, b, w] of limbs) {
                if (!ok(a) || !ok(b)) continue;
                ctx.beginPath(); ctx.moveTo(X(a), Y(a)); ctx.lineTo(X(b), Y(b)); ctx.lineWidth = sw * w; ctx.stroke();
            }
            // bàn tay / bàn chân: chấm tròn ở cổ tay, cổ chân
            for (const [i, r] of [[15, 0.16], [16, 0.16], [27, 0.2], [28, 0.2]]) {
                if (!ok(i)) continue;
                ctx.beginPath(); ctx.arc(X(i), Y(i), sw * r, 0, Math.PI * 2); ctx.fill();
            }
        }
        // Mỗi khung: nếu vừa trúng (< BODY_FLASH_MS) và đang thấy người → viền đỏ phát sáng quanh bóng người,
        // bên trong hồng nhạt; nhấp nháy 3 nhịp rồi tắt. Không trúng / mất người → canvas trống.
        function drawBodyFlash(now, B) {
            const age = now - bodyFlashAt;
            const ctx = bodyFlashCtx, cw = $bodyFlash.width, ch = $bodyFlash.height;
            if (age > BODY_FLASH_MS || !B || !bodyTrack) { if (cw && $bodyFlash._dirty) { ctx.clearRect(0, 0, cw, ch); $bodyFlash._dirty = false; } return; }
            const P = bodyTrack.points();
            if (!P) return;
            const k = 0.5, W = Math.round(window.innerWidth * k), H = Math.round(window.innerHeight * k);
            if ($bodyFlash.width !== W || $bodyFlash.height !== H) { $bodyFlash.width = W; $bodyFlash.height = H; }
            const seg = ensureMask(now, P, B, k, W, H);
            const a = age < BODY_FLASH_UP ? age / BODY_FLASH_UP
                    : age < BODY_FLASH_HOLD ? 1
                    : 1 - (age - BODY_FLASH_HOLD) / (BODY_FLASH_MS - BODY_FLASH_HOLD);
            const glow = Math.round(6 + B.shoulderW * k * 0.05);
            ctx.clearRect(0, 0, W, H);
            const red = tintMask('#ff2a2a');
            // 1) quầng đỏ mỏng tràn ra ngoài mép người
            // Độ đậm lớp đỏ chỉnh trong panel (bodyFlashOpacity, %); 50% = đỏ nhạt như mặc định.
            const fo = Math.max(0.05, Math.min(1, (Number(config?.display?.bodyFlashOpacity) || 50) / 100));
            ctx.save(); ctx.globalAlpha = Math.min(1, a * fo * 0.9); ctx.filter = 'blur(' + glow + 'px)'; ctx.drawImage(red, 0, 0); ctx.restore();
            // 2) phủ ĐỎ NHẠT đều lên cả người (mặt, tóc, áo, tay chân) — mặt nạ người thì sát hình, không thì bóng từ khớp
            ctx.save(); ctx.globalCompositeOperation = 'destination-out'; ctx.drawImage(bodyMask, 0, 0); ctx.restore();
            ctx.save(); ctx.globalAlpha = Math.min(1, a * fo * (seg ? 1 : 0.85)); ctx.filter = 'blur(1px)'; ctx.drawImage(red, 0, 0); ctx.restore();
            $bodyFlash._dirty = true;
        }
        function ensureMask(now, P, B, k, W, H) {
            if (bodyMask.width !== W || bodyMask.height !== H) { bodyMask.width = W; bodyMask.height = H; _maskAt = -1; }
            if (_maskAt === now) return _maskSeg;
            _maskAt = now;
            bodyMaskCtx.clearRect(0, 0, W, H);
            // Có mặt nạ người từ model → đúng hình người (tóc, áo, tay cầm đồ…); chưa có thì bóng vẽ từ khớp.
            const sm = bodyTrack.segMask(now);
            if (sm) {
                const M = sm.M;
                bodyMaskCtx.save();
                bodyMaskCtx.setTransform(M[0] * k, M[1] * k, M[2] * k, M[3] * k, (M[4] + sm.dx) * k, (M[5] + sm.dy) * k);
                bodyMaskCtx.imageSmoothingEnabled = true;
                bodyMaskCtx.drawImage(sm.canvas, 0, 0);
                bodyMaskCtx.restore();
            } else paintSilhouette(bodyMaskCtx, P, B, k);
            _maskSeg = !!sm;
            return _maskSeg;
        }
        // Hết máu: cả cơ thể cháy đen theo bóng người. Mép khói mờ + than hồng âm ỉ nhấp nháy ở viền.
        function drawBodyChar(now, B) {
            const ctx = bodyCharCtx, cw = $bodyChar.width, ch = $bodyChar.height;
            let a = 0;
            if (charDeadAt) a = Math.min(1, (now - charDeadAt) / CHAR_IN_MS);
            else if (now - charReviveAt < CHAR_OUT_MS) a = 1 - (now - charReviveAt) / CHAR_OUT_MS;
            const P = bodyTrack && bodyTrack.points();
            if (a <= 0 || !B || !P || config?.display?.bodyChar === false) {
                if (cw && $bodyChar._dirty) { ctx.clearRect(0, 0, cw, ch); $bodyChar._dirty = false; }
                return;
            }
            const k = 0.5, W = Math.round(window.innerWidth * k), H = Math.round(window.innerHeight * k);
            if ($bodyChar.width !== W || $bodyChar.height !== H) { $bodyChar.width = W; $bodyChar.height = H; }
            ensureMask(now, P, B, k, W, H);
            const soft = Math.round(4 + B.shoulderW * k * 0.05);
            ctx.clearRect(0, 0, W, H);
            // 1) khói đen lan nhẹ ra ngoài mép
            // Độ đậm lớp đen chỉnh trong panel (bodyCharOpacity, %); 70% = vẫn thấy mờ mờ người bên dưới.
            const co = Math.max(0.05, Math.min(1, (Number(config?.display?.bodyCharOpacity) || 70) / 100));
            ctx.save(); ctx.globalAlpha = a * co * 0.55; ctx.filter = 'blur(' + (soft * 2) + 'px)'; ctx.drawImage(tintMask('#000000'), 0, 0); ctx.restore();
            // 2) than hồng âm ỉ ở viền — nhấp nháy chậm
            const ember = 0.25 + 0.2 * Math.sin(now / 260) + 0.1 * Math.sin(now / 97);
            ctx.save(); ctx.globalAlpha = a * Math.max(0, ember); ctx.filter = 'blur(' + soft + 'px)'; ctx.drawImage(tintMask('#ff3a12'), 0, 0); ctx.restore();
            // 3) thân cháy đen (mép hơi mềm) phủ lên, chừa lại một rìa than mỏng
            ctx.save(); ctx.globalAlpha = a * co; ctx.filter = 'blur(' + Math.max(1, Math.round(soft / 3)) + 'px)'; ctx.drawImage(tintMask('#0a0605'), 0, 0); ctx.restore();
            $bodyChar._dirty = true;
        }
        // Bóng người (trắng) → màu đỏ, giữ alpha: dùng canvas tạm chung.
        let _tint = null;
        function tintMask(color) {
            if (!_tint) { _tint = document.createElement('canvas'); }
            if (_tint.width !== bodyMask.width || _tint.height !== bodyMask.height) { _tint.width = bodyMask.width; _tint.height = bodyMask.height; }
            const c = _tint.getContext('2d');
            c.clearRect(0, 0, _tint.width, _tint.height);
            c.drawImage(bodyMask, 0, 0);
            c.globalCompositeOperation = 'source-in'; c.fillStyle = color; c.fillRect(0, 0, _tint.width, _tint.height);
            c.globalCompositeOperation = 'source-over';
            return _tint;
        }
        requestAnimationFrame(trackFrame);

        // ===== Gift list rendering — render 4 categories of configured gifts =====
        function renderGiftList() {
            if (!$giftList || !config) return;
            const make = (g, kind, tagText) => {
                const img = g.giftImage
                    ? `<img src="${escapeHtml(g.giftImage)}" onerror="this.outerHTML='<span class=&quot;bc-gl-emoji-fallback&quot;>🎁</span>'" />`
                    : `<span class="bc-gl-emoji-fallback">🎁</span>`;
                const tag = tagText ? `<div class="bc-gl-tag">${escapeHtml(tagText)}</div>` : '';
                const displayLabel = (g.customLabel && g.customLabel.trim()) || g.giftName || ('#' + g.giftId);
                return `<div class="bc-gl-card ${kind}" title="${escapeHtml(g.giftName || '')}">
                    ${tag}
                    <div class="bc-gl-icon-wrap">${img}</div>
                    <div class="bc-gl-label">${escapeHtml(displayLabel)}</div>
                </div>`;
            };
            const sections = [
                { list: config.shotGifts,   kind: 'shot',   tag: (g) => (g.shots > 1 ? 'x' + g.shots : '🏹') },
                { list: config.healGifts,   kind: 'heal',   tag: (g) => '+' + (g.healHearts || 1) + '♥' },
                { list: config.reviveGifts, kind: 'revive', tag: () => '✨' },
                { list: config.shieldGifts, kind: 'shield', tag: (g) => (g.durationSec || 5) + 's' }
            ];
            const cards = [];
            for (const s of sections) {
                if (!Array.isArray(s.list)) continue;
                for (const g of s.list) {
                    cards.push(make(g, s.kind, s.tag(g)));
                }
            }
            const total = cards.length;
            const counter = total >= 2 ? `<div class="bc-gl-counter">${total}</div>` : '';
            $giftList.innerHTML = counter + cards.join('');
        }

        // ===== Heart shake state — track HP percentage, toggle low-hp class =====
        function updateLowHpShake(hp, maxHp) {
            if (!config?.display?.heartShakeLowHp) {
                document.body.classList.remove('bc-low-hp');
                return;
            }
            const pct = (hp / Math.max(1, maxHp)) * 100;
            document.body.classList.toggle('bc-low-hp', pct > 0 && pct < 30);
        }

        // ===== Combo display =====
        function updateCombo(count) {
            if (!config?.display?.comboEnabled) {
                $combo.classList.remove('show');
                return;
            }
            if (count >= 2) {
                $comboNum.textContent = 'x' + count;
                $combo.classList.add('show');
                $combo.classList.remove('pop');
                void $combo.offsetWidth;
                $combo.classList.add('pop');
            } else {
                $combo.classList.remove('show');
            }
        }

        // ===== Survival timer tick =====
        let _survivalTimer = null;
        function startSurvivalTimer(startedAt, record) {
            if (_survivalTimer) clearInterval(_survivalTimer);
            const update = () => {
                if (!startedAt) {
                    $survivalTime.textContent = '0:00';
                    return;
                }
                const sec = Math.floor((Date.now() - startedAt) / 1000);
                const mm = String(Math.floor(sec / 60)).padStart(2, '0');
                const ss = String(sec % 60).padStart(2, '0');
                $survivalTime.textContent = mm + ':' + ss;
                if (record > 0) {
                    const rmm = String(Math.floor(record / 60)).padStart(2, '0');
                    const rss = String(record % 60).padStart(2, '0');
                    $survivalRec.textContent = '🏆 ' + rmm + ':' + rss;
                }
            };
            update();
            _survivalTimer = setInterval(update, 1000);
        }

        // ===== Bow charge ring update =====
        function updateBowCharge(pct) {
            // Tích lực: cành + dây cung sáng dần (không còn vòng tròn quanh cung)
            if (config?.display?.bowChargeEnabled !== true) pct = 0;
            bowCtl?.setCharge(pct);
            $bow.classList.toggle('charge-full', pct >= 99);
        }

        // ===== Hit banners (critical / headshot / first blood) =====
        function showHitBanner(kind, x, y) {
            const el = document.createElement('div');
            el.className = 'bc-hit-banner ' + kind;
            el.textContent = kind === 'critical' ? '💥 CHÍ MẠNG x3!'
                            : kind === 'headshot' ? '🎯 HEADSHOT x2!'
                            : '🩸 FIRST BLOOD!';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            $arrowsLayer.appendChild(el);
            void el.offsetWidth;
            el.classList.add('show');
            setTimeout(() => el.remove(), 950);
        }

        // ===== Particle impact — feathers + sparks (throttled khi quá nhiều) =====
        const MAX_CONCURRENT_PARTICLES = 80;
        function spawnParticles(x, y) {
            if (config?.display?.showHitParticles === false) return;
            // Throttle: nếu đang có >MAX particles → giảm count, hoặc skip nếu quá đông
            const activeCount = $arrowsLayer.querySelectorAll('.bc-particle').length;
            if (activeCount >= MAX_CONCURRENT_PARTICLES) return;
            const budget = MAX_CONCURRENT_PARTICLES - activeCount;
            const count = Math.min(budget, 12 + Math.floor(Math.random() * 6));
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = i % 3 === 0 ? 'bc-particle feather' : 'bc-particle';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                $arrowsLayer.appendChild(p);
                const angle = Math.random() * Math.PI * 2;
                const speed = 80 + Math.random() * 140;
                const dx = Math.cos(angle) * speed;
                const dy = Math.sin(angle) * speed - 40;
                const rot = Math.random() * 720 - 360;
                p.animate([
                    { transform: `translate(-50%, -50%) translate(0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(-50%, -50%) translate(${dx}px, ${dy + 200}px) rotate(${rot}deg)`, opacity: 0 }
                ], { duration: 800 + Math.random() * 400, easing: 'cubic-bezier(0.2, 0.6, 0.4, 1)', fill: 'forwards' });
                setTimeout(() => p.remove(), 1300);
            }
        }

        // ===== Viewport shake on hit =====
        function viewportShake() {
            if (config?.display?.viewportShakeOnHit === false) return;
            document.body.classList.remove('bc-shake');
            void document.body.offsetWidth;
            document.body.classList.add('bc-shake');
            setTimeout(() => document.body.classList.remove('bc-shake'), 300);
        }

        // ===== Slo-mo on killing blow =====
        function triggerSlowMo() {
            if (config?.display?.slowMotionOnKill === false) return;
            document.body.classList.add('bc-slowmo');
            setTimeout(() => document.body.classList.remove('bc-slowmo'), 1450);
        }

        // ===== Killing-blow callout =====
        function showKillingBlow(user) {
            if (config?.display?.showKillingBlow !== true || !user) return;
            const $av = $killingBlow.querySelector('.bc-kb-avatar');
            const $nm = $killingBlow.querySelector('.bc-kb-name');
            if (user.avatar) {
                $av.outerHTML = `<img class="bc-kb-avatar" src="${escapeHtml(user.avatar)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'bc-kb-avatar'}))" />`;
            }
            if ($nm) $nm.textContent = user.nickname || user.uniqueId || 'Người bí ẩn';
            $killingBlow.classList.remove('show');
            void $killingBlow.offsetWidth;
            $killingBlow.classList.add('show');
            setTimeout(() => $killingBlow.classList.remove('show'), 3300);
        }

        // ===== Top-3 podium overlay =====
        function showPodium(data) {
            if (config?.display?.showPodium === false) return;
            const top3 = (data?.top3 || []).slice(0, 3);
            if (!top3.length) return;
            // Reorder: 2nd, 1st, 3rd for visual podium
            // Giữ hạng thật theo vị trí gốc — 1 người tặng duy nhất trước đây bị gắn 🥈 vì rơi vào slot 0.
            const ranked = top3.map((u, i) => ({ u, rank: i + 1 }));
            const order = [ranked[1], ranked[0], ranked[2]].filter(Boolean);
            $podiumRow.innerHTML = order.map(({ u, rank: realRank }) => {
                const medal = realRank === 1 ? '🥇' : realRank === 2 ? '🥈' : '🥉';
                const av = u.avatar
                    ? `<img class="bc-podium-avatar" src="${escapeHtml(u.avatar)}" onerror="this.style.visibility='hidden'" />`
                    : `<div class="bc-podium-avatar"></div>`;
                return `<div class="bc-podium-slot rank-${realRank}">
                    <div class="bc-podium-medal">${medal}</div>
                    ${av}
                    <div class="bc-podium-name">${escapeHtml(u.nickname || u.uniqueId)}</div>
                    <div class="bc-podium-dmg">−${(u.totalDamage || 0).toFixed(2)} ♥</div>
                    <div class="bc-podium-stage">${realRank}</div>
                </div>`;
            }).join('');
            const survSec = data?.survivalSec || 0;
            const recSec = data?.survivalRecordSec || 0;
            const survFmt = (s) => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
            $podiumSurv.innerHTML = `⏱ Sống sót <b>${survFmt(survSec)}</b>` +
                (recSec > 0 ? `<div class="bc-podium-record">🏆 Kỷ lục: ${survFmt(recSec)}</div>` : '');
            $podium.classList.remove('show');
            void $podium.offsetWidth;
            $podium.classList.add('show');
            setTimeout(() => $podium.classList.remove('show'), 6100);
        }

        // ===== Bow auto-aim: rotate widget so arrow visually points at impact zone =====
        // Tay cầm cung trên màn hình (điểm xoay) — đo trên khung chưa xoay nên không phụ thuộc góc đang ngắm.
        function bowPivot() {
            const r = $innerBow.getBoundingClientRect();
            return { x: r.left + r.width * (130 / 220), y: r.top + r.height * (100 / 200) };
        }
        // Cung ngắm vào đâu:
        //   đang kéo 1 phát (bám người) → đúng điểm trúng đã chọn cho phát đó (mũi tên bay đúng chỗ cung chĩa)
        //   nghỉ + thấy người            → MẶT người (tâm đầu), bám theo khi người di chuyển
        //   không bám người              → điểm trúng cấu hình (vòng 🎯 ĐIỂM TRÚNG)
        let bowAimTarget = null;          // { mark:{frame,a,b}, until } — điểm trúng của phát đang kéo
        let _aimAngle = null;
        function aimPoint(B) {
            if (trackWanted && trackingNow && bodyTrack) {
                B = B || bodyTrack.body();
                if (B && bowAimTarget && performance.now() < bowAimTarget.until) {
                    const p = bodyTrack.toStage(bowAimTarget.mark, B);
                    if (p) return p;
                }
                if (B?.head) return B.head.c;
                if (B) return B.center;
            }
            const r = $impact.getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        }
        function updateBowAim(B) {
            // Default ON unless explicitly disabled
            if (config?.display?.autoAimBow === false) {
                $bow.style.transform = ''; _aimAngle = null;
                return;
            }
            const pv = bowPivot(), t = aimPoint(B && B.torso ? B : null);
            // Arrow in default SVG points right (angle = 0). Compute angle from bow → target.
            const angle = Math.atan2(t.y - pv.y, t.x - pv.x);
            if (_aimAngle !== null && Math.abs(angle - _aimAngle) < 0.004) return;   // đổi < 0.2° thì khỏi ghi
            _aimAngle = angle;
            $bow.style.transform = `rotate(${angle}rad)`;
        }

        // ===== State render =====
        function applyState(s) {
            if (!s) return;
            state = s;
            document.body.classList.toggle('bc-stopped', s.sessionActive === false || s.enabled === false);
            _gameOff = s.enabled === false;
            updateHidden();
            renderHearts(s.hp || 0, s.maxHp || 10);
            updateLowHpShake(s.hp || 0, s.maxHp || 10);
            updateCombo(s.comboCount || 0);
            updateBowCharge(s.bowCharge || 0);
            startSurvivalTimer(s.sessionStartedAt || 0, s.survivalRecordSec || 0);
            // Death veil + countdown
            const wasDead = document.body.classList.contains('bc-dead');
            const isDead = (s.deadAt || 0) > 0;
            document.body.classList.toggle('bc-dead', isDead);
            if (isDead && !charDeadAt) charDeadAt = performance.now();
            else if (!isDead && charDeadAt) { charDeadAt = 0; charReviveAt = performance.now(); }
            // Shield badge
            const shielded = !!s.shielded;
            const row = document.getElementById('bc-hearts-row');
            row.classList.toggle('shielded', shielded);
            if (shielded && !row.querySelector('.bc-shield-badge')) {
                const b = document.createElement('div');
                b.className = 'bc-shield-badge';
                b.textContent = '🛡';
                row.style.position = 'relative';
                row.appendChild(b);
                // Bigger "GIÁP ACTIVE" pill below hearts
                const pill = document.createElement('div');
                pill.className = 'bc-shield-active';
                pill.id = 'bc-shield-pill';
                pill.innerHTML = '🛡 GIÁP BẤT TỬ';
                row.appendChild(pill);
            } else if (!shielded) {
                row.querySelector('.bc-shield-badge')?.remove();
                row.querySelector('.bc-shield-active')?.remove();
            } else if (shielded) {
                // Update countdown in pill if exists
                const pill = row.querySelector('.bc-shield-active');
                if (pill && s.shieldUntil) {
                    const secLeft = Math.max(0, Math.ceil((s.shieldUntil - Date.now()) / 1000));
                    pill.innerHTML = `🛡 GIÁP BẤT TỬ ${secLeft}s`;
                }
            }
            if (isDead) {
                startDeathCountdown(s.reviveWindowMsLeft);
            } else if (wasDead) {
                stopDeathCountdown();
            }
            // Top list
            renderTop(Array.isArray(s.top) ? s.top : []);
        }

        function startDeathCountdown(msLeft) {
            if (_deadCountdownTimer) { clearInterval(_deadCountdownTimer); _deadCountdownTimer = null; }
            const hint = document.querySelector('.bc-dead-hint');
            if (hint && !_deadCountdownTimer) {
                const win = Math.round(Number(config?.reviveWindowSec) || 5);
                const auto = config?.autoReviveAfterWindow !== false;
                hint.innerHTML = 'Tặng quà <b>Hồi sinh</b> trong ' + win + ' giây để cứu!' + (auto ? '<br><small>Không ai cứu thì tự hồi đầy máu</small>' : '');
            }
            const endAt = Date.now() + Math.max(0, msLeft || 0);
            const update = () => {
                const left = Math.max(0, endAt - Date.now());
                const sec = Math.ceil(left / 1000);
                $deathCountdown.textContent = sec;
                if (left <= 0) {
                    clearInterval(_deadCountdownTimer);
                    _deadCountdownTimer = null;
                }
            };
            update();
            _deadCountdownTimer = setInterval(update, 200);
        }
        function stopDeathCountdown() {
            if (_deadCountdownTimer) { clearInterval(_deadCountdownTimer); _deadCountdownTimer = null; }
        }

        function renderTop(list) {
            if (!list.length) {
                $topList.innerHTML = '<div style="text-align:center;color:#8b93a8;padding:6px 0;font-size:14px">Chưa có ai tham gia</div>';
                return;
            }
            $topList.innerHTML = list.slice(0, 5).map((u, i) => {
                const av = u.avatar
                    ? `<img class="bc-top-avatar" src="${u.avatar}" onerror="this.style.visibility='hidden'" />`
                    : `<div class="bc-top-avatar"></div>`;
                const nm = (u.nickname || u.uniqueId || 'unknown');
                return `<div class="bc-top-row rank-${i}">
                    <span class="bc-top-rank">#${i + 1}</span>
                    ${av}
                    <span class="bc-top-name">${escapeHtml(nm)}</span>
                    <span class="bc-top-dmg">−${(u.totalDamage || 0).toFixed(2)} ♥</span>
                </div>`;
            }).join('');
        }
        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // ===== Bow animation — charge then fire =====

        // ===== Spawn flying arrow — STRAIGHT LINE from bow → impact zone =====
        // Trajectory đi thẳng (không arc cong) → trông như mũi tên thật bay direct vào target.
        // - Khi hit (mặc định): arrow biến mất ngay tại impact + flash đỏ
        // - Khi blocked (có shield): arrow BAY XUYÊN target ra ngoài màn hình + shield ping
        const MAX_CONCURRENT_ARROWS = 12;   // chống spam → audio kẹt / lag main thread
        const MIN_FLIGHT_MS = 300;          // + 0.12ms/px quãng bay → ~400ms qua nửa khung 1080×1920
        const FLIGHT_EASE = 'cubic-bezier(0.25, 0.4, 0.6, 1)';   // rời cung là nhanh ngay, chậm rất nhẹ cuối
        const landingQueue = [];            // performance.now() lúc từng mũi tên (không bị chặn) chạm đích, theo thứ tự bắn
        function spawnFlyingArrow(durationMs, userInfo, opts) {
            opts = opts || {};
            const blocked = opts.blocked === true;
            // Throttle: nếu quá nhiều arrow đang bay → bỏ qua arrow mới (server damage vẫn fire)
            const active = $arrowsLayer.querySelectorAll('.bc-fly-arrow').length;
            if (active >= MAX_CONCURRENT_ARROWS) return;
            const impactRect = $impact.getBoundingClientRect();
            const st = bowCtl && document.body.classList.contains('no-bow') === false ? bowCtl.anchor() : bowPivot();
            const sx = st.x, sy = st.y;
            // Spread: % của viewport
            const spreadPct = Math.max(0, Math.min(30, Number(config?.display?.impactSpread) || 0));
            const spreadPx = (spreadPct / 100) * Math.min(window.innerWidth, window.innerHeight);
            // Thấy người → bắn vào thân/đầu thật; không thì về điểm trúng cấu hình như cũ.
            // Điểm trúng đã chọn từ lúc nhận lệnh bắn (cung đã ngắm vào đó trong lúc kéo) → tính lại theo tư thế HIỆN TẠI.
            let bodyTgt = null;
            if (trackWanted && bodyTrack && trackingNow) {
                const p = opts.mark ? bodyTrack.toStage(opts.mark) : null;
                bodyTgt = p ? { ...p, ...opts.mark } : bodyTrack.pickTarget(!!opts.headshot);
            }
            const tx = bodyTgt ? bodyTgt.x : impactRect.left + impactRect.width / 2 + (Math.random() * 2 - 1) * spreadPx;
            const ty = bodyTgt ? bodyTgt.y : impactRect.top + impactRect.height / 2 + (Math.random() * 2 - 1) * spreadPx;
            // Straight-line angle from source to target — arrow rotates to match trajectory
            const dx = tx - sx;
            const dy = ty - sy;
            const angle = Math.atan2(dy, dx);
            // For blocked arrows: extend trajectory just slightly past target (deflect look),
            // không bay quá xa khỏi màn hình — viewer vẫn thấy "trúng giáp" rõ ràng.
            let endX = tx, endY = ty;
            if (blocked) {
                const extra = 140;     // chỉ 140px past target — đủ "deflect" không lạc khỏi viewport
                endX = tx + Math.cos(angle) * extra;
                endY = ty + Math.sin(angle) * extra;
            }

            // Mặc định server để 200ms → trừ nhịp kéo dây còn ~120ms = mắt không kịp thấy mũi tên bay.
            // Ép tối thiểu theo quãng bay; hiệu ứng trúng (chớp đỏ/hạt) chờ mũi tên tới nơi (landingQueue).
            const flight = Math.max(durationMs, MIN_FLIGHT_MS + Math.hypot(dx, dy) * 0.12);
            const totalDur = blocked ? flight * 1.6 : flight;
            if (!blocked) landingQueue.push(performance.now() + totalDur * 0.92);

            const arrow = document.createElement('div');
            arrow.className = 'bc-fly-arrow';
            arrow.innerHTML = `
                <svg viewBox="0 0 140 34"><g transform="translate(10,17)">${ARROW_ART}</g></svg>
            `;
            $arrowsLayer.appendChild(arrow);

            // Arrow trail — long streak following the arrow tip
            let trail = null;
            if (config?.display?.showArrowTrail !== false) {
                trail = document.createElement('div');
                trail.className = 'bc-arrow-trail';
                const trailLen = Math.min(280, Math.hypot(dx, dy) * 0.85);
                trail.style.width = trailLen + 'px';
                trail.style.left = sx + 'px';
                trail.style.top = sy + 'px';
                trail.style.transform = `translate(-100%, -50%) rotate(${angle}rad)`;
                $arrowsLayer.appendChild(trail);
                // Move trail with arrow — use same animation timing
                try {
                    trail.animate([
                        { left: sx + 'px', top: sy + 'px', opacity: 0.9, easing: blocked ? 'linear' : FLIGHT_EASE },
                        { left: tx + 'px', top: ty + 'px', opacity: 0.9, offset: blocked ? 0.5 : 0.92 },
                        { left: (blocked ? endX : tx) + 'px', top: (blocked ? endY : ty) + 'px', opacity: 0 }
                    ], { duration: totalDur, easing: 'linear', fill: 'forwards' });
                } catch (e) {}
                setTimeout(() => trail?.remove(), totalDur + 200);
            }
            // Username tag flying with arrow
            if (config?.display?.showArrowUsername !== false && userInfo?.nickname) {
                const nameTag = document.createElement('div');
                nameTag.className = 'bc-arrow-username';
                nameTag.textContent = userInfo.nickname;
                nameTag.style.left = sx + 'px';
                nameTag.style.top = sy + 'px';
                $arrowsLayer.appendChild(nameTag);
                try {
                    nameTag.animate([
                        { left: sx + 'px', top: sy + 'px', opacity: 0 },
                        { left: sx + 'px', top: sy + 'px', opacity: 1, offset: 0.1 },
                        { left: tx + 'px', top: ty + 'px', opacity: 1, offset: blocked ? 0.5 : 0.85 },
                        { left: (blocked ? endX : tx) + 'px', top: (blocked ? endY : ty) + 'px', opacity: 0 }
                    ], { duration: totalDur, easing: 'linear', fill: 'forwards' });
                } catch (e) {}
                setTimeout(() => nameTag.remove(), totalDur + 200);
            }

            // Khi blocked: arrow tới target ở offset 0.5 → tiếp tục bay qua tới endX/endY ở offset 1
            // Khi hit: arrow tới target ở offset 0.92 → biến mất ngay tại đó (opacity 1→0)
            try {
                if (blocked) {
                    arrow.animate([
                        { left: sx + 'px', top: sy + 'px', transform: `translate(-50%,-50%) rotate(${angle}rad)`, opacity: 1, offset: 0 },
                        { left: tx + 'px', top: ty + 'px', transform: `translate(-50%,-50%) rotate(${angle}rad)`, opacity: 1, offset: 0.5 },
                        { left: endX + 'px', top: endY + 'px', transform: `translate(-50%,-50%) rotate(${angle}rad)`, opacity: 0, offset: 1 }
                    ], { duration: totalDur, easing: 'linear', fill: 'forwards' });
                    // Spawn shield ping at impact moment (when arrow reaches target)
                    setTimeout(() => spawnShieldPing(tx, ty), totalDur * 0.5);
                } else {
                    setTimeout(() => {
                        lastHitPt = { x: tx, y: ty, at: performance.now() };
                        const B = bodyTgt ? bodyTrack?.body() : null;
                        // Mất người đúng lúc chạm → vẫn găm tại chỗ (đứng yên) thay vì biến mất.
                        landOnBody(tx, ty, bodyTgt?.frame, bodyTgt ? { frame: bodyTgt.frame, a: bodyTgt.a, b: bodyTgt.b } : null, angle, B || null);
                    }, totalDur * 0.92);
                    // Mũi tên vẽ có mũi nhọn ở ĐẦU khung → dời tâm khung lùi nửa thân để mũi nhọn (không phải giữa thân) chạm đích.
                    const back = 61, bx = Math.cos(angle) * back, by = Math.sin(angle) * back;
                    // Bay gần như đều (thoát cung là nhanh ngay, không "ì" ở đầu); tới nơi thì tắt nhanh — mũi tên cắm thay chỗ.
                    arrow.animate([
                        { left: (sx - bx) + 'px', top: (sy - by) + 'px', transform: `translate(-50%,-50%) rotate(${angle}rad)`, opacity: 1, offset: 0, easing: FLIGHT_EASE },
                        { left: (tx - bx) + 'px', top: (ty - by) + 'px', transform: `translate(-50%,-50%) rotate(${angle}rad)`, opacity: 1, offset: 0.92 },
                        { left: (tx - bx) + 'px', top: (ty - by) + 'px', transform: `translate(-50%,-50%) rotate(${angle}rad)`, opacity: 0, offset: 0.96 },
                        { left: (tx - bx) + 'px', top: (ty - by) + 'px', transform: `translate(-50%,-50%) rotate(${angle}rad)`, opacity: 0, offset: 1 }
                    ], { duration: totalDur, easing: 'linear', fill: 'forwards' });   // easing theo đoạn → tới đích đúng mốc 0.92 thời gian
                }
            } catch (e) {
                // Fallback: CSS transition
                arrow.style.left = sx + 'px';
                arrow.style.top = sy + 'px';
                arrow.style.transform = `translate(-50%,-50%) rotate(${angle}rad)`;
                arrow.style.transition = `left ${totalDur}ms linear, top ${totalDur}ms linear, opacity 200ms ease-in ${totalDur - 100}ms`;
                requestAnimationFrame(() => {
                    arrow.style.left = (blocked ? endX : tx) + 'px';
                    arrow.style.top = (blocked ? endY : ty) + 'px';
                    arrow.style.opacity = '0';
                });
            }

            if (userInfo && config?.display?.showShooterName !== false && userInfo.nickname) {
                setTimeout(() => spawnShooterPopup(userInfo, sx, sy), durationMs * 0.4);
            }
            setTimeout(() => arrow.remove(), totalDur + 250);
        }

        // Shield deflect visual ping at impact point
        function spawnShieldPing(x, y) {
            const ping = document.createElement('div');
            ping.className = 'bc-shield-ping';
            ping.style.left = x + 'px';
            ping.style.top = y + 'px';
            $arrowsLayer.appendChild(ping);
            const txt = document.createElement('div');
            txt.className = 'bc-shield-text';
            txt.textContent = '🛡 CHẶN!';
            txt.style.left = x + 'px';
            txt.style.top = y + 'px';
            $arrowsLayer.appendChild(txt);
            setTimeout(() => { ping.remove(); txt.remove(); }, 900);
        }

        function spawnShooterPopup(user, x, y) {
            const el = document.createElement('div');
            el.className = 'bc-shooter-pop';
            const dmg = (config?.damagePerShot ?? 0.25);
            const dmgPart = config?.display?.showDamageText !== false ? `<span class="dmg">−${dmg.toFixed(2)} ♥</span>` : '';
            el.innerHTML = `🏹 <span class="nick">${escapeHtml(user.nickname || user.uniqueId)}</span>${dmgPart}`;
            // Position above bow
            el.style.left = (x) + 'px';
            el.style.top = (y - 40) + 'px';
            $arrowsLayer.appendChild(el);
            setTimeout(() => el.remove(), 1600);
        }

        function flashRed() {
            $redflash.classList.remove('flash');
            void $redflash.offsetWidth;
            $redflash.classList.add('flash');
        }

        // kind: 'heal' | 'shield' | 'revive' — key: khoá bật/tắt trong display (mặc định bật, riêng hồi sinh tắt)
        const BANNER_DEFAULT = { bannerAutoburst: true, bannerRevive: false, bannerHeal: true, bannerShield: true };
        function showBanner(kind, mainText, subText, key) {
            const d = config?.display || {};
            if (key && (d[key] ?? BANNER_DEFAULT[key]) === false) return;
            $banner.style.setProperty('--banner-scale', ((Number(d.bannerScale) || 50) / 100).toFixed(2));
            $banner.className = 'bc-banner ' + kind;
            $banner.innerHTML = escapeHtml(mainText) + (subText ? `<span class="bc-banner-sub">${escapeHtml(subText)}</span>` : '');
            void $banner.offsetWidth;
            $banner.classList.add('show');
            setTimeout(() => $banner.classList.remove('show'), 2200);
        }

        // ===== Socket =====
        const socket = io({ transports: ['websocket', 'polling'] });
        // Module body-track.mjs (ESM, nạp sau script này) tạo tracker rồi gọi ready().
        window.__bcTrackHost = {
            socket,
            onStatus: (t, lv) => { if (lv === 'error') console.warn('[bancung-track]', t); },
            ready: (t) => { bodyTrack = t; bodyTrack.maskSmooth = config?.display?.maskSmooth !== false; bodyTrack.setEnabled(trackWanted); }
        };
        socket.on('connect', () => {
            socket.emit('subscribe', 'overlay');
            fetch('/api/games/bancung/livestate').then(r => r.json()).then(s => applyState(s)).catch(() => {});
            fetch('/api/games/bancung/config').then(r => r.json()).then(cfg => applyConfig(cfg)).catch(() => {});
        });
        socket.on('bancung:state', applyState);
        socket.on('bancung:shot', (d) => {
            if (!frameOn()) return;
            const dur = Number(d.arrowDurationMs) || 700;
            // Chỉ GIÁP mới làm mũi tên bay xuyên; đã gục thì vẫn găm (server bản cũ không gửi shielded → theo blocked).
            const opts = { blocked: d.shielded !== undefined ? !!d.shielded : !!d.blocked };
            const drawMs = Math.max(50, Math.min(110, dur * 0.4));
            // Bám người: chọn điểm trúng NGAY bây giờ để cung xoay về đó trong lúc kéo dây.
            if (trackWanted && bodyTrack && trackingNow && !opts.blocked) {
                const tgt = bodyTrack.pickTarget(false);
                if (tgt) {
                    opts.mark = { frame: tgt.frame, a: tgt.a, b: tgt.b };
                    bowAimTarget = { mark: opts.mark, until: performance.now() + drawMs + 350 };
                    updateBowAim();
                }
            }
            if (bowCtl && config?.display?.showBowWidget !== false) {
                bowCtl.shoot(lead => spawnFlyingArrow(Math.max(90, dur - lead), d.user || null, opts), drawMs);
            } else spawnFlyingArrow(dur, d.user || null, opts);
        });
        socket.on('bancung:hit', (d) => {
            if (!frameOn()) return;
            // Mũi tên bay lâu hơn nhịp server (MIN_FLIGHT_MS) → đợi đúng lúc mũi tên tương ứng chạm đích rồi mới chớp/nổ hạt.
            const now = performance.now();
            while (landingQueue.length && landingQueue[0] < now - 1500) landingQueue.shift();   // mũi tên đã bị bỏ/lạc nhịp
            const wait = landingQueue.length ? Math.max(0, landingQueue.shift() - now) : 0;
            if (wait > 16) setTimeout(() => onHit(d), Math.min(wait, 1500)); else onHit(d);
        });
        function onHit(d) {
            // Đang bám được người → chớp đỏ theo hình cơ thể, KHÔNG chớp toàn màn (phần ngoài người không liên quan).
            if (trackWanted && trackingNow && config?.display?.bodyFlash !== false) bodyFlashAt = performance.now();
            else flashRed();
            viewportShake();
            // Slo-mo on killing blow first (so subsequent visuals also slow)
            if (d.killingBlow) triggerSlowMo();
            // Particle impact + critical/headshot banners — tại chỗ mũi tên vừa chạm người, không thì điểm trúng
            const impRect = $impact.getBoundingClientRect();
            const fresh = lastHitPt && performance.now() - lastHitPt.at < 1500 ? lastHitPt : null;
            const cx = fresh ? fresh.x : impRect.left + impRect.width / 2;
            const cy = fresh ? fresh.y : impRect.top + impRect.height / 2;
            spawnParticles(cx, cy);
            if (d.firstBlood) showHitBanner('firstblood', cx, cy);
            if (d.critical)  showHitBanner('critical', cx, cy);
            if (d.headshot)  showHitBanner('headshot', cx, cy);
            // Killing-blow callout (after small delay so slo-mo is in effect)
            if (d.killingBlow && d.user) {
                setTimeout(() => showKillingBlow(d.user), 600);
            }
            // Damage popup near hearts
            if (config?.display?.showDamageText !== false && d.damage) {
                const rect = $heartsRow.getBoundingClientRect();
                const el = document.createElement('div');
                el.className = 'bc-shooter-pop';
                const critTag = d.critical ? ' <b style="color:#ffd54a">CHÍ MẠNG</b>' : '';
                el.innerHTML = `<span class="dmg">−${d.damage.toFixed(2)} ♥</span>${critTag}`;
                el.style.left = (rect.left + rect.width / 2) + 'px';
                el.style.top = (rect.bottom + 6) + 'px';
                $arrowsLayer.appendChild(el);
                setTimeout(() => el.remove(), 1600);
            }
        }
        socket.on('bancung:podium', (d) => showPodium(d));
        socket.on('bancung:charge', (d) => updateBowCharge(d.value || 0));
        socket.on('bancung:autoburst', (d) => {
            // Show banner that auto-burst is firing
            showBanner('shield', `⚡ AUTO BURST ${d.count}!`, 'Cung nạp đầy năng lượng', 'bannerAutoburst');
        });
        socket.on('bancung:blocked', () => {
            // Visual already handled via bancung:shot { blocked:true } → fly-through + ping.
            // This event still fires server-side for analytics/logging consistency.
        });
        socket.on('bancung:death', (d) => {
            // Killing-blow callout fires from bancung:hit (which sets killingBlow flag)
            // Show podium briefly on death too (in addition to session stop)
            if (d?.podium?.length && config?.display?.showPodium !== false) {
                setTimeout(() => showPodium({
                    top3: d.podium,
                    survivalSec: d.survivalSec || 0,
                    survivalRecordSec: d.survivalRecordSec || 0
                }), 1500);
            }
        });
        socket.on('bancung:revive', (d) => {
            const who = d.user?.nickname || (d.auto ? 'TỰ HỒI SINH' : '?');
            showBanner('revive', '✨ HỒI SINH!', d.auto ? '(Tự động)' : ('Cứu tinh: ' + who), 'bannerRevive');
        });
        socket.on('bancung:heal', (d) => {
            const who = d.user?.nickname || '';
            showBanner('heal', `+${(d.hearts || 0).toFixed(1)} ❤`, who ? ('Cảm ơn ' + who) : 'Hồi máu', 'bannerHeal');
        });
        socket.on('bancung:shield', (d) => {
            const who = d.user?.nickname || '';
            showBanner('shield', `🛡 BẤT TỬ ${d.durationSec}s`, who ? ('từ ' + who) : '', 'bannerShield');
        });
        socket.on('gameConfig', ({ gameId, config: cfg }) => {
            if (gameId !== 'bancung') return;
            applyConfig(cfg);
        });
        socket.on('gameDisabled', ({ gameId }) => {
            if (gameId !== 'bancung') return;
            document.body.classList.add('bc-stopped');
            _gameOff = true;
            updateHidden();
        });
        socket.on('gameEnabled', ({ gameId }) => { if (gameId === 'bancung') { _gameOff = false; updateHidden(); } });
        // Đóng app → socket rớt → ẩn sau 1.5s (chớp mạng ngắn không nháy); nối lại thì hiện theo trạng thái game.
        // Chỉ ẩn khi mất kết nối hoặc game bị TẮT — chưa bấm ▶ Bắt đầu thì vẫn hiện tim + cung như cũ.
        let _offlineTimer = 0, _offline = false, _gameOff = false;
        // + khung bị overlay mẹ (🎥 Game Camera) ẩn / nạp sẵn → HpCamFrame.active = false (cam-frame-guard.js câm âm thanh).
        function updateHidden() { document.body.classList.toggle('bc-hide', _offline || _gameOff || state?.enabled === false || !frameOn()); }
        socket.on('disconnect', () => {
            clearTimeout(_offlineTimer);
            _offlineTimer = setTimeout(() => { _offline = true; window.HpCamFrame?.setOnline(false); updateHidden(); }, 1500);
        });
        socket.on('connect', () => { clearTimeout(_offlineTimer); _offline = false; window.HpCamFrame?.setOnline(true); updateHidden(); });
        window.HpCamFrame?.onChange(() => updateHidden());
        socket.on('overlay:reload', (data) => {
            // Filter by gameId nếu có — chỉ reload nếu match hoặc broadcast chung
            if (!data || !data.gameId || data.gameId === 'bancung') location.reload();
        });

        // ===== EDIT MODE — drag/zoom both stages + drag impact zone + gift list =====
        if (isEdit) {
            setupEditDrag($stageHearts, 'heartsXPercent', 'heartsYPercent', 'heartsScale');
            setupEditDrag($stageBow, 'bowXPercent', 'bowYPercent', 'bowScale');
            setupEditDrag($impact, 'impactXPercent', 'impactYPercent', null);
            setupEditDrag($giftList, 'giftListXPercent', 'giftListYPercent', 'giftListScale');
        }
        function setupEditDrag(stage, xKey, yKey, scaleKey) {
            let dragging = null;
            stage.addEventListener('mousedown', (e) => {
                dragging = {
                    sx: e.clientX, sy: e.clientY,
                    origX: parseFloat(stage.style.left) || 50,
                    origY: parseFloat(stage.style.top) || 50
                };
                e.preventDefault();
            });
            window.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                const dx = (e.clientX - dragging.sx) / window.innerWidth * 100;
                const dy = (e.clientY - dragging.sy) / window.innerHeight * 100;
                const nx = Math.max(0, Math.min(100, dragging.origX + dx));
                const ny = Math.max(0, Math.min(100, dragging.origY + dy));
                stage.style.left = nx + '%';
                stage.style.top = ny + '%';
                if (config) {
                    config.display = config.display || {};
                    config.display[xKey] = nx;
                    config.display[yKey] = ny;
                    // Re-aim bow when bow or impact moves
                    updateBowAim();
                }
            });
            window.addEventListener('mouseup', async () => {
                if (!dragging) return;
                dragging = null;
                try {
                    await fetch('/api/games/bancung/config', {
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Source': 'popout' },
                        body: JSON.stringify(config)
                    });
                } catch (e) {}
            });
            if (scaleKey) {
                stage.addEventListener('wheel', async (e) => {
                    e.preventDefault();
                    const cur = parseFloat((config?.display?.[scaleKey]) || 100);
                    const next = Math.max(30, Math.min(250, cur + (e.deltaY < 0 ? 5 : -5)));
                    config.display = config.display || {};
                    config.display[scaleKey] = next;
                    // Hearts/bow use inner element; gift list scales itself directly
                    const inner = stage.querySelector('.bc-hearts-inner, .bc-bow-inner');
                    if (inner) inner.style.transform = 'scale(' + (next / 100) + ')';
                    else stage.style.transform = 'scale(' + (next / 100) + ')';
                    clearTimeout(stage._wheelSaveT);
                    stage._wheelSaveT = setTimeout(async () => {
                        try {
                            await fetch('/api/games/bancung/config', {
                                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Source': 'popout' },
                                body: JSON.stringify(config)
                            });
                        } catch (e) {}
                    }, 350);
                }, { passive: false });
            }
        }
        // Re-aim bow on window resize too
        window.addEventListener('resize', () => requestAnimationFrame(updateBowAim));
    })();
    </script>
    <script type="module">
        // Bám theo người: chỉ nạp module (MediaPipe chỉ tải khi cấu hình bật — setEnabled(true)).
        import { BcBodyTrack } from '/games/bancung/body-track.mjs';
        const host = window.__bcTrackHost;
        if (host) {
            const t = new BcBodyTrack({ socket: host.socket, width: window.innerWidth, height: window.innerHeight, onStatus: host.onStatus });
            window.__bcBodyTrack = t;     // để soi/thử trong DevTools (pushFrame ảnh mẫu…)
            host.ready(t);
        }
    </script>
</body>
