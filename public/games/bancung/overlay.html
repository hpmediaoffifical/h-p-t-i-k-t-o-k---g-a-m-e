<!doctype html>
<html lang="vi">
<head>
<script src="/games/camgames/cam-frame-guard.js"></script><!-- 🔇 khung ẩn / mất kết nối app thì câm + ngưng (nạp trước mọi script) -->
    <script src="/lib/overlay-resolution.js"></script>
<meta charset="utf-8" />
<title>HP Bắn Cung — Overlay</title>
<style>
    /* OBS browser source: 1080×1920 transparent. Mọi positioning là % của khung này. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%; height: 100%;
        background: transparent;
        font-family: 'Segoe UI', Arial, sans-serif;
        overflow: hidden;
        color: #fff;
        user-select: none;
    }
    body {
        --bow-color: #8b5a2b;
        --string-color: #f0e8d0;
        --arrow-color: #a0794a;
        --skin-glow: transparent;
        --flash-strength: 0.6;
        --death-opacity: 0.75;
    }

    /* Màu VẾT MÁU chỗ mũi tên găm (kiểu PUBG) — JS đặt theo display.bloodColor: lõi sẫm / giữa / nhạt (r,g,b).
       Chớp đỏ trên người / chớp màn giữ màu đỏ. */
    body { --blood-core: 120,0,0; --blood-mid: 165,8,8; --blood-lite: 190,15,15; }
    /* 👁 VÙNG THẤY (Scene PK / Colab cắt ô khung cam — createCamView (/lib/obs-scene-map.mjs) đặt --cv-t/r/b/l = khoảng lùi px so với mép trang):
       chữ / bảng / HUD gắn mép bám vùng này. Thiếu biến = 0 = cả khung như cũ. --cv-w / --cv-h = cỡ vùng thấy. */
    :root { --cv-w: calc(100vw - var(--cv-l, 0px) - var(--cv-r, 0px)); --cv-h: calc(100vh - var(--cv-t, 0px) - var(--cv-b, 0px)); }

    /* ===== EFFECT LAYERS — bao toàn khung ===== */
    /* Red flash on hit */
    .bc-redflash {
        position: fixed; inset: 0;
        background: radial-gradient(ellipse at center, rgba(255,40,40,0.55), rgba(180,0,0,0.85) 80%);
        pointer-events: none;
        opacity: 0;
        z-index: 40;
        mix-blend-mode: screen;
    }
    .bc-redflash.flash {
        animation: bc-redflash-anim 900ms ease-out;
    }
    @keyframes bc-redflash-anim {
        0%   { opacity: 0; }
        10%  { opacity: var(--flash-strength); }
        35%  { opacity: calc(var(--flash-strength) * 0.85); }
        70%  { opacity: calc(var(--flash-strength) * 0.35); }
        100% { opacity: 0; }
    }

    /* Death dim overlay — fade in slow */
    .bc-deathveil {
        position: fixed; top: var(--cv-t, 0px); right: var(--cv-r, 0px); bottom: var(--cv-b, 0px); left: var(--cv-l, 0px);
        background: rgba(0,0,0,0);
        pointer-events: none;
        z-index: 45;
        transition: background 800ms ease;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
    }
    body.bc-dead .bc-deathveil {
        background: rgba(0,0,0, var(--death-opacity));
    }
    .bc-dead-label {
        font-size: 90px;
        font-weight: 900;
        color: #ff3a3a;
        letter-spacing: 8px;
        text-shadow: 0 4px 0 #5e0000, 0 0 30px rgba(255,40,40,0.7);
        opacity: 0;
        transform: scale(0.5);
        transition: opacity 400ms ease, transform 400ms ease;
    }
    .bc-dead-countdown {
        margin-top: 20px;
        font-size: 60px;
        font-weight: 900;
        color: #ffd54a;
        text-shadow: 0 2px 0 #4a3000, 0 0 18px rgba(255,213,74,0.7);
        opacity: 0;
        font-variant-numeric: tabular-nums;
        transition: opacity 400ms ease 200ms;
    }
    .bc-dead-hint {
        margin-top: 20px;
        font-size: 28px;
        color: #fff;
        opacity: 0;
        text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        transition: opacity 400ms ease 400ms;
    }
    body.bc-dead .bc-dead-label,
    body.bc-dead .bc-dead-countdown,
    body.bc-dead .bc-dead-hint {
        opacity: 1;
        transform: scale(1);
    }

    /* ===== HEARTS ROW ===== */
    .bc-hearts-stage {
        position: fixed;
        left: 50%; top: 14%;
        transform: translate(-50%, -50%);
        z-index: 20;
        pointer-events: none;
        transition: left 250ms ease, top 250ms ease;
    }
    .bc-hearts-inner {
        transform-origin: center center;
        transition: transform 250ms ease;
        display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .bc-hearts-row {
        display: flex; gap: 8px;
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
    }
    .bc-heart {
        width: 64px; height: 64px;
        position: relative;
        background-size: contain; background-repeat: no-repeat; background-position: center;
        filter:
            drop-shadow(0 0 3px rgba(0,0,0,0.85))
            drop-shadow(0 3px 6px rgba(0,0,0,0.7));
    }
    /* Heart styles — chubby plump variants, no thin outlines */
    /* Pixel: classic 8-bit Zelda heart but with wider body for visibility */
    body.bc-heart-pixel .bc-heart {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 13' shape-rendering='crispEdges'><path d='M1 3h2v1h1v1h1v1h1v1h1v-1h1v-1h1v-1h1v-1h2v1h1v4h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-1v-1h-1v-1h-1v-1h-1v-1h-1v-1h-1v-1h-1v-4h1z' fill='%23ff2842'/><path d='M1 3h1v1h-1zM2 3h1v1h-1v-1zM12 3h1v1h-1zM3 4h1v1h-1zM4 5h1v1h-1z' fill='%23ff7088'/></svg>");
    }
    /* Glossy: chubby rounded heart with strong highlight, no stroke */
    body.bc-heart-glossy .bc-heart {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 34'><defs><radialGradient id='g' cx='35%25' cy='28%25' r='80%25'><stop offset='0' stop-color='%23ffb8c8'/><stop offset='0.45' stop-color='%23ff2c5a'/><stop offset='1' stop-color='%237a0820'/></radialGradient></defs><path d='M18 32 C18 32 2 22 2 12 C2 6 6 2 10.5 2 C14 2 16.5 4 18 7 C19.5 4 22 2 25.5 2 C30 2 34 6 34 12 C34 22 18 32 18 32 Z' fill='url(%23g)'/><ellipse cx='12.5' cy='10' rx='4' ry='2.6' fill='white' opacity='0.7'/><ellipse cx='23' cy='8' rx='1.8' ry='1.2' fill='white' opacity='0.5'/></svg>");
    }
    /* Fire: warm gradient, plump no stroke */
    body.bc-heart-fire .bc-heart {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 34'><defs><radialGradient id='f' cx='50%25' cy='55%25' r='75%25'><stop offset='0' stop-color='%23fff09a'/><stop offset='0.35' stop-color='%23ff6e2e'/><stop offset='1' stop-color='%23801010'/></radialGradient></defs><path d='M18 32 C18 32 2 22 2 12 C2 6 6 2 10.5 2 C14 2 16.5 4 18 7 C19.5 4 22 2 25.5 2 C30 2 34 6 34 12 C34 22 18 32 18 32 Z' fill='url(%23f)'/><ellipse cx='12' cy='10' rx='3.6' ry='2.4' fill='%23fffbe0' opacity='0.65'/></svg>");
    }
    /* Crystal: gem-like with two facets, plump */
    body.bc-heart-crystal .bc-heart {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 34'><defs><linearGradient id='c' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0' stop-color='%23c8f4ff'/><stop offset='0.5' stop-color='%2325f4ee'/><stop offset='1' stop-color='%2310738c'/></linearGradient></defs><path d='M18 32 C18 32 2 22 2 12 C2 6 6 2 10.5 2 C14 2 16.5 4 18 7 C19.5 4 22 2 25.5 2 C30 2 34 6 34 12 C34 22 18 32 18 32 Z' fill='url(%23c)'/><path d='M10 6 L13 12 L8 14 Z' fill='white' opacity='0.7'/><path d='M25 5 L27 8 L24 10 Z' fill='white' opacity='0.45'/></svg>");
    }
    /* Half heart — fade right half via mask so background shows through */
    .bc-heart.half {
        -webkit-mask-image: linear-gradient(90deg, #000 0 50%, transparent 50% 100%);
                mask-image: linear-gradient(90deg, #000 0 50%, transparent 50% 100%);
    }
    .bc-heart.empty {
        opacity: 0.35;
        filter: grayscale(1) brightness(0.45)
                drop-shadow(0 0 3px rgba(0,0,0,0.85))
                drop-shadow(0 3px 6px rgba(0,0,0,0.7));
    }
    .bc-heart.recently-lost {
        animation: bc-heart-pop 600ms ease-out;
    }
    @keyframes bc-heart-pop {
        0%   { transform: scale(1.4); filter: drop-shadow(0 0 12px #ff5050) brightness(1.4); }
        100% { transform: scale(1); }
    }
    .bc-hearts-num {
        font-size: 22px;
        font-weight: 900;
        color: #fff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        background: rgba(0,0,0,0.45);
        padding: 4px 14px;
        border-radius: 12px;
        font-variant-numeric: tabular-nums;
    }
    .bc-hearts-num .ratio { color: #ff8e8e; }
    /* Shield glow around hearts when shielded */
    .bc-hearts-row.shielded {
        border-color: #25f4ee;
        box-shadow: 0 0 30px rgba(37,244,238,0.85), 0 4px 16px rgba(0,0,0,0.45);
        animation: bc-shield-pulse 1.4s ease-in-out infinite alternate;
    }
    @keyframes bc-shield-pulse {
        0%   { box-shadow: 0 0 18px rgba(37,244,238,0.6), 0 4px 16px rgba(0,0,0,0.45); }
        100% { box-shadow: 0 0 36px rgba(37,244,238,1), 0 4px 16px rgba(0,0,0,0.45); }
    }
    .bc-shield-badge {
        position: absolute;
        top: -16px; right: -10px;
        font-size: 26px;
        animation: bc-shield-bob 1s ease-in-out infinite alternate;
        filter: drop-shadow(0 0 6px #25f4ee);
    }
    @keyframes bc-shield-bob {
        0%   { transform: translateY(0) rotate(-10deg); }
        100% { transform: translateY(-4px) rotate(10deg); }
    }

    /* ===== BOW WIDGET ===== */
    .bc-bow-stage {
        position: fixed;
        left: 85%; top: 80%;
        transform: translate(-50%, -50%);
        z-index: 25;
        pointer-events: none;
        transition: left 250ms ease, top 250ms ease;
    }
    .bc-bow-inner {
        transform-origin: center center;
        transition: transform 250ms ease;
    }
    .bc-bow {
        position: relative;
        width: 220px; height: 200px;
        --bow-charge: 0;
        /* bóng đổ cho cung nổi trên mọi nền camera */
        filter: drop-shadow(0 0 3px rgba(0,0,0,0.9)) drop-shadow(0 5px 10px rgba(0,0,0,0.45));
        /* xoay quanh TAY CẦM (x=120 trong viewBox 200, svg lệch 10px trong khung 220) */
        transform-origin: 130px 100px;
        transition: transform 300ms cubic-bezier(0.4, 0, 0.3, 1);
    }
    body.bc-tracking .bc-bow { transition: transform 120ms linear; }
    .bc-bow svg { width: 100%; height: 100%; overflow: visible; }
    .bw-limb {
        fill: url(#bw-limb);
        stroke: rgba(0,0,0,0.55);
        stroke-width: 0.8;
        stroke-linejoin: round;
        /* tích lực: cành sáng dần theo --bow-charge */
        filter: drop-shadow(0 0 calc(2px + 10px * var(--bow-charge)) var(--skin-glow, transparent));
    }
    .bw-limb-hi {                       /* vệt sáng dọc cành cho có khối */
        fill: none;
        stroke: rgba(255,255,255,0.28);
        stroke-width: 0.9;
        transform: translate(-1px, 0);
    }
    .bw-riser { fill: var(--bow-color); stroke: rgba(0,0,0,0.6); stroke-width: 1; }
    .bw-grip { fill: rgba(20,14,10,0.82); stroke: rgba(0,0,0,0.6); stroke-width: 0.6; }
    .bw-grip-wrap { stroke: rgba(255,255,255,0.16); stroke-width: 1; fill: none; }
    .bw-rest { fill: var(--string-color); opacity: 0.9; }
    .bw-nockpt { fill: var(--string-color); stroke: rgba(0,0,0,0.5); stroke-width: 0.5; }
    .bw-string {
        fill: none;
        stroke: var(--string-color);
        stroke-width: 1.4;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 calc(1px + 6px * var(--bow-charge)) var(--skin-glow, transparent));
    }
    .bc-bow.charge-full .bw-string,
    .bc-bow.charge-full .bw-limb { animation: bw-charge-pulse 0.7s ease-in-out infinite alternate; }
    @keyframes bw-charge-pulse { from { opacity: 0.85; } to { opacity: 1; } }
    .bw-arrow { will-change: transform, opacity; }
    /* Mũi tên — dùng chung cho tên trên cung / đang bay / cắm trên người */
    .bw-arrow .shaft, .bc-fly-arrow .shaft, .bc-stuck-arrow .shaft { stroke: var(--arrow-color); stroke-width: 2.6; stroke-linecap: round; fill: none; }
    .bw-arrow .head, .bc-fly-arrow .head, .bc-stuck-arrow .head { fill: var(--arrow-color); stroke: rgba(0,0,0,0.45); stroke-width: 0.6; stroke-linejoin: round; }
    .bw-arrow .head-hi, .bc-fly-arrow .head-hi, .bc-stuck-arrow .head-hi { stroke: rgba(255,255,255,0.6); stroke-width: 0.9; fill: none; }
    .bw-arrow .fletch, .bc-fly-arrow .fletch, .bc-stuck-arrow .fletch { fill: var(--string-color); stroke: rgba(0,0,0,0.35); stroke-width: 0.5; }
    .bw-arrow .nock, .bc-fly-arrow .nock, .bc-stuck-arrow .nock { fill: var(--string-color); stroke: rgba(0,0,0,0.5); stroke-width: 0.5; }
    /* Skin name label removed — was confusing when bow rotates */

    /* ===== FLYING ARROWS LAYER ===== */
    .bc-arrows-layer {
        position: fixed; inset: 0;
        pointer-events: none;
        z-index: 42;      /* TRÊN lớp tô đỏ thân người (40) / cháy đen (38) — trước đây 30 nên mũi tên + vết máu bị phủ đỏ lẫn mất */
    }
    .bc-fly-arrow {
        position: absolute;
        transform-origin: center center;
        will-change: transform, left, top;
        filter: drop-shadow(0 0 8px var(--skin-glow, transparent));
    }
    .bc-fly-arrow svg {
        width: 140px; height: 34px;
        overflow: visible;
    }
    .bc-fly-arrow .shaft {
        stroke: var(--arrow-color);
        stroke-width: 4;
        fill: var(--arrow-color);
    }
    .bc-fly-arrow .head { fill: var(--arrow-color); stroke: var(--arrow-color); stroke-width: 1.5; }
    .bc-fly-arrow .fletch { fill: var(--string-color); }
    .bc-fly-trail {
        position: absolute;
        height: 4px;
        background: linear-gradient(90deg, transparent, var(--skin-glow, rgba(255,255,255,0.6)) 80%);
        border-radius: 2px;
        opacity: 0.7;
        transform-origin: left center;
        pointer-events: none;
    }

    /* ===== ARROW TRAIL — long streak behind flying arrow ===== */
    .bc-arrow-trail {
        position: absolute;
        height: 5px;
        background: linear-gradient(90deg, transparent, var(--skin-glow, rgba(255,255,255,0.85)));
        border-radius: 3px;
        transform-origin: right center;
        opacity: 0.9;
        pointer-events: none;
        filter: blur(1px);
        box-shadow: 0 0 8px var(--skin-glow, rgba(255,255,255,0.5));
    }

    /* ===== ARROW USERNAME — flies behind arrow ===== */
    .bc-arrow-username {
        position: absolute;
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 8px var(--skin-glow, transparent);
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        background: rgba(0,0,0,0.55);
        padding: 2px 8px;
        border-radius: 8px;
        transform: translate(-50%, -50%);
    }

    /* ===== PARTICLE IMPACT — feathers/dust on hit ===== */
    .bc-particle {
        position: absolute;
        width: 6px; height: 6px;
        background: var(--arrow-color, #ffd54a);
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 6px var(--skin-glow, currentColor);
    }
    .bc-particle.feather {
        width: 12px; height: 4px;
        border-radius: 50%;
        background: var(--string-color, #ffffff);
        opacity: 0.85;
    }

    /* ===== HEART SHAKE — when HP < 30% ===== */
    body.bc-low-hp .bc-hearts-inner {
        animation: bc-low-hp-pulse 0.9s ease-in-out infinite;
    }
    @keyframes bc-low-hp-pulse {
        0%, 100% { transform: scale(var(--hp-scale, 1)) translateX(0); filter: none; }
        25% { transform: scale(var(--hp-scale, 1)) translateX(-3px); }
        50% { transform: scale(var(--hp-scale, 1)) translateX(3px); filter: drop-shadow(0 0 8px #ff3030); }
        75% { transform: scale(var(--hp-scale, 1)) translateX(-2px); }
    }

    /* ===== SLO-MO ON KILLING BLOW ===== */
    body.bc-slowmo .bc-fly-arrow,
    body.bc-slowmo .bc-redflash {
        animation-duration: 1400ms !important;
        transition-duration: 1400ms !important;
    }
    body.bc-slowmo .bc-fly-arrow * { animation-duration: 1400ms !important; }
    body.bc-slowmo .bc-arrow-trail { animation-duration: 1400ms !important; }
    body.bc-slowmo {
        animation: bc-slowmo-tint 1400ms ease-in-out forwards;
    }
    @keyframes bc-slowmo-tint {
        0%   { filter: none; }
        25%  { filter: brightness(0.7) saturate(1.6); }
        50%  { filter: brightness(0.85) saturate(1.4); }
        100% { filter: none; }
    }

    /* ===== VIEWPORT SHAKE on hit ===== */
    body.bc-shake { animation: bc-vp-shake 280ms linear; }
    @keyframes bc-vp-shake {
        0%   { transform: translate(0, 0); }
        15%  { transform: translate(-8px, 6px); }
        30%  { transform: translate(7px, -5px); }
        45%  { transform: translate(-5px, 4px); }
        60%  { transform: translate(4px, -3px); }
        80%  { transform: translate(-2px, 2px); }
        100% { transform: translate(0, 0); }
    }

    /* ===== DEATH CAM — dim + zoom out via scale on stage container ===== */
    body.bc-dead .bc-hearts-stage,
    body.bc-dead .bc-bow-stage {
        transform-origin: center center;
        animation: bc-deathcam-zoom 1200ms cubic-bezier(0.6, 0, 0.4, 1) forwards;
    }
    @keyframes bc-deathcam-zoom {
        0%   { filter: none; }
        100% { filter: grayscale(0.85) brightness(0.6); }
    }

    /* ===== KILLING-BLOW callout — name + avatar bottom-center spotlight ===== */
    .bc-killing-blow {
        position: fixed;
        left: calc(var(--cv-l, 0px) + var(--cv-w) * .5); bottom: calc(var(--cv-b, 0px) + var(--cv-h) * .25);
        transform: translateX(-50%) scale(0.5);
        z-index: 60;
        pointer-events: none;
        background: linear-gradient(135deg, #4a0a14 0%, #8b0000 50%, #4a0a14 100%);
        border: 3px solid #ff3a3a;
        border-radius: 16px;
        padding: 20px 36px;
        display: flex; align-items: center; gap: 18px;
        box-shadow: 0 0 50px rgba(255,40,40,0.7), 0 10px 30px rgba(0,0,0,0.8);
        opacity: 0;
    }
    .bc-killing-blow.show {
        animation: bc-killing-blow 3200ms ease-out forwards;
    }
    @keyframes bc-killing-blow {
        0%   { opacity: 0; transform: translateX(-50%) scale(0.4) rotate(-6deg); }
        15%  { opacity: 1; transform: translateX(-50%) scale(1.1) rotate(2deg); }
        25%  { transform: translateX(-50%) scale(1) rotate(0deg); }
        85%  { opacity: 1; transform: translateX(-50%) scale(1) rotate(0deg); }
        100% { opacity: 0; transform: translateX(-50%) scale(0.95); }
    }
    .bc-kb-avatar {
        width: 70px; height: 70px;
        border-radius: 50%;
        border: 3px solid #ffd54a;
        object-fit: cover;
        background: #1a0810;
        box-shadow: 0 0 20px #ff3a3a;
    }
    .bc-kb-text {
        display: flex; flex-direction: column; gap: 2px;
    }
    .bc-kb-title {
        font-size: 26px; font-weight: 900; color: #ffd54a;
        letter-spacing: 3px;
        text-shadow: 0 2px 0 #4a0a00, 0 0 10px #ff8a30;
    }
    .bc-kb-name {
        font-size: 32px; font-weight: 900; color: #fff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        white-space: nowrap;
        max-width: 380px;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* ===== COMBO METER — top-right counter ===== */
    .bc-combo {
        position: fixed;
        right: calc(var(--cv-r, 0px) + 24px); top: calc(var(--cv-t, 0px) + var(--cv-h) * .6);
        transform: translateY(-50%);
        z-index: 32;
        pointer-events: none;
        opacity: 0;
        transition: opacity 250ms;
        text-align: center;
    }
    .bc-combo.show { opacity: 1; }
    .bc-combo-num {
        font-size: 84px;
        font-weight: 900;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 18px #ff5b2e, 0 4px 0 #4a1a00, 0 6px 24px rgba(0,0,0,0.7);
        font-variant-numeric: tabular-nums;
    }
    .bc-combo-label {
        font-size: 22px;
        font-weight: 900;
        color: #ffd54a;
        letter-spacing: 2px;
        text-shadow: 0 2px 0 #4a1a00, 0 0 10px #ff5b2e;
    }
    .bc-combo.pop .bc-combo-num {
        animation: bc-combo-pop 380ms ease-out;
    }
    @keyframes bc-combo-pop {
        0%   { transform: scale(1); }
        50%  { transform: scale(1.4); color: #ffd54a; text-shadow: 0 0 24px #ffd54a, 0 4px 0 #4a1a00; }
        100% { transform: scale(1); }
    }

    /* ===== CRITICAL / HEADSHOT BANNER — quick popup at impact ===== */
    .bc-hit-banner {
        position: absolute;
        transform: translate(-50%, -50%) scale(0.5);
        z-index: 36;
        pointer-events: none;
        opacity: 0;
        font-weight: 900;
        letter-spacing: 2px;
        white-space: nowrap;
    }
    .bc-hit-banner.show { animation: bc-hit-banner 900ms ease-out forwards; }
    @keyframes bc-hit-banner {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(-8deg); }
        20%  { opacity: 1; transform: translate(-50%, -80%) scale(1.2) rotate(2deg); }
        40%  { transform: translate(-50%, -120%) scale(1) rotate(0deg); }
        100% { opacity: 0; transform: translate(-50%, -200%) scale(0.9); }
    }
    .bc-hit-banner.critical {
        font-size: 36px;
        color: #fff;
        text-shadow: 0 0 18px #ffd54a, 0 3px 0 #b80000, 0 4px 20px rgba(0,0,0,0.8);
    }
    .bc-hit-banner.headshot {
        font-size: 32px;
        color: #ffd54a;
        text-shadow: 0 0 18px #ff5b2e, 0 3px 0 #4a1a00;
    }
    .bc-hit-banner.firstblood {
        font-size: 28px;
        color: #ff3a3a;
        text-shadow: 0 0 18px #ff5b2e, 0 3px 0 #4a0a00;
    }


    /* ===== SHIELD ACTIVE INDICATOR — pill below hearts ===== */
    .bc-shield-active {
        position: absolute;
        left: 50%; bottom: -42px;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #25f4ee 0%, #1ac6c0 100%);
        color: #042235;
        font-weight: 900;
        font-size: 16px;
        padding: 6px 16px;
        border-radius: 14px;
        border: 2px solid #fff;
        box-shadow: 0 0 18px rgba(37,244,238,0.85);
        white-space: nowrap;
        animation: bc-shield-active-pulse 1s ease-in-out infinite alternate;
        z-index: 25;
    }
    @keyframes bc-shield-active-pulse {
        0%   { box-shadow: 0 0 12px rgba(37,244,238,0.6); }
        100% { box-shadow: 0 0 28px rgba(37,244,238,1); }
    }

    /* ===== SURVIVAL TIMER — top-right ===== */
    .bc-survival {
        position: fixed;
        right: calc(var(--cv-r, 0px) + 24px); top: calc(var(--cv-t, 0px) + 24px);
        z-index: 31;
        pointer-events: none;
        background: rgba(20, 10, 14, 0.6);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255,180,80,0.4);
        border-radius: 10px;
        padding: 6px 14px;
        font-family: 'Consolas', monospace;
        text-align: right;
    }
    .bc-survival-label {
        font-size: 11px;
        color: #ffae8c;
        letter-spacing: 1px;
        font-weight: 700;
    }
    .bc-survival-time {
        font-size: 24px;
        color: #fff;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 8px #ff8e3a;
    }
    .bc-survival-record {
        font-size: 11px;
        color: #ffd54a;
        font-weight: 700;
    }

    /* ===== TOP-3 PODIUM — end-of-session overlay ===== */
    .bc-podium {
        position: fixed; top: var(--cv-t, 0px); right: var(--cv-r, 0px); bottom: var(--cv-b, 0px); left: var(--cv-l, 0px);
        z-index: 70;
        pointer-events: none;
        background: rgba(0,0,0,0.85);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 24px;
        opacity: 0;
        backdrop-filter: blur(8px);
    }
    .bc-podium.show {
        animation: bc-podium-show 6000ms ease-out forwards;
    }
    @keyframes bc-podium-show {
        0%   { opacity: 0; }
        8%   { opacity: 1; }
        90%  { opacity: 1; }
        100% { opacity: 0; }
    }
    .bc-podium-title {
        font-size: 46px;
        font-weight: 900;
        color: #ffd54a;
        text-shadow: 0 4px 0 #4a3000, 0 0 24px #ff8e3a;
        letter-spacing: 4px;
    }
    .bc-podium-row {
        display: flex; align-items: flex-end; gap: 24px;
    }
    .bc-podium-slot {
        display: flex; flex-direction: column;
        align-items: center; gap: 8px;
        opacity: 0; transform: translateY(40px);
    }
    .bc-podium.show .bc-podium-slot { animation: bc-podium-slot 800ms ease-out forwards; }
    .bc-podium.show .bc-podium-slot:nth-child(1) { animation-delay: 800ms; }
    .bc-podium.show .bc-podium-slot:nth-child(2) { animation-delay: 400ms; }
    .bc-podium.show .bc-podium-slot:nth-child(3) { animation-delay: 1200ms; }
    @keyframes bc-podium-slot { to { opacity: 1; transform: translateY(0); } }
    .bc-podium-avatar {
        width: 100px; height: 100px;
        border-radius: 50%;
        border: 4px solid;
        object-fit: cover;
        background: #2a1a14;
    }
    .bc-podium-slot.rank-1 .bc-podium-avatar { border-color: #ffd700; box-shadow: 0 0 30px #ffd700; }
    .bc-podium-slot.rank-2 .bc-podium-avatar { border-color: #c0c0c0; box-shadow: 0 0 20px #c0c0c0; }
    .bc-podium-slot.rank-3 .bc-podium-avatar { border-color: #cd7f32; box-shadow: 0 0 20px #cd7f32; }
    .bc-podium-medal { font-size: 36px; }
    .bc-podium-name { font-size: 20px; font-weight: 900; color: #fff; max-width: 220px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bc-podium-dmg { font-size: 16px; color: #ff8e3a; font-weight: 800; }
    .bc-podium-stage {
        width: 120px;
        background: linear-gradient(180deg, #ff5b2e, #4a1a00);
        border-radius: 10px 10px 0 0;
        display: flex; align-items: flex-start; justify-content: center;
        padding-top: 12px;
        color: #fff; font-size: 32px; font-weight: 900;
        text-shadow: 0 2px 0 rgba(0,0,0,0.5);
        border: 2px solid rgba(255,255,255,0.2);
        border-bottom: none;
    }
    .bc-podium-slot.rank-1 .bc-podium-stage { height: 180px; background: linear-gradient(180deg, #ffd700, #b8860b); }
    .bc-podium-slot.rank-2 .bc-podium-stage { height: 130px; background: linear-gradient(180deg, #c0c0c0, #707070); }
    .bc-podium-slot.rank-3 .bc-podium-stage { height: 100px; background: linear-gradient(180deg, #cd7f32, #6b3a18); }
    .bc-podium-survival {
        margin-top: 14px;
        font-size: 22px;
        color: #fff;
        text-align: center;
    }
    .bc-podium-survival b { color: #ffd54a; font-size: 28px; }
    .bc-podium-record { color: #25f4ee; font-size: 16px; margin-top: 4px; }

    /* Shield deflect ping — radial pulse at impact when blocked */
    .bc-shield-ping {
        position: absolute;
        width: 120px; height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle,
            rgba(255,255,255,0.85) 0%,
            rgba(37,244,238,0.7) 20%,
            rgba(37,244,238,0.3) 50%,
            transparent 75%);
        transform: translate(-50%, -50%) scale(0.4);
        opacity: 0;
        pointer-events: none;
        animation: bc-shield-ping 800ms ease-out forwards;
        box-shadow: 0 0 40px rgba(37,244,238,0.9);
        z-index: 36;
    }
    @keyframes bc-shield-ping {
        0%   { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
        20%  { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
    }
    .bc-shield-text {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 28px;
        font-weight: 900;
        color: #fff;
        text-shadow: 0 0 12px #25f4ee, 0 2px 4px rgba(0,0,0,0.8);
        pointer-events: none;
        animation: bc-shield-text 800ms ease-out forwards;
        z-index: 37;
        white-space: nowrap;
    }
    @keyframes bc-shield-text {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
        20%  { opacity: 1; transform: translate(-50%, -90%) scale(1.1); }
        100% { opacity: 0; transform: translate(-50%, -140%) scale(1); }
    }

    /* ===== SHOOTER NAME POPUP ===== */
    .bc-shooter-pop {
        position: absolute;
        font-size: 22px;
        font-weight: 900;
        color: #fff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 12px #ff3030;
        white-space: nowrap;
        pointer-events: none;
        animation: bc-shooter-fade 1500ms ease-out forwards;
        z-index: 35;
    }
    .bc-shooter-pop .nick { color: #ffd54a; }
    .bc-shooter-pop .dmg  { color: #ff6060; margin-left: 6px; }
    @keyframes bc-shooter-fade {
        0%   { opacity: 0; transform: translate(-50%, 0) scale(0.8); }
        15%  { opacity: 1; transform: translate(-50%, -10px) scale(1.05); }
        80%  { opacity: 1; transform: translate(-50%, -60px) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -100px) scale(0.9); }
    }

    /* ===== HEAL / SHIELD / REVIVE BANNER ===== */
    .bc-banner {
        position: fixed; left: calc(var(--cv-l, 0px) + var(--cv-w) * .5); top: calc(var(--cv-t, 0px) + var(--cv-h) * .4);
        transform: translate(-50%, -50%) scale(0.5);
        z-index: 50;
        pointer-events: none;
        --banner-scale: 0.5;
        font-size: calc(64px * var(--banner-scale));
        font-weight: 900;
        padding: calc(18px * var(--banner-scale)) calc(40px * var(--banner-scale));
        border-radius: calc(18px * var(--banner-scale) + 4px);
        text-align: center;
        opacity: 0;
        white-space: nowrap;
        box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }
    .bc-banner.show {
        animation: bc-banner-cycle 2200ms ease-out forwards;
    }
    .bc-banner.heal {
        background: linear-gradient(180deg, #4ade80, #16803a);
        color: #fff;
        text-shadow: 0 2px 0 #064020;
        border: 3px solid #a0ffb0;
    }
    .bc-banner.shield {
        background: linear-gradient(180deg, #25f4ee, #0e6e80);
        color: #fff;
        text-shadow: 0 2px 0 #042235;
        border: 3px solid #a0ffe0;
    }
    .bc-banner.revive {
        background: linear-gradient(180deg, #ffd700, #c97f25);
        color: #1a0606;
        text-shadow: 0 2px 0 rgba(255,255,255,0.4);
        border: 3px solid #fff;
    }
    .bc-banner-sub {
        display: block;
        font-size: calc(26px * var(--banner-scale, 1));
        font-weight: 700;
        margin-top: 6px;
        opacity: 0.95;
    }
    @keyframes bc-banner-cycle {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-8deg); }
        15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(2deg); }
        25%  { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        80%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9) rotate(0deg); }
    }

    /* ===== GIFT LIST OVERLAY — danh sách quà chỉ định (giống thuytinh badges) ===== */
    .bc-giftlist {
        position: fixed;
        left: 4%; top: 30%;
        z-index: 28;
        pointer-events: none;
        display: flex; flex-direction: column;
        gap: 8px;
        max-height: 80vh;
        overflow: visible;
        transform-origin: top left;
        flex-wrap: wrap;
    }
    .bc-giftlist.layout-horizontal {
        flex-direction: row;
        max-width: 92vw;
        max-height: none;
    }
    .bc-giftlist.layout-horizontal .bc-gl-counter {
        align-self: center;
        margin-right: 8px;
        margin-bottom: 0;
    }
    .bc-gl-card {
        width: 88px;
        background: linear-gradient(180deg, var(--gl-bg1, #2a1a25) 0%, var(--gl-bg2, #1a0c14) 100%);
        border: 2px solid var(--gl-border, #ff5fa3);
        border-radius: 14px;
        padding: 8px 6px;
        display: flex; flex-direction: column;
        align-items: center; gap: 4px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.15);
        position: relative;
    }
    .bc-gl-card.shot   { --gl-bg1:#3a1010; --gl-bg2:#1a0808; --gl-border:#ff3a3a; }
    .bc-gl-card.heal   { --gl-bg1:#103a1f; --gl-bg2:#081a0e; --gl-border:#4ade80; }
    .bc-gl-card.revive { --gl-bg1:#3a3010; --gl-bg2:#1a1408; --gl-border:#ffd54a; }
    .bc-gl-card.shield { --gl-bg1:#103a3a; --gl-bg2:#081a1a; --gl-border:#25f4ee; }
    .bc-gl-icon-wrap {
        width: 56px; height: 56px;
        border-radius: 50%;
        background: rgba(0,0,0,0.35);
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
    }
    .bc-gl-icon-wrap img {
        max-width: 88%; max-height: 88%;
        object-fit: contain;
    }
    .bc-gl-emoji-fallback { font-size: 30px; }
    .bc-gl-label {
        font-size: 11px;
        font-weight: 800;
        color: #fff;
        text-align: center;
        line-height: 1.1;
        text-shadow: 0 1px 2px rgba(0,0,0,0.7);
        max-width: 80px;
        word-wrap: break-word;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
    }
    .bc-gl-tag {
        position: absolute; top: -8px; right: -8px;
        background: var(--gl-border, #ff5fa3);
        color: #fff;
        font-size: 11px;
        font-weight: 900;
        padding: 2px 7px;
        border-radius: 10px;
        border: 2px solid rgba(0,0,0,0.5);
        text-shadow: 0 1px 1px rgba(0,0,0,0.5);
    }
    .bc-gl-counter {
        align-self: flex-start;
        background: #ff3a3a;
        color: #fff;
        font-size: 14px;
        font-weight: 900;
        padding: 3px 12px;
        border-radius: 14px;
        border: 2px solid rgba(0,0,0,0.5);
        margin-bottom: 4px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    /* Edit-mode drag affordance */
    body.bc-edit .bc-giftlist {
        pointer-events: auto;
        cursor: move;
        outline: 2px dashed rgba(0,255,140,0.5);
        outline-offset: 6px;
    }
    body.bc-edit .bc-giftlist::after {
        content: '🎁 DANH SÁCH — KÉO để di chuyển | CUỘN để zoom';
        position: absolute;
        top: -28px; left: 0;
        background: rgba(0,0,0,0.75); color: #ffd54a; padding: 4px 10px;
        font-size: 12px; border-radius: 4px; white-space: nowrap;
    }
    body.no-giftlist .bc-giftlist { display: none; }
    body.no-hpnum .bc-hearts-num { display: none; }
    body.bc-stopped .bc-giftlist { /* vẫn hiện cho OBS preview */ }

    /* ===== TOP CONTRIBUTOR LEADERBOARD ===== */
    .bc-top {
        position: fixed;
        z-index: 30;
        pointer-events: none;
        background: rgba(20, 10, 14, 0.65);
        backdrop-filter: blur(6px);
        border: 2px solid rgba(255, 90, 90, 0.5);
        border-radius: 14px;
        padding: 10px 14px;
        min-width: 280px;
        max-width: 360px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        transition: left 250ms ease, top 250ms ease, right 250ms ease, bottom 250ms ease;
    }
    .bc-top-title {
        font-weight: 900; font-size: 22px;
        color: #ff8e8c; text-align: center;
        margin-bottom: 6px; letter-spacing: 1px;
        text-shadow: 0 2px 0 rgba(0,0,0,0.4);
    }
    .bc-top-list { display: flex; flex-direction: column; gap: 4px; }
    .bc-top-row {
        display: grid;
        grid-template-columns: 26px 38px 1fr 80px;
        gap: 6px; align-items: center;
        font-size: 17px; color: #fff;
        padding: 3px 4px; border-radius: 6px;
    }
    .bc-top-row.rank-0 { background: linear-gradient(90deg, rgba(255,215,0,0.25), transparent); }
    .bc-top-row.rank-1 { background: linear-gradient(90deg, rgba(192,192,192,0.22), transparent); }
    .bc-top-row.rank-2 { background: linear-gradient(90deg, rgba(205,127,50,0.22), transparent); }
    .bc-top-rank { font-weight: 900; color: #ffd54a; text-align: center; }
    .bc-top-avatar {
        width: 32px; height: 32px; border-radius: 50%;
        object-fit: cover; border: 2px solid rgba(255,150,150,0.6);
        background: #2a1a14;
    }
    .bc-top-name {
        font-weight: 700;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .bc-top-dmg {
        font-weight: 900; color: #ff6060;
        text-align: right; font-variant-numeric: tabular-nums;
        text-shadow: 0 0 6px rgba(255,40,40,0.6);
    }

    /* IMPACT ZONE marker — vùng mũi tên trúng. Vô hình khi không edit. */
    .bc-impact-zone {
        position: fixed;
        left: 50%; top: 18%;
        transform: translate(-50%, -50%);
        z-index: 22;
        pointer-events: none;
        width: 80px; height: 80px;
        border-radius: 50%;
        opacity: 0;
    }

    /* ===== BÁM THEO NGƯỜI — hàng tim/điểm trúng đặt theo pixel từng khung, không transition ===== */
    body.bc-tracking .bc-hearts-stage,
    body.bc-tracking .bc-impact-zone { transition: none; }
    body.bc-tracking .bc-hearts-inner { transition: none; }
    /* Vết đỏ nhạt chỗ trúng — dính theo thân người, mờ dần (opacity do JS đặt theo tuổi) */
    /* Gốc (0,0) = điểm trúng; JS đặt translate theo thân + scale. Vết loang xoay ngẫu nhiên, vệt chảy luôn hướng xuống. */
    .bc-blood {
        position: absolute;
        left: 0; top: 0; width: 0; height: 0;
        pointer-events: none;
        will-change: transform, opacity;
        z-index: 21;
    }
    .bc-blood .splat {
        position: absolute;
        left: -40px; top: -40px; width: 80px; height: 80px;
        border-radius: 46% 54% 50% 50% / 52% 44% 56% 48%;
        background: radial-gradient(ellipse at 50% 50%, rgba(var(--blood-core),0.95) 0%, rgba(var(--blood-mid),0.88) 28%, rgba(var(--blood-lite),0.55) 50%, rgba(var(--blood-lite),0) 70%);
        filter: blur(0.6px);
        animation: bc-blood-pop 260ms cubic-bezier(0.2, 1.4, 0.4, 1) both;
    }
    .bc-blood .splat::before, .bc-blood .splat::after {
        /* giọt bắn văng ra quanh vết */
        content: '';
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(var(--blood-core),0.95) 0%, rgba(var(--blood-mid),0.7) 45%, rgba(var(--blood-mid),0) 72%);
    }
    .bc-blood .splat::before { left: 78%; top: 8%;  width: 26%; height: 22%; }
    .bc-blood .splat::after  { left: -6%; top: 64%; width: 20%; height: 18%; }
    .bc-blood .drip {
        position: absolute;
        left: -3px; top: 0;
        width: 6px; height: 0;
        border-radius: 3px 3px 4px 4px;
        background: linear-gradient(180deg, rgba(var(--blood-mid),0.92), rgba(var(--blood-core),0.85) 80%, rgba(var(--blood-core),0.95));
        animation: bc-blood-drip 1800ms cubic-bezier(0.3, 0.1, 0.4, 1) 180ms forwards;
    }
    @keyframes bc-blood-pop { from { transform: scale(0.15); opacity: 0.6; } to { transform: scale(1); opacity: 1; } }
    @keyframes bc-blood-drip { to { height: var(--drip, 44px); } }
    /* Mũi tên cắm lại trên người một lúc rồi mờ — đầu mũi tên nằm đúng điểm chạm */
    .bc-stuck-arrow {
        position: absolute;
        left: 0; top: 0;
        width: 0; height: 0;
        pointer-events: none;
        will-change: transform, opacity;
        z-index: 23;
        filter: drop-shadow(0 0 6px var(--skin-glow, transparent));
    }
    .bc-stuck-arrow svg {
        position: absolute;
        width: 112px; height: 27px;
        right: -8px; top: -13.5px;   /* đầu mũi tên (x≈132/140) trùng gốc, cắm sâu ~8px vào thân */
        overflow: visible;
        transform-origin: 104px 13.5px;   /* lắc quanh chỗ cắm */
        animation: bc-stick-wobble 420ms ease-out;
    }
    @keyframes bc-stick-wobble {
        0%   { transform: translateX(-10px) rotate(0deg); }
        18%  { transform: translateX(0) rotate(-7deg); }
        40%  { transform: rotate(5deg); }
        62%  { transform: rotate(-3deg); }
        82%  { transform: rotate(1.4deg); }
        100% { transform: rotate(0deg); }
    }
    .bc-stuck-arrow .shaft { stroke: var(--arrow-color); stroke-width: 4; fill: var(--arrow-color); }
    .bc-stuck-arrow .head { fill: var(--arrow-color); stroke: var(--arrow-color); stroke-width: 1.5; }
    .bc-stuck-arrow .fletch { fill: var(--string-color); }
    /* Chớp đỏ THEO HÌNH CƠ THỂ khi trúng (thay chớp toàn màn khi đã bám được người) */
    .bc-body-flash {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 40;
    }
    /* Hết máu khi đang bám người: cơ thể cháy đen (canvas), KHÔNG phủ tối cả màn hình */
    .bc-body-char {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 38;
    }
    body.bc-dead.bc-tracking .bc-deathveil {
        background: transparent;
        justify-content: flex-end;
        padding-bottom: 7%;
    }
    body.bc-dead.bc-tracking .bc-dead-label { font-size: 64px; letter-spacing: 6px; }
    /* Tắt bảng "ĐÃ GỤC" + đếm ngược + lời nhắc (mặc định) — giữ lại hiệu ứng tối/cháy đen */
    body.no-deathpanel .bc-dead-label,
    body.no-deathpanel .bc-dead-countdown,
    body.no-deathpanel .bc-dead-hint { display: none !important; }
    body.bc-dead.bc-tracking .bc-dead-countdown { margin-top: 6px; font-size: 48px; }
    body.bc-dead.bc-tracking .bc-dead-hint { margin-top: 8px; font-size: 24px; }
    /* Nhắc nhỏ dưới đáy khi bật bám người mà chưa có hình camera từ OBS */
    .bc-track-warn {
        position: fixed; left: 50%; bottom: 3%;
        transform: translateX(-50%);
        max-width: 86%;
        padding: 8px 14px;
        border-radius: 10px;
        background: rgba(20,20,28,0.78);
        border: 1px solid rgba(255,170,60,0.6);
        color: #ffd28a;
        font-size: 15px; font-weight: 600;
        text-align: center;
        pointer-events: none;
        z-index: 60;
        display: none;
    }
    .bc-track-warn.show { display: block; }

    /* EDIT MODE — only when ?edit=1 */
    body.bc-edit .bc-hearts-stage,
    body.bc-edit .bc-bow-stage,
    body.bc-edit .bc-impact-zone {
        cursor: move; pointer-events: auto;
        outline: 2px dashed rgba(0,255,140,0.5);
        outline-offset: 6px;
    }
    body.bc-edit .bc-impact-zone {
        opacity: 1;
        outline-color: rgba(255,80,80,0.85);
        background: radial-gradient(circle, rgba(255,40,40,0.45) 0%, rgba(255,40,40,0) 70%);
    }
    body.bc-edit .bc-impact-zone::after {
        content: '🎯 ĐIỂM TRÚNG — kéo để chỉnh';
        position: absolute;
        bottom: -28px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.75); color: #ff8e8e; padding: 4px 10px;
        font-size: 12px; border-radius: 4px; white-space: nowrap;
    }
    body.bc-edit .bc-hearts-stage::before {
        content: '♥ KÉO — di chuyển | CUỘN — zoom';
        position: absolute;
        bottom: -28px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.7); color: #fff; padding: 4px 10px;
        font-size: 12px; border-radius: 4px; white-space: nowrap;
    }
    body.bc-edit .bc-bow-stage::before {
        content: '🏹 KÉO — di chuyển | CUỘN — zoom';
        position: absolute;
        bottom: -28px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.7); color: #fff; padding: 4px 10px;
        font-size: 12px; border-radius: 4px; white-space: nowrap;
    }

    /* Hidden state toggles */
    body.no-hearts .bc-hearts-stage { display: none; }
    body.no-bow .bc-bow-stage { display: none; }
    body.no-top .bc-top { display: none; }
    /* Khi phiên KẾT THÚC — vẫn HIỂN THỊ ĐẦY ĐỦ hearts + bow ở opacity 100% (OBS preview rõ).
       Chỉ ẩn các effect layers (chớp đỏ / particles / banner / podium).
       User không cần bấm "Bắt đầu" để thấy overlay trong OBS. */
    /* App đóng (mất kết nối) / game tắt / chưa bấm ▶ Bắt đầu → ẩn TRỌN overlay trong OBS (trừ chế độ sửa vị trí). */
    body { transition: opacity 400ms ease; }
    body.bc-hide:not(.bc-edit) { opacity: 0 !important; }
    body.bc-stopped .bc-redflash,
    body.bc-stopped .bc-deathveil,
    body.bc-stopped .bc-banner,
    body.bc-stopped .bc-combo,
    body.bc-stopped .bc-killing-blow,
    body.bc-stopped .bc-podium { display: none !important; }
</style>
</head>
<body class="bc-heart-pixel">

    <!-- Impact target zone (visible only in edit mode) -->
    <div class="bc-impact-zone" id="bc-impact-zone"></div>

    <!-- Flying arrows + popups layer -->
    <div class="bc-arrows-layer" id="bc-arrows-layer"></div>
    <div class="bc-track-warn" id="bc-track-warn"></div>
    <canvas class="bc-body-flash" id="bc-body-flash"></canvas>
    <canvas class="bc-body-char" id="bc-body-char"></canvas>

    <!-- Heal/Shield/Revive banner -->

    <!-- Combo counter -->

    <div class="bc-survival" id="bc-survival">
        <div class="bc-survival-label">⏱ SỐNG SÓT</div>
        <div class="bc-survival-time" id="bc-survival-time">0:00</div>
