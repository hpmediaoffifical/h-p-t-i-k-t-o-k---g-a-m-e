<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Game Camera — overlay</title>
<script src="/lib/overlay-resolution.js"></script>
<style>
  /* Một Browser Source cho mọi game camera: trang mẹ trong suốt, mỗi game đang chơi một iframe phủ kín
     (chơi 2 game cùng lúc = 2 lớp chồng: game tay dưới, game trên đầu ở trên).
     Không có nút/cài đặt nào ở đây — mọi cài đặt làm trong app (Game Camera). */
  html, body { margin: 0; height: 100%; background: transparent !important; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent;
           opacity: 1; transition: opacity .35s ease; }
  iframe.out { opacity: 0; }
</style>
</head>
<body>
<script src="/socket.io/socket.io.js"></script>
<script src="/games/camgames/registry.js"></script>
<script type="module">
import { createCamShared } from '/lib/hp-cam-shared.mjs';

const qs = new URLSearchParams(location.search);
const token = qs.get('token') || '';
const SLOT_Z = { body: 0, hands: 1, kick: 1, head: 2 };   // body = người tách nền: nằm dưới mọi game
const frames = new Map();          // id game → iframe đang chạy
const socket = io({ transports: ['websocket', 'polling'], auth: token ? { token } : undefined });
// Bộ nhận diện chung — tạo TRƯỚC khi nạp game con để game con tìm thấy (sharedTracker trong hp-tracking.mjs).
const shared = window.__hpCamShared = createCamShared({ socket });

// Chuyển tiếp query của link OBS (token máy thứ 2, res=4k…) sang game con.
function childUrl(game) {
    const extra = new URLSearchParams(location.search).toString();
    return game.overlay + (extra ? (game.overlay.includes('?') ? '&' : '?') + extra : '');
}

// Config cũ chỉ có `active`; bản mới có `actives` (các game chơi cùng lúc).
function activesOf(cfg) {
    const list = Array.isArray(cfg.actives) && cfg.actives.length ? cfg.actives : [cfg.active];
    return list.map(id => (window.HpCamGames || []).find(g => g.id === id)).filter(Boolean);
}

// 🔇 Báo khung game có đang ĐƯỢC CHƠI không (cam-frame-guard.js trong game con): khung sắp gỡ / mất kết nối app
// → active:false → game con khoá hết âm thanh và ngưng chạy (không vo ve / sinh vật mãi trong OBS).
let offline = false;
function tellFrame(f, active) {
    if (f.dataset.active === String(active)) return;
    f.dataset.active = String(active);
    try { f.contentWindow && f.contentWindow.postMessage({ type: 'hp-cam-frame', active }, location.origin); } catch (_) {}
}

// Thêm/bớt iframe theo danh sách; game vẫn đang chơi KHÔNG nạp lại (giữ muỗi/điểm giữa live).
function show(cfg) {
    const want = cfg && cfg.enabled !== false ? activesOf(cfg) : [];
    for (const [id, f] of frames) {
        if (want.some(g => g.id === id)) continue;
        frames.delete(id);
        shared.drop(id);                   // game rời: thôi nhận diện phần của nó ngay, khỏi đợi iframe gỡ
        tellFrame(f, false);               // im ngay, không đợi 350 ms gỡ khung
        f.classList.add('out');
        setTimeout(() => f.remove(), 350);
    }
    for (const game of want) {
        if (frames.has(game.id)) continue;
        const f = document.createElement('iframe');
        f.allow = 'autoplay'; f.title = game.name; f.className = 'out'; f.dataset.id = game.id;
        f.style.zIndex = SLOT_Z[game.slot] ?? 1;   // ?? chứ không ||: body = 0 phải giữ 0
        f.onload = () => { f.classList.remove('out'); f.dataset.active = ''; tellFrame(f, !offline); };
        f.src = childUrl(game);
        document.body.appendChild(f);
        frames.set(game.id, f);
    }
    // Lớp trên (game bám đầu) phủ kín màn: có game tay bên dưới thì cho chuột xuyên qua — kẻo tay/vợt/chém
    // bằng chuột của game dưới (thử trong cửa sổ Tương tác của OBS) không nhận được gì.
    for (const f of frames.values()) if (f.dataset.active !== undefined && f.contentWindow) tellFrame(f, !offline);
    const hasHands = want.some(g => g.slot === 'hands');
    for (const [id, f] of frames) {
        const g = want.find(x => x.id === id);
        f.style.pointerEvents = hasHands && g && g.slot !== 'hands' ? 'none' : '';
    }
}

function load() {
    fetch('/api/games/camgames/config', { cache: 'no-store' }).then(r => r.json()).then(show).catch(() => {});
}

let offlineTimer = 0;
socket.on('connect', () => { clearTimeout(offlineTimer); offline = false; socket.emit('subscribe', 'overlay'); load(); });
socket.on('disconnect', () => {
    clearTimeout(offlineTimer);
    offlineTimer = setTimeout(() => { offline = true; for (const f of frames.values()) tellFrame(f, false); }, 1500);
});
socket.on('gameConfig', d => { if (d && d.gameId === 'camgames') show(d.config); });
socket.on('gameDisabled', d => { if (d && d.gameId === 'camgames') show({ enabled: false }); });
socket.on('gameEnabled', d => { if (d && d.gameId === 'camgames') load(); });
socket.on('overlay:reload', d => { if (d && d.gameId === 'camgames') location.reload(); });
window.__cg = { frames, shared };      // soi/thử trong DevTools
load();
</script>
</body>
</html>
