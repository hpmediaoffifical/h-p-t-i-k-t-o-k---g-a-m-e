        $banner.appendChild(flash);
        setTimeout(() => flash.remove(), 900);
        const icons = ['✨', '🦋', '💚', '🌟'];
        for (let i = 0; i < 9; i++) {
            const el = document.createElement('div');
            el.className = 'tc-heal-mote';
            el.textContent = icons[i % icons.length];
            el.style.left = (cx + (Math.random() * 60 - 30)).toFixed(0) + 'px';
            el.style.top = (cy + (Math.random() * 30 - 15)).toFixed(0) + 'px';
            el.style.setProperty('--s', (18 + Math.random() * 14).toFixed(0) + 'px');
            el.style.setProperty('--dx', (Math.random() * 60 - 30).toFixed(0) + 'px');
            el.style.setProperty('--rise', (60 + Math.random() * 70).toFixed(0) + 'px');
            el.style.setProperty('--dur', (1.2 + Math.random() * 0.7).toFixed(2) + 's');
            $banner.appendChild(el);
            setTimeout(() => el.remove(), 2200);
        }
    }

    // ═══════════════════ 🐉 RỒNG LỬA THIÊU VƯỜN ═══════════════════
    const TCD_FLY = '/assets/jar-fx-webm/dragon-fly.png';
    const TCD_BREATH = '/assets/jar-fx-webm/dragon-breath.png';
    let tcdTimers = [], tcdIvs = [];
    function tcdT(fn, ms) { tcdTimers.push(setTimeout(fn, ms)); }
    function tcdIv(iv) { tcdIvs.push(iv); }
    function tcdClearIvs() { tcdIvs.forEach(clearInterval); tcdIvs = []; }
    function tcdClearTimers() { tcdTimers.forEach(clearTimeout); tcdTimers = []; tcdClearIvs(); }

    // Vị trí (px màn hình) các gốc cây hiện có → nơi sẽ bốc cháy.
    function tcdTreePoints() {
        const rect = $garden.getBoundingClientRect();
        const toScreen = (gx, gy) => ({ x: rect.left + gx / 980 * rect.width, y: rect.top + gy / 1200 * rect.height });
        const pts = [];
        const plants = Array.isArray(state.plants) ? state.plants.filter(p => (Number(p.height) || 0) > 0) : [];
        if (plants.length) {
            plants.forEach(p => { const m = plantMeta(p); const b = toScreen(m.baseX, 1120); const t = toScreen(m.cx, m.topY); pts.push({ baseX: b.x, baseY: b.y, h: Math.max(80, b.y - t.y) }); });
        } else if ((Number(state.height) || 0) > 0.05) {
            const count = clamp(parseInt(config.display.stemCount, 10) || 7, 1, 12);
            for (let i = 0; i < count; i++) { const m = stemMeta(i); const b = toScreen(m.baseX, 1120); const t = toScreen(m.cx, m.topY); pts.push({ baseX: b.x, baseY: b.y, h: Math.max(80, b.y - t.y) }); }
        }
        if (!pts.length) {   // vườn trống → vẫn cháy 1 dải ngang mặt đất cho hoành tráng
            const g = toScreen(490, 1118);
            for (let i = 0; i < 7; i++) pts.push({ baseX: rect.left + rect.width * (0.16 + i * 0.11), baseY: g.y, h: rect.height * 0.18 });
        }
        return { rect, pts };
    }
    function tcdAddFlame(x, baseY, treeH) {
        const big = Math.max(70, treeH * 0.5);
        const layers = 2 + Math.round(Math.random());
        for (let k = 0; k < layers; k++) {
            const f = document.createElement('i');
            f.className = 'tcd-flame' + (k === 0 ? '' : ' core');
            f.style.left = (x + (Math.random() * 30 - 15)).toFixed(0) + 'px';
            f.style.top = baseY.toFixed(0) + 'px';
            f.style.setProperty('--fw', (big * (0.7 - k * 0.18) + Math.random() * 16).toFixed(0) + 'px');
            f.style.setProperty('--fh', (treeH * (0.55 - k * 0.1) + 80 + Math.random() * 40).toFixed(0) + 'px');
            f.style.setProperty('--ff', (0.3 + Math.random() * 0.3).toFixed(2) + 's');
            f.style.opacity = '0';
            $tcd.appendChild(f);
            requestAnimationFrame(() => { f.style.transition = 'opacity .35s ease'; f.style.opacity = '1'; });
        }
    }
    function tcdAddEmber(x, y) {
        const e = document.createElement('i'); e.className = 'tcd-ember';
        e.style.left = x.toFixed(0) + 'px'; e.style.top = y.toFixed(0) + 'px';
        e.style.setProperty('--ex', (Math.random() * 80 - 40).toFixed(0) + 'px');
        e.style.setProperty('--ey', (120 + Math.random() * 120).toFixed(0) + 'px');
        e.style.setProperty('--ed', (1.4 + Math.random() * 1.2).toFixed(2) + 's');
        $tcd.appendChild(e); setTimeout(() => e.remove(), 2800);
    }
    function tcdAddSmoke(x, y) {
        const s = document.createElement('i'); s.className = 'tcd-smoke';
        s.style.left = x.toFixed(0) + 'px'; s.style.top = y.toFixed(0) + 'px';
        s.style.setProperty('--kw', (70 + Math.random() * 70).toFixed(0) + 'px');
        s.style.setProperty('--kx', (Math.random() * 120 - 60).toFixed(0) + 'px');
        s.style.setProperty('--ky', (180 + Math.random() * 160).toFixed(0) + 'px');
        s.style.setProperty('--kd', (2.6 + Math.random() * 1.6).toFixed(2) + 's');
        $tcd.appendChild(s); setTimeout(() => s.remove(), 4400);
    }
    function tcdBreath(fromX, fromY, toX, toY) {
        const s = document.createElement('div'); s.className = 'tcd-streak';
        const dir = (toX >= fromX) ? 'right' : 'left';
        s.innerHTML = `<img src="/assets/jar-fx-webm/fire-streak-${dir}.png">`;
        const ang = Math.atan2(toY - fromY, toX - fromX) * 180 / Math.PI;
        s.style.left = fromX.toFixed(0) + 'px'; s.style.top = fromY.toFixed(0) + 'px';
        s.style.setProperty('--sw', (20 + Math.random() * 10).toFixed(0) + 'vmin');
        s.style.setProperty('--sr', ang.toFixed(1) + 'deg');
        $tcd.appendChild(s);
        requestAnimationFrame(() => { s.style.transition = 'left .5s ease-in, top .5s ease-in, opacity .5s ease'; s.style.opacity = '1'; s.style.left = toX.toFixed(0) + 'px'; s.style.top = toY.toFixed(0) + 'px'; });
        setTimeout(() => { s.style.opacity = '0'; }, 480);
        setTimeout(() => s.remove(), 1050);
    }
    function dragonRoar() {
        if (config.display.soundEnabled === false) return;
        try {
            audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const o = audioCtx.createOscillator(), g = audioCtx.createGain(), lp = audioCtx.createBiquadFilter();
            o.type = 'sawtooth'; o.frequency.setValueAtTime(120, now); o.frequency.exponentialRampToValueAtTime(48, now + 1.1);
            g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.22, now + 0.12); g.gain.exponentialRampToValueAtTime(0.0001, now + 1.3);
            lp.type = 'lowpass'; lp.frequency.value = 900;
            o.connect(lp); lp.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 1.35);
            const dur = 1.2, sr = audioCtx.sampleRate, buf = audioCtx.createBuffer(1, Math.floor(sr * dur), sr), dd = buf.getChannelData(0);
            for (let i = 0; i < dd.length; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / dd.length, 1.2) * 0.5;
            const src = audioCtx.createBufferSource(); src.buffer = buf;
            const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 0.7;
            const ng = audioCtx.createGain(); ng.gain.value = 0.1;
            src.connect(bp); bp.connect(ng); ng.connect(audioCtx.destination); src.start(now + 0.05);
        } catch (e) {}
    }
    function tcdBuildDragon() {
        const el = document.createElement('div');
        el.className = 'tcd-dragon';
        el.innerHTML = `<div class="tcd-dragon-inner"><img class="tcd-pose tcd-fly" src="${TCD_FLY}"><img class="tcd-pose tcd-breath" src="${TCD_BREATH}"></div>`;
        $tcd.appendChild(el);
        return el;
    }
    // faceDir: +1 nhìn phải, -1 nhìn trái. Pose bay (png) nhìn TRÁI, pose phun nhìn PHẢI.
    function tcdMove(el, leftPct, topPct, ms, faceDir, breath, tilt) {
        if (!el) return;
        const native = breath ? 1 : -1;
        const sx = (native === faceDir) ? 1 : -1;
        el.style.transition = `left ${ms}ms ease-in-out, top ${ms}ms ease-in-out, transform ${Math.min(ms, 420)}ms ease`;
        el.style.left = leftPct + '%';
        el.style.top = topPct + '%';
        el.style.transform = `translate(-50%,-50%) scaleX(${sx}) rotate(${tilt || 0}deg)`;
    }
    function tcdFinalize() {
        tcBurning = false;
        tcdClearTimers();
        $tcd.innerHTML = ''; $tcd.style.opacity = ''; $tcd.style.transition = '';
        $garden.classList.remove('tcd-burning'); $garden.style.removeProperty('transition');
        $svg.style.transition = $flowers.style.transition = '';
        $svg.style.opacity = $flowers.style.opacity = '';
        render();
    }
    function playDragon(d) {
        if (!d || config.display.showDragon === false || tcBurning) return;
        tcBurning = true;
        tcdClearTimers(); $tcd.innerHTML = ''; $tcd.style.opacity = ''; $tcd.style.transition = '';
        const pre = Math.max(1500, Number(d.preburnMs) || 5200);
        const ch = Math.max(400, Number(d.charMs) || 2000);
        const burn = clamp(Number(d.burnSeconds) || 10, 2, 60) * 1000;
        const fade = Math.max(400, Number(d.fadeMs) || 1600);
        const total = pre + ch + burn + fade;
        const { rect: burnRect, pts: treePts } = tcdTreePoints();
        const groundY = burnRect.top + burnRect.height * (1118 / 1200);
        const ignited = new Set();
        const igniteNearest = (mx) => {
            let best = -1, bd = 1e9;
            treePts.forEach((t, i) => { if (ignited.has(i)) return; const dd = Math.abs(t.baseX - mx); if (dd < bd) { bd = dd; best = i; } });
            if (best >= 0 && bd < burnRect.width * 0.26) { ignited.add(best); const t = treePts[best]; tcdAddFlame(t.baseX, t.baseY, t.h); tcdAddSmoke(t.baseX, t.baseY - t.h * 0.5); }
        };
        const el = tcdBuildDragon();
        el.classList.remove('is-breath');
        el.style.left = '118%'; el.style.top = '16%'; el.style.transform = 'translate(-50%,-50%) scaleX(1)';
        dragonRoar();
        // 1) bay vào (nhìn trái) → 2) lượn sang trái
        tcdT(() => tcdMove(el, 68, 19, 1150, -1, false, -4), 60);
        tcdT(() => tcdMove(el, 22, 25, 1300, -1, false, 3), 1250);
        // 3) đổi pose phun lửa (nhìn phải) + quét trái→phải vừa phun
        const sweepFrom = 2600;
        const sweepMs = Math.max(800, (pre - sweepFrom) + ch);
        tcdT(() => { el.classList.add('is-breath'); tcdMove(el, 24, 22, 300, 1, true, 0); }, sweepFrom);
        tcdT(() => tcdMove(el, 82, 24, sweepMs, 1, true, 0), sweepFrom + 320);
        tcdT(() => {
            const iv = setInterval(() => {
                if (!el.isConnected) return;
                const dr = el.getBoundingClientRect();
                const mx = dr.left + dr.width * 0.5, my = dr.top + dr.height * 0.6;
                tcdBreath(mx, my, mx + (Math.random() * 100 - 50), groundY);
                igniteNearest(mx);
                if (Math.random() < 0.7) tcdAddEmber(mx + (Math.random() * 60 - 30), my);
            }, 200);
            tcdIv(iv);
        }, sweepFrom + 280);
        // 4) char toàn vườn + đốt sạch cây còn lại
        tcdT(() => {
            $garden.style.setProperty('transition', `filter ${ch}ms ease`, 'important');
            $garden.classList.add('tcd-burning');
            treePts.forEach((t, i) => { if (!ignited.has(i)) { ignited.add(i); tcdAddFlame(t.baseX, t.baseY, t.h); tcdAddSmoke(t.baseX, t.baseY - t.h * 0.5); } });
            dragonRoar();
        }, pre);
        // 5) ngừng phun, đổi pose bay, bay đi
        tcdT(() => { tcdClearIvs(); el.classList.remove('is-breath'); tcdMove(el, 120, -14, 1300, 1, false, 8); }, pre + ch);
        tcdT(() => { if (el) el.remove(); }, pre + ch + 1400);
        // 6) pha tro: tàn than + khói lai rai
        tcdT(() => {
            const iv = setInterval(() => {
                treePts.forEach(t => { if (Math.random() < 0.45) tcdAddEmber(t.baseX + (Math.random() * 44 - 22), t.baseY - t.h * Math.random() * 0.7); });
                if (Math.random() < 0.6 && treePts.length) { const t = treePts[Math.floor(Math.random() * treePts.length)]; tcdAddSmoke(t.baseX, t.baseY - t.h * 0.5); }
            }, 300);
            tcdIv(iv);
        }, pre + ch + 200);
        // 7) tan dần: mờ lớp lửa + cây cháy (giữ mặt đất)
        tcdT(() => {
            tcdClearIvs();
            $tcd.style.transition = `opacity ${fade}ms ease`; $tcd.style.opacity = '0';
            $svg.style.transition = $flowers.style.transition = `opacity ${fade}ms ease`;
            $svg.style.opacity = $flowers.style.opacity = '0';
        }, total - fade);
        // 8) kết thúc: render trạng thái mới (server đã xóa cây) + gỡ char
        tcdT(() => tcdFinalize(), total + 180);
    }

    const socket = io({ transports: ['websocket', 'polling'] });
    socket.on('connect', () => {
        socket.emit('subscribe', 'overlay');
        fetch('/api/games/trongcay/config').then(r => r.json()).then(applyConfig).catch(() => {});
        fetch('/api/games/trongcay/livestate').then(r => r.json()).then(s => { state = s || state; render(); }).catch(() => {});
    });
    socket.on('trongcay:state', s => { state = s || state; render(); });
    socket.on('trongcay:butterfly', b => { spawnButterfly(b); sfx('butterfly'); });
    socket.on('trongcay:bee', b => { spawnBee(b); sfx('butterfly'); });
    socket.on('trongcay:beeharvest', d => { beeHarvestPop(d); sfx('grow'); });
    socket.on('trongcay:fruitdrop', d => { fruitDropFx(d); });
    socket.on('trongcay:catbite', d => { catBiteFx(d); });
    socket.on('trongcay:pupate', d => { playPupate(d); });
    socket.on('trongcay:evolve', d => { playEvolve(d); });
    socket.on('trongcay:spray', d => { playSpray(d); });
    socket.on('trongcay:dragon', d => { playDragon(d); });
    socket.on('trongcay:water', data => { triggerRain(); sfx('water'); });
    socket.on('trongcay:sun', data => { triggerSun(); sfx('sun'); });
    socket.on('trongcay:cut', data => { playCut(data); });   // tiếng cut phát ở lúc snip (trong playCut)
    socket.on('trongcay:grow', data => { sfx('grow'); growPop(data); });
    socket.on('trongcay:treelock', data => {   // 🔒 tạm dừng / 🌳 kích hoạt cây của 1 viewer (mỗi quà kích hoạt = 1 cây)
        const name = (data && data.nickname) ? data.nickname : 'Khán giả';
        if (data && data.locked) showBanner('🔒 ' + name + ' tạm dừng chăm cây', false);
        else showBanner('🌳 ' + name + ' kích hoạt cây!', false);
    });
    socket.on('trongcay:milestone', data => {
        if (config.display.showMilestones === false) return;
        sfx('milestone');
        showBanner('🎉 Cây đạt ' + data.percent + '%!', data.percent >= 100);
        confettiBurst(data.percent >= 100 ? 80 : 42);
    });
    socket.on('trongcay:bloom', () => { sfx('milestone'); bloomBurst(); });
    socket.on('trongcay:fruit', data => {
        // Cây chạm 100% → kết trái tại chỗ (cây KHÔNG biến mất). Lần đầu chín = ăn mừng to,
        // những lần tặng tiếp = rung cây cho rụng thêm trái.
        sfx('harvest');
        fruitBurst(data);
        if (data && data.first && config.display.showMilestones !== false) {
            bloomBurst();
            confettiBurst(56);
            showBanner('🍎 Cây kết trái! +' + (Number(data.gained) || 3), true);
        }
    });
    socket.on('gameConfig', ({ gameId, config: cfg }) => { if (gameId === 'trongcay') applyConfig(cfg); });
    socket.on('gameDisabled', ({ gameId }) => { if (gameId === 'trongcay') document.body.classList.add('tc-stopped'); });
    socket.on('overlay:reload', data => { if (!data || !data.gameId || data.gameId === 'trongcay') location.reload(); });

    if (isEdit) {
        let drag = null;
        $garden.style.pointerEvents = 'auto';
        $garden.addEventListener('mousedown', e => {
            const d = config.display || {};
            drag = { sx: e.clientX, sy: e.clientY, x: Number(d.gardenXPercent) || 50, y: Number(d.gardenYPercent) || 82 };
            e.preventDefault();
        });
        window.addEventListener('mousemove', e => {
            if (!drag) return;
            const nx = clamp(drag.x + (e.clientX - drag.sx) / innerWidth * 100, 0, 100);
            const ny = clamp(drag.y + (e.clientY - drag.sy) / innerHeight * 100, 0, 100);
            config.display.gardenXPercent = nx; config.display.gardenYPercent = ny; applyConfig(config);
        });
        window.addEventListener('mouseup', async () => { if (!drag) return; drag = null; await saveConfig(); });
        $garden.addEventListener('wheel', e => {
            e.preventDefault();
            config.display.scale = clamp((Number(config.display.scale) || 100) + (e.deltaY < 0 ? 5 : -5), 35, 220);
            applyConfig(config);
            clearTimeout($garden._saveT); $garden._saveT = setTimeout(saveConfig, 350);
        }, { passive: false });
    }
    async function saveConfig() {
        try { await fetch('/api/games/trongcay/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(config) }); } catch (e) {}
    }
})();
</script>
