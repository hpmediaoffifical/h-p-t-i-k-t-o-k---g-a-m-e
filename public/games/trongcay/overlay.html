<!doctype html>
<html lang="vi">
<head>
    <script src="/lib/overlay-resolution.js"></script>
    <meta charset="utf-8" />
    <title>HP Trồng Cây — Overlay</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
        body.tc-stopped:not(.tc-edit) .tc-root { display: none; }
        /* Vườn trống: chỉ ẩn lớp cây/hoa/bướm + bảng trạng thái. GIỮ .tc-soil (mặt đất)
           luôn hiển thị để User nhìn ra ngay đây là khu vườn, dù chưa có cây nào. */
        body.tc-empty:not(.tc-edit) .tc-svg,
        body.tc-empty:not(.tc-edit) .tc-flower-layer,
        body.tc-empty:not(.tc-edit) .tc-butterfly-layer,
        body.tc-empty:not(.tc-edit) .tc-status { opacity: 0; }
        .tc-root { position: fixed; inset: 0; pointer-events: none; }
        .tc-weather { position: fixed; inset: 0; opacity: 0; transition: opacity 500ms ease; z-index: 2; overflow: hidden; }
        .tc-weather.sunny { opacity: .9; background: radial-gradient(circle at 80% 12%, rgba(255,230,90,.55), rgba(255,180,80,.12) 18%, transparent 42%); }
        .tc-weather.rain { opacity: 1; }
        .tc-weather.cutting { opacity: 1; }
        .tc-rain-drop { position: absolute; top: -12vh; width: var(--w, 3px); height: var(--h, 42px); border-radius: 999px; background: linear-gradient(180deg, rgba(205,246,255,0) 0%, rgba(150,226,255,.55) 42%, rgba(212,247,255,.98) 100%); transform: rotate(8deg); filter: drop-shadow(0 0 4px rgba(120,220,255,.6)); animation: tc-rain-drop var(--dur, 2s) linear forwards; }
        @keyframes tc-rain-drop { to { transform: translate(-20px, 134vh) rotate(8deg); } }
        /* tia nước bắn nhẹ khi hạt chạm đất — bán kính nhỏ, mờ, để rất thật */
        .tc-rain-splash { position: absolute; width: var(--s, 16px); height: calc(var(--s, 16px) * .5); border: 2px solid rgba(190,238,255,.8); border-bottom: none; border-radius: 999px 999px 0 0; opacity: 0; transform: translate(-50%, -50%) scale(.4); animation: tc-rain-splash .5s ease-out forwards; }
        @keyframes tc-rain-splash { 0% { opacity: .85; transform: translate(-50%, -50%) scale(.3); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.25); } }
        .tc-scissor { position: absolute; left: var(--x); top: var(--y); font-size: var(--s, 58px); filter: drop-shadow(0 5px 7px rgba(0,0,0,.65)); transform-origin: 50% 50%; animation: tc-scissor-move 2.4s ease-in-out forwards; }
        .tc-scissor::after { content: ''; position: absolute; left: 50%; top: 50%; width: 60px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.85); box-shadow: 0 0 8px rgba(255,255,255,.7); transform: translate(-50%, -50%) rotate(-13deg) scaleX(0); animation: tc-cut-mark 2.4s ease-out forwards; }
        /* Kéo bay vào → LIA QUA LẠI ~4 vòng → phình to → SNIP cắt → bay ra */
        @keyframes tc-scissor-move {
            0%   { opacity: 0; transform: translate(-80px, -26px) rotate(-30deg) scale(.7); }
            10%  { opacity: 1; transform: translate(-22px, 0) rotate(-16deg) scale(1); }
            22%  { transform: translate(22px, -2px) rotate(18deg) scale(1); }
            34%  { transform: translate(-22px, 2px) rotate(-18deg) scale(1); }
            46%  { transform: translate(22px, -2px) rotate(18deg) scale(1); }
            58%  { transform: translate(-22px, 2px) rotate(-18deg) scale(1); }
            68%  { transform: translate(0, 0) rotate(0deg) scale(1.2); }
            76%  { transform: translate(3px, -4px) rotate(-15deg) scale(1.26); }
            82%  { transform: translate(0, 1px) rotate(7deg) scale(1.04); }
            100% { opacity: 0; transform: translate(36px, 16px) rotate(24deg) scale(.82); }
        }
        @keyframes tc-cut-mark { 0%, 70% { opacity: 1; transform: translate(-50%, -50%) rotate(-13deg) scaleX(0); } 78% { transform: translate(-50%, -50%) rotate(-13deg) scaleX(1); } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(-13deg) scaleX(1); } }

        .tc-garden { position: fixed; left: 50%; top: 82%; width: 980px; height: 1200px; transform: translate(-50%, -100%) scale(1); transform-origin: 50% 100%; z-index: 8; transition: left .25s ease, top .25s ease, transform .25s ease, filter .7s ease; }
        .tc-garden.wilt { filter: sepia(.8) saturate(.7) brightness(.86); }
        /* 🌍 Vùng đất 3D — mô đất có khối: mặt cỏ trên + thân đất lộ mặt cắt + đá/sỏi + cỏ đu đưa */
        /* z-index:-1 → mô đất nằm SAU lớp cây/vật (#tc-svg) nên trái rụng & xác sâu hiện TRÊN mặt đất, không bị che. */
        .tc-soil { position: absolute; left: -3%; right: -3%; bottom: 0; height: 184px; pointer-events: none; z-index: -1; }
        .tc-soil > svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 7px 11px rgba(0,0,0,.3)); }
        .tc-blade { fill: none; stroke: url(#tc-blade-grad); stroke-width: 3; stroke-linecap: round; }
        .tc-blade.thin { stroke-width: 2.4; }
        .tc-tuft { transform-box: fill-box; transform-origin: 50% 100%; animation: tc-blade-sway 3.8s ease-in-out infinite alternate; will-change: transform; }
        @keyframes tc-blade-sway { from { transform: rotate(-3.5deg); } to { transform: rotate(3.5deg); } }
        .tc-garden.wilt .tc-blade { stroke: #9a8a3c; }
        /* cỏ + bóng ôm gốc mỗi cây → cây "cắm" vào mặt đất ở mọi độ sâu */
        .tc-baseblade { fill: none; stroke: #56b045; stroke-width: 3; stroke-linecap: round; }
        .tc-plant.wilt .tc-baseblade, .tc-garden.wilt .tc-baseblade { stroke: #9a8a3c; }
        .tc-base-shadow { fill: rgba(26,15,6,.3); }
        /* Đu đưa nhẹ đặt trên LỚP CỐ ĐỊNH (svg/flower-layer) — KHÔNG đặt trên cây/lá/icon vì
           chúng bị vẽ lại mỗi ~0.3s khiến animation restart → giật/khựng. Lớp cố định không bị
           vẽ lại nên đu đưa LIÊN TỤC, mượt qua lại nhẹ nhàng. */
        .tc-svg { position: absolute; inset: 0; overflow: visible; transform-origin: 50% 100%; animation: tc-garden-sway 6s ease-in-out infinite alternate; will-change: transform; }
        .tc-plant { transform-box: fill-box; transform-origin: 50% 100%; }
        .tc-stem { fill: none; stroke: #31a64c; stroke-width: 7; stroke-linecap: round; filter: drop-shadow(0 2px 1px rgba(0,0,0,.35)); }
        .tc-stem.alt { stroke: #43be5f; stroke-width: 5; }
        .tc-leaf { filter: drop-shadow(0 2px 1px rgba(0,0,0,.28)); }
        .tc-leaf-sway { transform-box: fill-box; transform-origin: 12% 50%; }
        .tc-leaf-shape { fill: url(#tc-leaf-grad); stroke: rgba(20,120,46,.52); stroke-width: 1.4; }
        .tc-leaf-vein { fill: none; stroke: rgba(230,255,218,.58); stroke-width: 1.7; stroke-linecap: round; }
        .tc-leaf-vein.sub { stroke-width: 1.15; opacity: .72; }
        .tc-leaf:nth-child(2n) { animation-delay: -.8s; }
        .tc-garden.wilt .tc-stem { stroke: #669a4a; }
        .tc-garden.wilt .tc-leaf-shape { fill: #9a8d46; stroke: rgba(100,82,28,.6); }
        .tc-garden.wilt .tc-leaf-vein { stroke: rgba(255,238,160,.45); }
        .tc-plant.wilt .tc-stem { stroke: #6d8f45; }
        .tc-plant.wilt .tc-leaf-shape { fill: #9a8d46; stroke: rgba(100,82,28,.6); }
        .tc-plant.wilt .tc-leaf-vein { stroke: rgba(255,238,160,.45); }
        @keyframes tc-garden-sway { from { transform: rotate(-1.25deg); } to { transform: rotate(1.25deg); } }

        .tc-flower-layer, .tc-butterfly-layer { position: absolute; inset: 0; z-index: 14; overflow: visible; }
        /* Lớp icon quà đu đưa CÙNG nhịp với cây (lớp cố định → mượt, icon dính trên ngọn). */
        .tc-flower-layer { transform-origin: 50% 100%; animation: tc-garden-sway 6s ease-in-out infinite alternate; will-change: transform; }
        .tc-flower { position: absolute; width: var(--s, 58px); height: var(--s, 58px); transform: translate(-50%, -50%) rotate(var(--r, 0deg)); transform-origin: 50% 64%; filter: drop-shadow(0 4px 4px rgba(0,0,0,.55)) drop-shadow(0 0 8px rgba(255,255,255,.28)); border-radius: 20%; object-fit: contain; transition: width .6s ease, height .6s ease, left .5s ease, top .5s ease; }
        .tc-garden.wilt .tc-flower { filter: sepia(.8) brightness(.86) drop-shadow(0 3px 4px rgba(0,0,0,.45)); opacity: .82; }

        .tc-butterfly { position: absolute; left: var(--from-x); top: var(--from-y); width: 104px; height: 104px; animation: tc-fly var(--dur, 3s) cubic-bezier(.16,.9,.34,1) forwards; z-index: 25; }
        .tc-butterfly.perched { left: var(--to-x); top: var(--to-y); animation: tc-wander 9s ease-in-out infinite; }
        .tc-butterfly-inner { position: relative; width: 100%; height: 100%; animation: tc-bob .72s ease-in-out infinite alternate; }
        /* 🦋 Bướm SVG: cánh to + cong, vỗ cánh; râu phát sáng */
        .tc-bf-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 3px 5px rgba(0,0,0,.45)) drop-shadow(0 0 var(--bf-aura, 3px) var(--bf-glow, rgba(255,140,220,.5))) saturate(var(--bf-sat, 1)) brightness(var(--bf-bri, 1)); }
        .tc-bf-wing { stroke: rgba(255,255,255,.7); stroke-width: 1.6; filter: drop-shadow(0 0 6px var(--bf-glow, rgba(255,140,220,.65))); }
        .tc-bf-wL, .tc-bf-wR { transform-box: view-box; transform-origin: 60px 62px; animation: tc-bf-flap .19s ease-in-out infinite alternate; }
        .tc-bf-body { fill: #3a2a1f; }
        .tc-bf-ant { fill: #fff3a0; }
        .tc-bf-ant path { fill: none; stroke: #ffe14d; stroke-width: 2.6; stroke-linecap: round; }
        .tc-bf-ant { filter: drop-shadow(0 0 5px rgba(255,238,110,.95)) drop-shadow(0 0 9px rgba(255,220,60,.7)); animation: tc-bf-antglow 1.3s ease-in-out infinite alternate; }
        @keyframes tc-bf-flap { from { transform: scaleX(1); } to { transform: scaleX(.46); } }
        @keyframes tc-bf-antglow { from { opacity: .8; } to { opacity: 1; } }
        .tc-avatar { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; border-radius: 50%; transform: translate(-50%, -50%); border: 3px solid #fff; object-fit: cover; box-shadow: 0 4px 12px rgba(0,0,0,.6); background: #ff7ab8; }
        /* 🌱 Chủ cây: dây leo buông từ ngọn + huy hiệu avatar (như ảnh 1) — phân biệt cây của từng viewer */
        .tc-owner { position: absolute; z-index: 18; pointer-events: none; will-change: transform; }
        .tc-owner-crown { position: absolute; left: 0; top: 0; transform: translate(-50%, -118%); font-size: calc(30px * var(--s, 1)); filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); animation: tc-owner-sway 3.4s ease-in-out infinite alternate; transform-origin: 50% 120%; }
        .tc-owner-vine { position: absolute; left: 0; top: 0; overflow: visible; }
        .tc-owner-vine path { fill: none; stroke: #2fa44a; stroke-width: calc(5px * var(--s, 1)); stroke-linecap: round; filter: drop-shadow(0 1px 1px rgba(0,0,0,.45)); }
        .tc-owner-medal { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: calc(4px * var(--s, 1)); animation: tc-owner-swing 3.2s ease-in-out infinite alternate; transform-origin: 50% calc(-90px * var(--s, 1)); }
        .tc-owner-ring { width: calc(58px * var(--s, 1)); height: calc(58px * var(--s, 1)); border-radius: 50%; padding: calc(3px * var(--s, 1)); background: conic-gradient(from 0deg, #ff5a4d, #ffd23a, #44d860, #36b9ff, #ff5a4d); box-shadow: 0 5px 14px rgba(0,0,0,.55); }
        .tc-owner-ava { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: calc(2px * var(--s, 1)) solid #fff; background: #2a5a3a; display: block; }
        .tc-owner-ava.ph { display: flex; align-items: center; justify-content: center; font-size: calc(26px * var(--s, 1)); font-weight: 900; color: #fff; background: linear-gradient(135deg,#3aa657,#1f8f5f); box-sizing: border-box; }
        .tc-owner-ring { position: relative; }
        .tc-owner-lock { position: absolute; right: calc(-6px * var(--s,1)); bottom: calc(-4px * var(--s,1)); font-size: calc(22px * var(--s,1)); filter: drop-shadow(0 2px 2px rgba(0,0,0,.6)); }
        .tc-owner.locked .tc-owner-ring { filter: grayscale(.5) brightness(.82); }
        .tc-owner.locked .tc-owner-vine path { stroke: #8a8a8a; stroke-dasharray: 7 6; }
        .tc-owner-name { max-width: calc(140px * var(--s, 1)); padding: calc(2px * var(--s,1)) calc(8px * var(--s,1)); border-radius: 999px; color: #fff; background: rgba(0,0,0,.62); font-size: calc(16px * var(--s, 1)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px #000; }
        @keyframes tc-owner-swing { from { transform: translate(-50%, -50%) rotate(-5deg); } to { transform: translate(-50%, -50%) rotate(5deg); } }
        @keyframes tc-owner-sway { from { transform: translate(-50%, -118%) rotate(-4deg); } to { transform: translate(-50%, -118%) rotate(4deg); } }
        .tc-garden.wilt .tc-owner-vine path { stroke: #9a8a3c; }
        /* Tên nằm DƯỚI avatar (không đè) — cách tâm xuống một đoạn cố định */
        .tc-bname { position: absolute; top: calc(50% + 36px); left: 50%; transform: translateX(-50%); max-width: 150px; padding: 3px 8px; border-radius: 999px; color: #fff; background: rgba(0,0,0,.6); font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px #000; }
        @keyframes tc-fly { 0% { left: var(--from-x); top: var(--from-y); transform: scale(.68) rotate(-8deg); } 55% { left: var(--mid-x); top: var(--mid-y); transform: scale(1.04) rotate(8deg); } 100% { left: var(--to-x); top: var(--to-y); transform: scale(.78) rotate(0deg); } }
        @keyframes tc-bob { to { transform: translateY(-7px) rotate(2deg); } }
        @keyframes tc-wander { 0%, 100% { transform: translate(-4px, 0) scale(.78) rotate(-2deg); } 18% { transform: translate(18px, -18px) scale(.86) rotate(8deg); } 36% { transform: translate(-24px, -9px) scale(.8) rotate(-7deg); } 58% { transform: translate(12px, 15px) scale(.76) rotate(4deg); } 78% { transform: translate(-14px, 9px) scale(.82) rotate(-5deg); } }

        /* 🐝 Ong thợ đi hái trái — bay vào cây chín, đậu hái trái rồi mang đi */
        .tc-bee { position: absolute; left: var(--from-x); top: var(--from-y); width: 56px; height: 56px; animation: tc-fly var(--dur, 2600ms) cubic-bezier(.16,.9,.34,1) forwards; z-index: 27; }
        .tc-bee.arrived { left: var(--to-x); top: var(--to-y); animation: tc-bee-hover .55s ease-in-out infinite alternate; transition: left 2.2s ease-in, top 2.2s ease-in, opacity 2.2s ease-in; }
        .tc-bee-inner { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 38px; filter: drop-shadow(0 3px 5px rgba(0,0,0,.5)); animation: tc-bob .42s ease-in-out infinite alternate; }
        .tc-bee-ava { position: absolute; left: 50%; top: -8px; transform: translateX(-50%); width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; background: #ffce54; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
        .tc-bee-load { position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%) scale(0); width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 38% 34%, #ff9a6b, #d8362a); box-shadow: 0 2px 3px rgba(0,0,0,.45); transition: transform .25s ease; }
        .tc-bee.loaded .tc-bee-load { transform: translateX(-50%) scale(1); }
        @keyframes tc-bee-hover { 0% { transform: translate(-4px, 0) rotate(-5deg); } 100% { transform: translate(5px, -7px) rotate(5deg); } }

        /* 🐛 Sâu xanh ăn lá + xác sâu + vùng được bảo vệ (xịt thuốc) */
        .tc-cat { filter: drop-shadow(0 0 7px rgba(190,255,90,.95)) drop-shadow(0 0 14px rgba(150,240,70,.5)) drop-shadow(0 3px 4px rgba(0,0,0,.55)); }
        .tc-cat.dying { opacity: .35; filter: grayscale(.6) drop-shadow(0 3px 4px rgba(0,0,0,.4)); }
        .tc-corpse { filter: grayscale(.5) drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
        .tc-shield { fill: rgba(120,235,170,.07); stroke: rgba(150,245,195,.42); stroke-width: 2.5; stroke-dasharray: 10 9; }
        /* 🐛→🦋 Kén (nhộng) nằm dưới đất — pod ngọc lục viền vàng, sắp nở thì phát sáng (glow đặt inline theo thời gian) */
        .tc-pupa-body { fill: url(#tc-pupa-grad); stroke: #caa23a; stroke-width: 1.6; }
        .tc-pupa-seg { fill: none; stroke: rgba(70,50,18,.5); stroke-width: 1.2; stroke-linecap: round; }
        .tc-pupa-dot { fill: #ffe79a; }
        .tc-pupa-silk { fill: none; stroke: rgba(255,255,255,.5); stroke-width: 1.2; }
        /* 🐛 Sâu rơi xuống đất để hóa nhộng (dùng lại nhịp rơi của trái) */
        .tc-pupa-drop { position: fixed; font-size: 26px; line-height: 1; transform: translate(-50%, -50%); top: var(--y0); pointer-events: none; z-index: 34; animation: tc-fruit-drop .9s cubic-bezier(.5,0,.85,.9) forwards; }
        /* ✨ Kén nở: lóe sáng tại chỗ */
        .tc-evolve-flash { position: fixed; width: 120px; height: 120px; border-radius: 50%; transform: translate(-50%, -50%) scale(.3); pointer-events: none; z-index: 35; background: radial-gradient(circle, rgba(180,255,210,.95), rgba(90,240,170,.35) 45%, rgba(90,240,170,0) 70%); animation: tc-evolve-flash .85s ease-out forwards; }
        @keyframes tc-evolve-flash { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.3); } 25% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.7); } }
        /* 🦋 Bướm TIẾN HÓA: hào quang ngọc lục mạnh để dễ nhận biết */
        .tc-butterfly.evolved .tc-bf-svg { filter: drop-shadow(0 3px 5px rgba(0,0,0,.4)) drop-shadow(0 0 16px rgba(70,255,175,.95)) saturate(1.2) brightness(1.08); }
        /* 🧴 Bình xịt + sương thuốc */
        .tc-sprayer { position: fixed; transform: translate(-50%, -50%) rotate(var(--rot, -25deg)); font-size: 54px; filter: drop-shadow(0 5px 7px rgba(0,0,0,.6)); pointer-events: none; z-index: 39; animation: tc-sprayer .9s ease-out; }
        /* Nghiêng vòi theo --rot (chĩa vào con sâu) + giật nhẹ khi bóp xịt cho thật. */
        @keyframes tc-sprayer { 0% { opacity: 0; transform: translate(-50%,-50%) rotate(calc(var(--rot,-25deg) - 26deg)) scale(.7); } 25% { opacity: 1; transform: translate(-50%,-50%) rotate(var(--rot,-25deg)) scale(1); } 70% { transform: translate(-50%,-50%) rotate(calc(var(--rot,-25deg) - 6deg)) scale(1); } 100% { opacity: 0; transform: translate(-50%,-50%) rotate(calc(var(--rot,-25deg) + 4deg)) scale(.95); } }
        /* 🍃 Lá bị kéo cắt rơi rụng (xoay + héo nâu dần khi rơi) */
        .tc-cutleaf { position: fixed; font-size: var(--s, 26px); line-height: 1; transform: translate(-50%, -50%); pointer-events: none; z-index: 37; animation: tc-cutleaf var(--dur, 1.8s) cubic-bezier(.3,.12,.6,1) forwards; }
        @keyframes tc-cutleaf {
            0% { opacity: 0; transform: translate(-50%, -50%) rotate(0) scale(.6); filter: none; }
            14% { opacity: 1; transform: translate(-50%, -50%) rotate(24deg) scale(1); }
            60% { filter: sepia(.55) saturate(.85) brightness(.9); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), var(--fall, 220px)) rotate(var(--spin, 380deg)) scale(.85); filter: sepia(.95) saturate(.55) brightness(.78); }
        }
        /* 🦋💚 Bướm chữa lành cây yếu: cánh ánh xanh + đốm lành rơi lên cây */
        .tc-butterfly.heal .tc-bf-svg { filter: drop-shadow(0 3px 5px rgba(0,0,0,.4)) drop-shadow(0 0 12px rgba(120,255,170,.9)) saturate(1.1) brightness(1.05); }
        .tc-heal-mote { position: fixed; font-size: var(--s, 18px); line-height: 1; transform: translate(-50%, -50%); pointer-events: none; z-index: 36; animation: tc-heal-mote var(--dur, 1.5s) ease-out forwards; }
        @keyframes tc-heal-mote { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 22% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% - var(--rise, 60px))) scale(1); } }
        .tc-mist { position: fixed; width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle, rgba(205,255,225,.92), rgba(150,235,190,.15)); transform: translate(-50%, -50%); pointer-events: none; z-index: 38; animation: tc-mist .9s ease-out forwards; }
        @keyframes tc-mist { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.4); } 20% { opacity: .9; } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 60px))) scale(1.5); } }
        .tc-crumb { position: fixed; width: 7px; height: 7px; border-radius: 1px; background: #6fbf3a; transform: translate(-50%, -50%) rotate(20deg); pointer-events: none; z-index: 33; animation: tc-crumb .7s ease-out forwards; }
        @keyframes tc-crumb { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 30px))) rotate(120deg); } }

        .tc-status { position: fixed; left: 28px; bottom: 30px; min-width: 230px; padding: 14px 16px; border-radius: 22px; background: rgba(9, 22, 15, .64); color: #fff; z-index: 30; backdrop-filter: blur(8px); box-shadow: 0 8px 30px rgba(0,0,0,.35); font-weight: 800; text-shadow: 0 2px 3px #000; }
        .tc-status-row { display: grid; grid-template-columns: 72px 1fr 42px; gap: 8px; align-items: center; margin: 6px 0; font-size: 16px; }
        .tc-bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; }
        .tc-fill { height: 100%; width: 0%; border-radius: inherit; transition: width .35s ease; }
        .tc-fill.height { background: linear-gradient(90deg,#44d860,#b5ff78); }
        .tc-fill.water { background: linear-gradient(90deg,#36b9ff,#92efff); }
        .tc-fill.sun { background: linear-gradient(90deg,#ffd53b,#ff8b37); }
        .tc-fill.wilt { background: linear-gradient(90deg,#b48435,#69401f); }

        /* 🏆 Top người chăm cây */
        .tc-top { position: fixed; right: 24px; top: 24px; min-width: 214px; padding: 12px 14px; border-radius: 18px; background: rgba(9,22,15,.62); color: #fff; z-index: 30; backdrop-filter: blur(8px); box-shadow: 0 8px 30px rgba(0,0,0,.35); text-shadow: 0 2px 3px #000; }
        .tc-top.empty { display: none; }
        .tc-top h4 { font-size: 16px; margin-bottom: 8px; color: #aeffba; display: flex; gap: 6px; align-items: center; font-weight: 900; }
        .tc-top-row { display: grid; grid-template-columns: 22px 34px 1fr auto; gap: 8px; align-items: center; margin: 7px 0; font-size: 15px; }
        .tc-top-rank { font-weight: 900; text-align: center; font-size: 17px; }
        .tc-top-ava { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,.5); background: #2a5a3a; }
        .tc-top-ava.ph { display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; color: #fff; }
        .tc-top-name { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
        .tc-top-score { color: #ffd76b; font-weight: 800; font-size: 13px; }
        .tc-harvest { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.14); font-size: 13px; color: #cfe9d2; }

        /* 🎯 Banner mốc / thu hoạch + confetti */
        .tc-banner-layer { position: fixed; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; }
        .tc-banner { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(.6); padding: 16px 30px; border-radius: 999px; font-size: 34px; font-weight: 900; color: #fff; white-space: nowrap; text-shadow: 0 3px 8px rgba(0,0,0,.6); background: linear-gradient(135deg, rgba(86,217,108,.95), rgba(34,160,90,.9)); box-shadow: 0 10px 40px rgba(0,0,0,.45); opacity: 0; animation: tc-banner-pop 2.6s ease forwards; }
        .tc-banner.gold { background: linear-gradient(135deg, rgba(255,210,80,.96), rgba(255,150,40,.92)); }
        @keyframes tc-banner-pop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); } 14% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); } 26% { transform: translate(-50%,-50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-58%) scale(.96); } }
        .tc-confetti { position: absolute; top: -6vh; width: 12px; height: 16px; border-radius: 2px; opacity: .95; animation: tc-confetti-fall var(--dur, 2.8s) linear forwards; }
        @keyframes tc-confetti-fall { to { transform: translateY(118vh) rotate(720deg); opacity: .2; } }

        /* 🌸 Bùng nở hoa khi thu hoạch */
        .tc-bloom { position: absolute; left: 0; top: 0; font-size: var(--s, 46px); line-height: 1; transform: translate(-50%, -50%) scale(0); animation: tc-bloom-pop 1.9s ease forwards; }
        @keyframes tc-bloom-pop { 0% { transform: translate(-50%,-50%) scale(0) rotate(0); } 42% { transform: translate(-50%,-50%) scale(1.18) rotate(18deg); } 100% { transform: translate(-50%,-50%) scale(1) rotate(0); opacity: .85; } }

        /* 🌱 +Tên nổi lên khi quà làm cây cao */
        .tc-grow-pop { position: absolute; transform: translate(-50%, -50%); color: #dfffe3; font-weight: 900; font-size: 20px; text-shadow: 0 2px 4px #000; white-space: nowrap; pointer-events: none; z-index: 36; animation: tc-grow-pop 1.6s ease forwards; }
        @keyframes tc-grow-pop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.7); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-160%) scale(1); } }

        /* 🍎 Kết trái tại chỗ — trái treo trên cây đã chín (cây không bao giờ biến mất) */
        .tc-fruit-body { fill: url(#tc-fruit-grad); stroke: rgba(120,20,15,.55); stroke-width: 1.4; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
        .tc-fruit-stem { stroke: #6b4a2b; stroke-width: 3; fill: none; stroke-linecap: round; }
        .tc-fruit-shine { fill: rgba(255,255,255,.6); }
        /* Trái tĩnh treo trên cây: KHÔNG animation entrance — vì SVG được vẽ lại mỗi ~500ms
           (state tick), nếu để pop sẽ bị restart liên tục và không bao giờ hiện đủ to.
           Hiệu ứng "bung trái" đã do tc-fruit-fall (event) lo. */
        .tc-fruit { transform-box: fill-box; }
        /* Cây chín: lá ngả vàng + ánh hào quang ấm */
        .tc-plant.ripe .tc-leaf-shape { fill: #8fd96b; filter: saturate(1.1) drop-shadow(0 0 7px rgba(255,206,84,.55)); }
        .tc-plant.ripe .tc-stem { filter: drop-shadow(0 0 6px rgba(255,206,84,.4)); }
        /* 🌈 Cây TEAM (nhiều người góp): hào quang cầu vồng nổi bật */
        .tc-plant.team { filter: drop-shadow(0 0 5px rgba(255,95,163,.85)) drop-shadow(0 0 11px rgba(255,210,74,.6)) drop-shadow(0 0 18px rgba(66,185,255,.55)); }
        /* 🍎 Trái nằm dưới đất (rụng khi cây héo) + bóng đổ */
        .tc-ground-shadow { fill: rgba(0,0,0,.32); }
        /* 🍎 Trái rụng xuống đất (animation rơi từ tán xuống) */
        .tc-fruit-drop { position: fixed; font-size: 30px; line-height: 1; transform: translate(-50%, -50%); top: var(--y0); pointer-events: none; z-index: 31; animation: tc-fruit-drop .9s cubic-bezier(.5,0,.85,.9) forwards; }
        @keyframes tc-fruit-drop { 0% { top: var(--y0); opacity: 0; } 14% { opacity: 1; } 88% { top: var(--y1); } 100% { top: var(--y1); opacity: 1; } }
        /* 🍎 Trái rụng/ăn mừng khi rung cây */
        .tc-fruit-fall { position: fixed; font-size: var(--s, 30px); line-height: 1; transform: translate(-50%, -50%); pointer-events: none; z-index: 32; animation: tc-fruit-fall 1.6s ease-in forwards; }
        @keyframes tc-fruit-fall { 0% { opacity: 0; transform: translate(-50%, -90%) scale(.5); } 18% { opacity: 1; transform: translate(-50%, -115%) scale(1.12); } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), 70%) scale(.9) rotate(40deg); } }

        /* ═══════════════════ 🐉 RỒNG LỬA THIÊU VƯỜN ═══════════════════ */
        .tcd-layer { position: fixed; inset: 0; z-index: 33; pointer-events: none; overflow: hidden; }
        /* Cây cháy đen: phủ filter tối-ấm lên cả vườn (cháy xém → tro). Transition do JS đặt = charMs. */
        .tc-garden.tcd-burning { filter: brightness(.09) sepia(.55) saturate(.7) contrast(1.25) !important; }
        .tc-garden.tcd-burning .tc-flower { filter: brightness(.12) saturate(.35) !important; opacity: .45 !important; }

        /* Con rồng (2 pose chồng lên nhau, đổi bằng opacity cho mượt) */
        .tcd-dragon { position: fixed; left: 118%; top: 18%; width: var(--tcd-size, 42vmin);
            transform: translate(-50%, -50%) scaleX(1); will-change: left, top, transform;
            filter: drop-shadow(0 10px 18px rgba(0,0,0,.55)) drop-shadow(0 0 24px rgba(255,110,30,.5));
            z-index: 35; }
        .tcd-dragon-inner { position: relative; width: 100%; animation: tcd-bob .5s ease-in-out infinite alternate; }
        @keyframes tcd-bob { from { transform: translateY(-2%) rotate(-1.2deg); } to { transform: translateY(2%) rotate(1.2deg); } }
        .tcd-dragon .tcd-pose { display: block; width: 100%; height: auto; }
        .tcd-dragon .tcd-breath { position: absolute; inset: 0; opacity: 0; transition: opacity .16s linear; }
        .tcd-dragon .tcd-fly { opacity: 1; transition: opacity .16s linear; }
        .tcd-dragon.is-breath .tcd-fly { opacity: 0; }
        .tcd-dragon.is-breath .tcd-breath { opacity: 1; }

        /* Ngọn lửa CSS bốc cháy tại gốc cây */
        .tcd-flame { position: fixed; transform: translate(-50%, -100%); transform-origin: 50% 100%;
            width: var(--fw, 70px); height: var(--fh, 150px);
            background: radial-gradient(ellipse 60% 52% at 50% 88%, #fff3c0 0%, #ffd23a 20%, #ff9020 44%, #ff3a14 68%, rgba(190,30,10,0) 84%);
            border-radius: 48% 48% 46% 46% / 62% 62% 38% 38%;
            filter: blur(.6px) drop-shadow(0 0 16px rgba(255,120,30,.75));
            animation: tcd-flick var(--ff, .42s) ease-in-out infinite alternate; }
        .tcd-flame.core { background: radial-gradient(ellipse 60% 52% at 50% 90%, #ffffff 0%, #fff0a0 30%, #ffb733 60%, rgba(255,140,40,0) 82%); filter: blur(.4px); }
        @keyframes tcd-flick {
            0%   { transform: translate(-50%, -100%) scaleY(.9)  scaleX(1.06) skewX(-4deg); }
            100% { transform: translate(-50%, -100%) scaleY(1.18) scaleX(.82) skewX(5deg); }
        }
        /* Luồng lửa rồng phun (ảnh PNG xoay theo hướng bay xuống tán cây) */
        .tcd-streak { position: fixed; width: var(--sw, 24vmin); transform: translate(-50%, -50%) rotate(var(--sr, 70deg));
            transform-origin: 50% 50%; opacity: 0; filter: drop-shadow(0 0 12px rgba(255,120,30,.6)); }
        .tcd-streak img { display: block; width: 100%; height: auto; }
        /* Khói đen bốc lên */
        .tcd-smoke { position: fixed; width: var(--kw, 90px); height: var(--kw, 90px); border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, rgba(58,54,50,.62), rgba(28,26,24,0) 70%);
            transform: translate(-50%, -50%) scale(.4); opacity: 0; animation: tcd-smoke var(--kd, 3.2s) ease-out forwards; }
        @keyframes tcd-smoke { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.4); } 18% { opacity: .5; } 100% { opacity: 0; transform: translate(calc(-50% + var(--kx,0px)), calc(-50% - var(--ky,220px))) scale(2.4); } }
        /* Tàn than bay lên */
        .tcd-ember { position: fixed; width: 6px; height: 6px; border-radius: 50%;
            background: radial-gradient(circle, #ffe79a, #ff7a1e 60%, rgba(255,90,20,0));
            transform: translate(-50%, -50%); opacity: 0; animation: tcd-ember var(--ed, 1.8s) ease-out forwards; }
        @keyframes tcd-ember { 0% { opacity: 0; transform: translate(-50%,-50%) scale(1); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--ex,0px)), calc(-50% - var(--ey,160px))) scale(.35); } }

        /* ═══════════════ 🪧 TRANG TRÍ KHU VƯỜN: bảng TOP 3, hàng rào, đồ sân vườn ═══════════════ */
        /* Đặt TRÊN lớp thân cây (#tc-svg z auto=0) nhưng DƯỚI icon quà (flower-layer z14) → bảng/hàng
           rào nằm trong cảnh, đọc rõ TOP 3, mà icon quà trên ngọn cây vẫn hiện trên cùng.
           Cùng viewBox 980×1200 + preserveAspectRatio như #tc-svg → toạ độ khớp mặt đất tuyệt đối. */
        .tc-decor { position: absolute; inset: 0; z-index: 12; pointer-events: none; overflow: visible; }
        .tc-decor svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; }
        .tc-decor.off { display: none; }                                  /* tắt toàn bộ trang trí */
        .tc-decor.no-board .tc-board, .tc-decor.no-board .tc-board-rows { display: none; }
        .tc-decor.no-fence .tc-fence { display: none; }
        .tc-decor.no-props .tc-props { display: none; }
        .tc-garden.wilt .tc-decor, .tc-garden.tcd-burning .tc-decor { filter: sepia(.65) saturate(.7) brightness(.8); }
        /* gỗ + nét */
        .tc-board-edge { fill: none; stroke: rgba(40,24,10,.55); stroke-width: 2; }
        .tc-plank-line { stroke: rgba(60,36,16,.4); stroke-width: 1.5; stroke-linecap: round; }
        .tc-board-ribbon-txt { fill: #fff7e6; font: 900 21px 'Segoe UI', Arial, sans-serif; letter-spacing: .3px; }
        .tc-board-name { fill: #fff; font: 800 19px 'Segoe UI', Arial, sans-serif; }
        .tc-board-score { fill: #ffd76b; font: 800 18px 'Segoe UI', Arial, sans-serif; }
        .tc-board-rank { font-size: 27px; }
        .tc-board-letter { fill: #fff; font: 900 18px 'Segoe UI', Arial, sans-serif; }
        .tc-board-empty { fill: rgba(255,248,230,.66); font: 700 19px 'Segoe UI', Arial, sans-serif; }
        .tc-pennant { transform-box: fill-box; transform-origin: 0 50%; animation: tc-pennant 2.4s ease-in-out infinite alternate; }
        @keyframes tc-pennant { from { transform: skewY(-4deg) scaleX(.97); } to { transform: skewY(5deg) scaleX(1); } }
        /* đồ sân vườn (emoji) đu đưa nhẹ — đặt trên lớp tĩnh nên không bị vẽ lại → mượt */
        .tc-prop { font-size: 34px; }
        .tc-prop-bob { transform-box: fill-box; transform-origin: 50% 100%; animation: tc-prop-bob 3.2s ease-in-out infinite alternate; will-change: transform; }
        @keyframes tc-prop-bob { from { transform: translateY(1px) rotate(-3deg); } to { transform: translateY(-3px) rotate(3deg); } }

        /* ═══════════════ 🐾 THÚ CƯNG SÂN VƯỜN ═══════════════ */
        /* Roam tự nhiên trên bãi cỏ: JS dời left%, lật scaleX theo hướng; CSS lo nhún chân/đuôi.
           Trong .tc-garden nên tự scale/di chuyển theo vườn. z giữa lớp trang trí (12) và icon quà (14). */
        .tc-pets { position: absolute; inset: 0; z-index: 13; pointer-events: none; overflow: visible; }
        .tc-pets.off { display: none; }
        #tc-pet-list { position: absolute; inset: 0; }
        .tc-pet { position: absolute; transform: translate(-50%, -100%); will-change: left; }
        .tc-pet-shadow { position: absolute; left: 50%; bottom: -3px; width: calc(var(--pw, 100px) * .62); height: calc(var(--pw, 100px) * .15); transform: translate(-50%, 0); background: radial-gradient(ellipse at center, rgba(0,0,0,.34), rgba(0,0,0,0) 70%); }
        .tc-pet-face { transform-origin: 50% 100%; transition: transform .14s ease; }
        .tc-pet-walk { transform-origin: 50% 100%; }
        .tc-pet svg, .tc-pet-media { display: block; width: var(--pw, 100px); height: auto; filter: drop-shadow(0 3px 4px rgba(0,0,0,.28)); }
        .tc-pet-media { border-radius: 10%; object-fit: contain; }
        .tc-garden.wilt .tc-pets, .tc-garden.tcd-burning .tc-pets { filter: sepia(.6) saturate(.7) brightness(.82); }
        /* nhún khi đi */
        .tc-pet.moving .tc-pet-walk { animation: tc-pet-bob .42s ease-in-out infinite; }
        @keyframes tc-pet-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5%); } }
        .tc-pet.hopper.moving .tc-pet-walk { animation: tc-pet-hop .52s ease-in-out infinite; }
        @keyframes tc-pet-hop { 0%, 100% { transform: translateY(0) scaleY(1); } 35% { transform: translateY(-26%) scaleY(1.05); } 70% { transform: translateY(0) scaleY(.94); } }
        /* 🐍 Rắn TRƯỜN: không nhảy — lắc thân ngang nhẹ (uốn) liên tục, không nhún dọc */
        .tc-pet.slither .tc-pet-walk { transform-origin: 50% 100%; animation: tc-pet-slither 1.15s ease-in-out infinite !important; }
        @keyframes tc-pet-slither { 0%, 100% { transform: translateX(-3%) skewX(-3deg); } 50% { transform: translateX(3%) skewX(3deg); } }
        /* chân bước xen kẽ */
        .tc-pet .leg { transform-box: fill-box; transform-origin: 50% 10%; }
        .tc-pet.moving .leg.a { animation: tc-leg-a .42s ease-in-out infinite; }
        .tc-pet.moving .leg.b { animation: tc-leg-b .42s ease-in-out infinite; }
        @keyframes tc-leg-a { 0%, 100% { transform: rotate(15deg); } 50% { transform: rotate(-15deg); } }
        @keyframes tc-leg-b { 0%, 100% { transform: rotate(-15deg); } 50% { transform: rotate(15deg); } }
        .tc-pet.hopper .leg { animation: none !important; }
        /* tai/đuôi đung đưa nhẹ liên tục */
        .tc-pet .wag { transform-box: fill-box; transform-origin: 50% 100%; animation: tc-pet-wag 1.3s ease-in-out infinite alternate; }
        @keyframes tc-pet-wag { from { transform: rotate(-7deg); } to { transform: rotate(8deg); } }
        /* 🐦 Con BAY: lượn trên không (không chạm đất) — bóng mờ phía dưới, thân bồng bềnh, cánh vỗ */
        .tc-pet.flyer .tc-pet-shadow { opacity: .16; bottom: -34px; width: calc(var(--pw, 100px) * .4); }
        .tc-pet.flyer .tc-pet-walk { animation: tc-pet-float 2.6s ease-in-out infinite !important; }
        @keyframes tc-pet-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14%); } }
        /* cánh dính vai (61,46 trong viewBox) — vỗ LÊN/XUỐNG quanh khớp vai */
        .tc-pet .flap { transform-box: view-box; transform-origin: 61px 46px; animation: tc-pet-flap .17s ease-in-out infinite alternate; }
        @keyframes tc-pet-flap { from { transform: rotate(-32deg); } to { transform: rotate(14deg); } }
        /* 🏆 Nhãn TÊN người TOP phía trên con vật — KHÔNG lật theo hướng đi (đặt ngoài .tc-pet-face) */
        .tc-pet-name { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, 0); margin-bottom: 3px; max-width: 150px; padding: 2px 9px; border-radius: 999px; background: rgba(8,20,12,.66); color: #fff; font: 800 16px 'Segoe UI', Arial, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px #000; box-shadow: 0 2px 7px rgba(0,0,0,.4); pointer-events: none; }
        .tc-pet.top .tc-pet-name::after { content: ''; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: rgba(8,20,12,.66); }
    </style>
</head>

<script>
(function () {
    'use strict';
    const isEdit = /[?&]edit=1\b/.test(location.search);
    if (isEdit) document.body.classList.add('tc-edit');
    const $garden = document.getElementById('tc-garden');
    const $svg = document.getElementById('tc-svg');
    const $flowers = document.getElementById('tc-flower-layer');
    const $butterflies = document.getElementById('tc-butterfly-layer');
    const $status = document.getElementById('tc-status');
    const $weather = document.getElementById('tc-weather');
    const $top = document.getElementById('tc-top');
    const $banner = document.getElementById('tc-banner');
    const $tcd = document.getElementById('tc-dragon');
    const $decor = document.getElementById('tc-decor');
    const $decorStatic = document.getElementById('tc-decor-static');
    const $decorRows = document.getElementById('tc-decor-rows');
    const $pets = document.getElementById('tc-pets');
    const $petList = document.getElementById('tc-pet-list');
    const svgDefs = `<defs><linearGradient id="tc-leaf-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#72e58a"/><stop offset="0.52" stop-color="#41c463"/><stop offset="1" stop-color="#199842"/></linearGradient><radialGradient id="tc-fruit-grad" cx="0.38" cy="0.34" r="0.75"><stop offset="0" stop-color="#ff9a6b"/><stop offset="0.55" stop-color="#ff5a4d"/><stop offset="1" stop-color="#c62828"/></radialGradient><radialGradient id="tc-cat-grad" cx="0.4" cy="0.28" r="0.85"><stop offset="0" stop-color="#f2ffae"/><stop offset="0.45" stop-color="#b6f24f"/><stop offset="1" stop-color="#5fc21f"/></radialGradient><radialGradient id="tc-cat-head" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#eaffb0"/><stop offset="1" stop-color="#6fc62a"/></radialGradient><clipPath id="tc-cat-head-clip"><circle cx="0" cy="0" r="18"/></clipPath><linearGradient id="tc-pupa-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bdf7c8"/><stop offset="0.5" stop-color="#4cc98a"/><stop offset="1" stop-color="#1f8f5f"/></linearGradient></defs>`;
    let config = window.HpGame.trongcay.defaultConfig();
    let state = { height: 0, water: 55, sun: 28, wilt: 0, flowers: [], sessionActive: false };
    let tcBurning = false;   // 🐉 đóng băng render trong lúc rồng thiêu (overlay tự lo hình)

    function clamp(v, lo, hi) { return window.HpGame.trongcay.clamp(v, lo, hi); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function stemMeta(index) {
        const count = clamp(parseInt(config.display.stemCount, 10) || 7, 1, 12);
        const i = clamp(parseInt(index, 10) || 0, 0, count - 1);
        const hBase = clamp(state.height || 0, 0, config.maxHeight || 100) / (config.maxHeight || 100);
        const cuts = state.stemCuts || {};
        const cut = clamp(Number(cuts[i]) || 0, 0, 95) / 100;
        const h = Math.max(0.001, hBase * (1 - cut));
        const wilt = clamp(state.wilt || 0, 0, 100) / 100;
        const t = count === 1 ? .5 : i / (count - 1);
        const baseX = 90 + t * 800;
        const mult = .62 + ((i * 37) % 43) / 100;
        let stemH = 90 + 850 * h * mult * tcHeightScale();
        let topY = 1120 - stemH + wilt * 120;
        const minTopY = tcMinTopY();   // giữ ngọn (icon quà) trong màn như nhánh per-plant
        if (topY < minTopY) { topY = minTopY; stemH = 1120 - topY + wilt * 120; }
        const sway = ((i % 2 ? -1 : 1) * (36 + i * 7)) + wilt * (i % 2 ? -120 : 120);
        const cx = baseX + sway;
        return { i, baseX, stemH, topY, sway, cx, cut };
    }
    function cubic(a, b, c, d, t) {
        const mt = 1 - t;
        return mt * mt * mt * a + 3 * mt * mt * t * b + 3 * mt * t * t * c + t * t * t * d;
    }
    function stemPoint(index, at) {
        const m = stemMeta(index);
        const safeT = clamp(Number(at) || .82, .08, Math.max(.1, 1 - m.cut * .82));
        return {
            x: cubic(m.baseX, m.baseX + m.sway * .2, m.cx, m.cx, safeT),
            y: cubic(1120, 900 - m.stemH * .08, m.topY + m.stemH * .38, m.topY, safeT),
            meta: m
        };
    }
    // ── CHIỀU SÂU TRÊN MẶT ĐẤT (đĩa cỏ elip) ──────────────────────────────
    // Mỗi cây/vật có 1 độ sâu d∈[0,1]: 0 = phía trong (xa, cao, nhỏ, vẽ trước),
    // 1 = phía trước (gần, thấp, to, vẽ sau). Nhờ đó cây rải khắp bề mặt → 3D thật,
    // không xếp 1 hàng ở viền. Độ sâu suy ra ỔN ĐỊNH từ leafSeed/id (không reset).
    const TC_GROUND_Y = 1120, TC_SURF_DY = 38;
    const TC_MATURE_FRAC = 0.42;   // 🌱 cây của viewer cao >= 42% trần = "trưởng thành, có tán lá" → buông dây + avatar chủ cây
    function tcFract(n) { n = n - Math.floor(n); return n < 0 ? n + 1 : n; }
    function tcHashDepth(key) {
        const s = String(key == null ? '' : key);
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
        return (h % 1000) / 1000;
    }
    function plantDepth(p) {
        const d = Number(p?.depth);
        if (d >= 0 && d <= 1) return d;
        const seed = Number(p?.leafSeed) || (String(p?.id || '').length * 7 + 3);
        return tcFract(seed * 0.61803398875);   // dãy vàng → rải đều, ít trùng
    }
    // Seed nguyên CỐ ĐỊNH cho mỗi cây (từ leafSeed/id, KHÔNG phụ thuộc thứ tự vẽ).
    // Dùng cho dáng lá (trái/phải), màu thân, nhịp đung đưa → cây mới mọc KHÔNG làm
    // cây đang có đổi lá/thân. Trước đây dùng index i sau khi sort theo độ sâu, nên thêm
    // 1 cây là mọi cây phía sau bị dịch i → lá lật bên, thân đổi màu, nhịp lắc nhảy.
    function plantSeedInt(p) {
        const s = Number(p?.leafSeed);
        if (isFinite(s) && s) return Math.abs(Math.round(s));
        return Math.round(tcHashDepth(p?.id) * 100000);
    }
    function depthY(d) { return TC_GROUND_Y + (clamp(d, 0, 1) * 2 - 1) * TC_SURF_DY; }
    function depthScale(d) { return 0.82 + clamp(d, 0, 1) * 0.32; }
    // 🌱 Hệ số chiều cao cây (user chỉnh ở panel). 100% = chiều cao gốc, >100% = cây cao hơn.
    function tcHeightScale() { return clamp(Number(config.display?.treeHeightScale) || 100, 30, 400) / 100; }
    // Trần chiều cao theo MÀN HÌNH: ngọn cây (kèm icon quà) chỉ được lên tới khi icon CHẠM đỉnh
    // overlay mà vẫn còn nguyên — tính ngược từ kích thước viewport + vị trí/scale vườn. Tăng
    // "Chiều cao cây" cao mấy cũng không làm icon quà bay ra khỏi màn (luôn thấy trọn icon).
    function tcMinTopY() {
        const d = config.display || {};
        const sf = Math.max(0.2, (Number(d.scale) || 100) / 100);
        const vh = (typeof window !== 'undefined' && window.innerHeight) ? window.innerHeight : 1920;
        const gardenBottomPx = (d.gardenYPercent == null ? 82 : Number(d.gardenYPercent)) / 100 * vh;
        const margin = 10;        // chừa mép trên overlay (px màn hình)
        const iconReserve = 95;   // chừa khoảng (px-vườn) cho nửa icon quà to nhất (~70) + đệm → icon không bị cắt
        // screen(y) = gardenBottomPx - (1200 - y) * sf ;  cần screen(topY - iconReserve) >= margin
        return (1200 + iconReserve) - (gardenBottomPx - margin) / sf;
    }
    // Biên TRÁI/PHẢI cho tâm cây (px-vườn): kẹp để icon quà + tán lá luôn chừa mép 2 bên overlay,
    // không bị cắt dù cây mọc ở rìa hay nghiêng nhiều. Tính ngược từ viewport + vị trí/scale vườn.
    // Vườn scale quanh tâm ngang (x=490): screenX(gx) = centerScreenX + (gx - 490) * sf.
    function tcXBounds() {
        const d = config.display || {};
        const sf = Math.max(0.2, (Number(d.scale) || 100) / 100);
        const vw = (typeof window !== 'undefined' && window.innerWidth) ? window.innerWidth : 1080;
        const centerScreenX = (d.gardenXPercent == null ? 50 : Number(d.gardenXPercent)) / 100 * vw;
        const margin = 16;     // chừa mép trái/phải overlay (px màn hình)
        const reach = 110;     // nửa bề ngang icon/lá to nhất (px-vườn) → cây không lè ra mép
        let lo = 490 + reach + (margin - centerScreenX) / sf;
        let hi = 490 - reach + (vw - margin - centerScreenX) / sf;

    function petTick(ts) {

                // Có cây (homeX): lượn/đi quanh CÂY CỦA HỌ. Không có (thú trang trí): cả màn.
                if (pet.paused <= 0) {
                    if (pet.homeX != null) {
                        const lo = clamp(pet.homeX - 18, 5, 95), hi = clamp(pet.homeX + 18, 5, 95);

                    }
                }

            const dx = pet.tx - pet.x, adx = Math.abs(dx);

    // dần theo tiến độ sắp nở để báo hiệu "sắp thành bướm".
    function pupaSvg(x, y, prog, s) {
        const sc = s || 1;
        const glow = (4 + clamp(prog, 0, 1) * 15).toFixed(1);
        const op = (0.5 + clamp(prog, 0, 1) * 0.5).toFixed(2);
        return `<g class="tc-pupa" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(3)})" style="filter:drop-shadow(0 0 ${glow}px rgba(110,245,175,${op}))">
            <ellipse class="tc-base-shadow" cx="0" cy="15" rx="${(11 * 1).toFixed(1)}" ry="4"/>
            <path class="tc-pupa-silk" d="M 0 -26 q 4 6 0 6"/>
            <path class="tc-pupa-body" d="M 0 -20 C 10 -16, 11 -2, 7 9 C 4 15, -4 15, -7 9 C -11 -2, -10 -16, 0 -20 Z"/>
            <path class="tc-pupa-seg" d="M -7 -7 Q 0 -3 7 -7 M -8 0 Q 0 4 8 0 M -7 7 Q 0 10 7 7"/>
            <circle class="tc-pupa-dot" cx="0" cy="-10" r="2"/>
        </g>`;
    }
    function pupaeSvg() {
        const list = Array.isArray(state.pupae) ? state.pupae : [];
        if (!list.length) return '';
        const now = Date.now();
        const items = list.map((p, i) => {
            const d = tcHashDepth(p.id || ('pu' + i));
            const pt = surfacePoint(p.x, d);
            const total = Math.max(1, (Number(p.evolveAt) || now) - (Number(p.bornAt) || now));
            const prog = clamp(1 - ((Number(p.evolveAt) || now) - now) / total, 0, 1);
            return { d, x: pt.x + ((i * 29) % 22 - 11), y: pt.y - 4, sc: 0.85 + d * 0.4, prog };
        }).sort((a, b) => a.d - b.d);
        return items.map(it => pupaSvg(it.x, it.y, it.prog, it.sc)).join('');
    }
    function protectedZonesSvg() {
        const zones = Array.isArray(state.protectedZones) ? state.protectedZones : [];
        if (!zones.length) return '';
        return zones.map(z => {
            const x0 = clamp(z.x0, 0, 100) / 100 * 980, x1 = clamp(z.x1, 0, 100) / 100 * 980, cx = (x0 + x1) / 2;
            return `<path class="tc-shield" d="M ${x0.toFixed(0)} 1122 Q ${cx.toFixed(0)} ${(1122 - 360).toFixed(0)} ${x1.toFixed(0)} 1122 Z"/>`;
        }).join('');
    }
    function renderStems() {
        const plants = Array.isArray(state.plants) ? state.plants.filter(p => (Number(p.height) || 0) > 0) : [];
        if (plants.length) {
            let html = '';
            // vẽ từ TRONG (xa) ra NGOÀI (gần): cây sâu nhỏ hơn nằm sau, cây gần to hơn đè lên → 3D.
            plants.slice().sort((a, b) => plantDepth(a) - plantDepth(b)).forEach((p) => {
                const m = plantMeta(p);
                const sd = plantSeedInt(p);   // dáng cây suy từ seed CỐ ĐỊNH → cây mới mọc không đổi cây cũ
                const dur = (4.2 + (sd % 5) * .35).toFixed(2) + 's';
                const wiltCls = (Number(p.wilt) || 0) > 38 ? ' wilt' : '';
                const ripeCls = p.ripe ? ' ripe' : '';
                const teamMin = Number(config.teamMinContributors) || 3;
                const teamCls = (Number(p.teamCount) || 0) >= teamMin ? ' team' : '';   // cây nhiều người góp → glow TEAM
                html += `<g class="tc-plant${wiltCls}${ripeCls}${teamCls}" style="--sway-dur:${dur};animation-delay:${(-(sd % 7) * .42).toFixed(2)}s">`;
                // bóng + cỏ ôm gốc cây (cắm vào mặt đất ở đúng độ sâu)
                html += baseTuftSvg(m.baseX, m.baseY, m.ds);
                html += `<path class="tc-stem ${sd % 2 ? 'alt' : ''}" d="M ${m.baseX} ${m.baseY} C ${m.baseX + m.sway * .18} ${(m.baseY - 220) - m.stemH * .08}, ${m.cx} ${m.topY + m.stemH * .38}, ${m.cx} ${m.topY}"/>`;
                const hp = clamp(Number(p.height) || 0, 0, config.maxHeight || 100) / (config.maxHeight || 100);
                // 🍃 Lá NHIỀU HƠN & rải khắp thân theo chiều cao (cây cao = nhiều xu = tán dày, đa hướng).
                const leafN = clamp(Math.round(3 + hp * 13), 3, 16);
                for (let j = 0; j < leafN; j++) {
                    const tt = .17 + j * (.74 / leafN);          // trải rộng .17 → ~.91 thân
                    const pt = plantPoint(p, tt);
                    if (pt.y < m.topY + 30) continue;
                    const side = (j + sd) % 2 ? -1 : 1;
                    const ang = side * (7 + ((sd + j * 17) % 10));               // hướng lá đa dạng theo seed
                    const lsc = (0.6 + ((sd + j * 13) % 5) * .045 + j * .012) * m.ds;
                    html += leafSvg(pt.x, pt.y, side, ang, lsc, (-(sd % 7) * .25 - j * .3).toFixed(2));
                }
                // 🍎 Trái rải thành NHIỀU CHÙM dọc thân (nhiều trái → nhiều chùm ở nhiều nơi), mỗi
                // chùm xếp so le (hex) cho thưa tự nhiên. Vị trí suy từ leafSeed → KHÔNG nhảy mỗi tick.
                const fruitTotal = clamp(Math.round(Number(p.fruits) || 0), 0, 28);
                if (fruitTotal) {
                    const fr = 14 * m.ds;
                    const gapX = fr * 2.0, gapY = fr * 1.55;
                    const clusters = clamp(Math.ceil(fruitTotal / 4), 1, 6);     // càng nhiều trái càng nhiều chùm
                    const base = Math.floor(fruitTotal / clusters), extra = fruitTotal % clusters;
                    for (let c = 0; c < clusters; c++) {
                        const cseed = (Number(p.leafSeed) || 0) + c * 131;
                        const frac = clusters > 1 ? (.46 + (c / (clusters - 1)) * .42) : .6;   // rải .46 → .88 dọc thân
                        const anchor = plantPoint(p, clamp(frac + ((cseed % 5) - 2) * .015, .4, .92));
                        const ox = ((cseed % 9) - 4) * (fr * .55);               // lệch chùm sang 2 bên thân
                        const per = base + (c < extra ? 1 : 0);                  // chia đều trái cho các chùm
                        for (let k = 0; k < per; k++) {
                            const col = (k % 3) - 1, row = Math.floor(k / 3);
                            const seed = cseed + k * 97;
                            const jx = (seed % 7) - 3, jy = (seed * 3) % 6;      // lệch nhẹ cho tự nhiên
                            const fx = anchor.x + ox + col * gapX + (row % 2 ? gapX * .5 : 0) + jx;
                            const fy = anchor.y + row * gapY + jy;
                            if (fy < m.topY + 16) continue;
                            html += fruitSvg(fx, fy, (1.0 + (k % 3) * .12) * m.ds, seed);
                        }
                    }
                }
                html += '</g>';
            });
            $svg.innerHTML = svgDefs + html + corpsesSvg() + pupaeSvg() + groundFruitsSvg() + caterpillarsSvg() + protectedZonesSvg();
            return;
        }
        const count = clamp(parseInt(config.display.stemCount, 10) || 7, 1, 12);
        const h = clamp(state.height || 0, 0, config.maxHeight || 100) / (config.maxHeight || 100);
        // Vườn không còn cây đứng (bị sâu ăn sạch) nhưng VẪN còn vật dưới đất (xác sâu, kén, trái
        // rụng, sâu) → vẫn vẽ chúng để thấy kén nở thành bướm, thay vì xoá trắng cả lớp.
        if (h <= 0.001) { $svg.innerHTML = svgDefs + corpsesSvg() + pupaeSvg() + groundFruitsSvg() + caterpillarsSvg() + protectedZonesSvg(); return; }
        const wilt = clamp(state.wilt || 0, 0, 100) / 100;
        let html = '';
        for (let i = 0; i < count; i++) {
            const m = stemMeta(i);
            const baseX = m.baseX, stemH = m.stemH, topY = m.topY, sway = m.sway, cx = m.cx;
            const dur = (4.2 + (i % 5) * .35).toFixed(2) + 's';
            html += `<g class="tc-plant" style="--sway-dur:${dur};animation-delay:${(-i * .42).toFixed(2)}s"><path class="tc-stem ${i % 2 ? 'alt' : ''}" d="M ${baseX} 1120 C ${baseX + sway * .2} ${900 - stemH * .08}, ${cx} ${topY + stemH * .38}, ${cx} ${topY}"/>`;
            const leafN = clamp(Math.round(2 + h * 5), 2, 7);
            for (let j = 0; j < leafN; j++) {
                const ly = 1060 - stemH * (.18 + j * (.62 / leafN));
                if (ly < topY + 35) continue;
                const side = (j + i) % 2 ? -1 : 1;
                const lx = baseX + sway * (.16 + j * .1);
                html += leafSvg(lx, ly, side, side * (8 + (j % 3) * 4), 0.68 + j * .04, (-i * .25 - j * .35).toFixed(2));
            }
            html += '</g>';
        }
        $svg.innerHTML = svgDefs + html + corpsesSvg() + pupaeSvg() + groundFruitsSvg() + caterpillarsSvg() + protectedZonesSvg();
    }
    function renderFlowers() {
        if (config.display.showFlowers === false) { $flowers.innerHTML = ''; return; }
        const plants = Array.isArray(state.plants) ? state.plants.filter(p => (Number(p.height) || 0) > 0 && p.giftImage) : [];
        if (plants.length) {
            const sorted = plants.slice().sort((a, b) => plantDepth(a) - plantDepth(b));
            const flowersHtml = sorted.map((p) => {
                const m = plantMeta(p);
                const sd = plantSeedInt(p);   // nhịp đung đưa hoa theo seed cố định → cây mới mọc không làm hoa cây cũ nhảy nhịp
                const pt = plantPoint(p, .985);
                const scent = Math.max(1, Number(p.scent) || 1);
                const height = Math.max(0, Number(p.height) || 0);
                const count = Math.max(1, Number(p.count) || 1);
                const size = clamp((28 + Math.sqrt(scent) * .34 + height * .52 + Math.min(16, count * 1.3)) * m.ds, 30, 140);
                const dur = (4.6 + (sd % 5) * .5).toFixed(2);
                const delay = (-(sd % 9) * .6).toFixed(2);
                const z = Math.round(m.depth * 100);   // cây gần (depth lớn) đè lên cây xa
                const wilt = Number(p.wilt) || 0;
                const wiltStyle = wilt > 38 ? `filter:sepia(${Math.min(.9, wilt / 100).toFixed(2)}) brightness(${Math.max(.62, 1 - wilt / 260).toFixed(2)}) drop-shadow(0 3px 4px rgba(0,0,0,.45));opacity:${Math.max(.58, 1 - wilt / 260).toFixed(2)};` : '';
                return `<img class="tc-flower" src="${esc(p.giftImage || '')}" title="${esc((p.giftName || '') + ' x' + (p.count || 1))}" style="left:${pt.x.toFixed(1)}px;top:${pt.y.toFixed(1)}px;z-index:${z};--s:${size.toFixed(0)}px;--r:${((Number(p.lean) || 0) / 3).toFixed(2)}deg;--sway-dur:${dur}s;--sway-delay:${delay}s;${wiltStyle}" onerror="this.style.display='none'"/>`;
            }).join('');
            // 🌱 Dây + avatar chủ cây cho cây CỦA VIEWER đã trưởng thành (có tán lá). Vẽ sau hoa → nổi trên cùng.
            const maxH = config.maxHeight || 100;
            // Cây CỦA VIEWER (owned) đã trưởng thành → luôn hiện dây + huy hiệu (avatar thật, hoặc chữ cái nếu thiếu avatar).
            const ownersHtml = (config.display.showNames === false) ? '' : sorted
                .filter(p => p.owned && (Number(p.height) || 0) / maxH >= TC_MATURE_FRAC)
                .map(ownerMedalHtml).join('');
            $flowers.innerHTML = flowersHtml + ownersHtml;
            return;
        }
        const list = Array.isArray(state.flowers) ? state.flowers : [];
        const hGlobal = clamp(state.height || 0, 0, config.maxHeight || 100) / (config.maxHeight || 100);
        $flowers.innerHTML = list.map((f, i) => {
            const p = flowerPoint(f);
            const baseSize = clamp(f.size || 58, 28, 110);
            const size = clamp(baseSize * (0.72 + hGlobal * 0.7), 30, 140);
            const dur = (4.6 + (i % 5) * .5).toFixed(2);
            const delay = (-i * .6).toFixed(2);
            return `<img class="tc-flower" src="${esc(f.giftImage || '')}" title="${esc(f.giftName || '')}" style="left:${p.x.toFixed(1)}px;top:${p.y.toFixed(1)}px;--s:${size.toFixed(0)}px;--r:${Number(f.rot || 0)}deg;--sway-dur:${dur}s;--sway-delay:${delay}s" onerror="this.style.display='none'"/>`;
        }).join('');
    }
    // 🌱 Huy hiệu chủ cây: 👑 + dây leo buông từ ngọn xuống avatar tròn (vành cầu vồng) + tên.
    //    Neo tại ngọn cây (plantPoint .94); avatar lệch xuống-phải để dây buông tự nhiên như ảnh 1.
    function ownerMedalHtml(p) {
        const m = plantMeta(p);
        const anchor = plantPoint(p, .94);
        const sc = clamp(0.78 + m.depth * 0.4, 0.7, 1.25);   // cây gần (depth lớn) → huy hiệu to hơn
        const z = Math.round(m.depth * 100) + 40;            // luôn nổi trên hoa cùng độ sâu
        const dx = 30 * sc, dy = 96 * sc;                    // vị trí avatar so với điểm neo
        const w = Math.ceil(Math.abs(dx) + 30), h = Math.ceil(dy + 10);
        const vine = `<svg class="tc-owner-vine" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="M 0 0 C ${(dx * 0.1).toFixed(0)} ${(dy * 0.5).toFixed(0)}, ${(dx * 1.25).toFixed(0)} ${(dy * 0.45).toFixed(0)}, ${dx.toFixed(0)} ${dy.toFixed(0)}"/></svg>`;
        // Avatar thật nếu có; nếu thiếu → vòng tròn chữ cái đầu nickname (vẫn hiện dây để phân biệt chủ cây).
        const nm = String(p.nickname || '').trim();
        const ava = p.ownerAvatar
            ? `<img class="tc-owner-ava" src="${esc(p.ownerAvatar)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'tc-owner-ava ph',textContent:'${esc((nm[0] || '🌱').toUpperCase())}'}))"/>`
            : `<span class="tc-owner-ava ph">${esc((nm[0] || '🌱').toUpperCase())}</span>`;
        const lock = p.growthLocked ? `<span class="tc-owner-lock" title="Đã tạm khóa tăng trưởng">🔒</span>` : '';
        return `<div class="tc-owner${p.growthLocked ? ' locked' : ''}" style="left:${anchor.x.toFixed(1)}px;top:${anchor.y.toFixed(1)}px;z-index:${z};--s:${sc.toFixed(3)}">`
            + `<span class="tc-owner-crown">👑</span>`
            + vine
            + `<div class="tc-owner-medal" style="left:${dx.toFixed(0)}px;top:${dy.toFixed(0)}px">`
            + `<span class="tc-owner-ring">${ava}${lock}</span>`
            + `<span class="tc-owner-name">${esc(nm)}</span>`
            + `</div></div>`;
    }
    function renderStatus() {
        if (config.display.showStatus === false) return;
        const rows = [
            ['Cao', 'height', state.height || 0],
            ['Nước', 'water', state.water || 0],
            ['Nắng', 'sun', state.sun || 0],
            ['Héo', 'wilt', state.wilt || 0]
        ];
        $status.innerHTML = rows.map(r => `<div class="tc-status-row"><span>${r[0]}</span><span class="tc-bar"><i class="tc-fill ${r[1]}" style="width:${clamp(r[2],0,100)}%"></i></span><span>${Math.round(r[2])}</span></div>`).join('');
    }
    // ════════════════════════════════════════════════════════════════════════
    // THỜI TIẾT REALTIME — KHÔNG xếp hàng tuần tự nữa (sửa bug combo mưa lệch nhịp)
    // ────────────────────────────────────────────────────────────────────────
    // Bug cũ: mỗi quà mưa = 1 "cơn" 4.2s phát NỐI ĐUÔI qua hàng đợi → combo 10 quà = mưa
    //   kéo 42s, lệch hẳn với trạng thái cây (server áp nước & cây xanh TỨC THÌ) → tiếng kêu
    //   ngay còn mưa trễ 40s. Cắt/nắng cũng kẹt sau mưa.
    // Sửa: mưa/nắng là TRẠNG THÁI LIÊN TỤC. Mỗi quà thả giọt NGAY + gia hạn đuôi 1.5s; combo
    //   = mưa dày realtime rồi tạnh ngay sau quà cuối. Cắt bắn thẳng lớp riêng, không bị chặn.
    //   Mọi hiệu ứng giờ đều realtime → hình & tiếng luôn khớp, không bao giờ lệch.
    let rainEndAt = 0, rainTimer = null, sunEndAt = 0, sunTimer = null;
    function flashWeather(kind) {
        if (kind === 'rain') triggerRain();
        else if (kind === 'sunny') triggerSun();
    }
    function spawnRainBurst(count) {
        const drops = count || 42;
        for (let i = 0; i < drops; i++) {
            const d = document.createElement('i');
            d.className = 'tc-rain-drop';
            // ~34% hạt "gần" (to, dày, sáng, rơi nhanh) + còn lại hạt "xa" (mảnh, mờ, chậm)
            // → tạo CHIỀU SÂU nên mưa trông NẶNG HẠT mà vẫn rất thật, không bị phẳng/giả.
            const near = Math.random() < 0.34;
            const w = near ? (3.2 + Math.random() * 1.9) : (1.4 + Math.random() * 1.1);
            const h = near ? (48 + Math.random() * 28) : (24 + Math.random() * 18);
            const dur = near ? (1.3 + Math.random() * 0.55) : (1.9 + Math.random() * 1.1);
            const left = Math.random() * 114 - 7;
            const delay = Math.random() * 0.9;
            d.style.left = left.toFixed(2) + '%';
            d.style.setProperty('--w', w.toFixed(2) + 'px');
            d.style.setProperty('--h', h.toFixed(1) + 'px');
            d.style.setProperty('--dur', dur.toFixed(2) + 's');
            d.style.animationDelay = delay.toFixed(2) + 's';
            d.style.opacity = (near ? (.82 + Math.random() * .18) : (.4 + Math.random() * .34)).toFixed(2);
            $weather.appendChild(d);
            const life = (delay + dur + 0.3) * 1000;
            setTimeout(() => d.remove(), life);     // mỗi giọt tự dọn → không cần xoá cả lớp
            if (near && Math.random() < 0.5) {
                const sp = document.createElement('i');
                sp.className = 'tc-rain-splash';
                sp.style.left = (left - 2).toFixed(2) + '%';
                sp.style.top = (78 + Math.random() * 10).toFixed(1) + '%';
                sp.style.setProperty('--s', (12 + Math.random() * 12).toFixed(0) + 'px');
                sp.style.animationDelay = (delay + dur * 0.82).toFixed(2) + 's';
                $weather.appendChild(sp);
                setTimeout(() => sp.remove(), life + 200);
            }
        }
    }
    function triggerRain() {
        if (config.display.showWeatherFx === false) return;
        $weather.classList.add('rain');
        spawnRainBurst(42);                       // giọt rơi NGAY (đồng bộ tiếng "water")
        rainEndAt = Date.now() + 1500;            // đuôi 1.5s sau quà cuối
        if (!rainTimer) rainTimer = setInterval(() => {
            if (Date.now() >= rainEndAt) { clearInterval(rainTimer); rainTimer = null; $weather.classList.remove('rain'); }
        }, 250);
    }
    function triggerSun() {
        if (config.display.showWeatherFx === false) return;
        $weather.classList.add('sunny');
        sunEndAt = Date.now() + 1300;
        if (!sunTimer) sunTimer = setInterval(() => {
            if (Date.now() >= sunEndAt) { clearInterval(sunTimer); sunTimer = null; $weather.classList.remove('sunny'); }
        }, 250);
    }
    function playCut(payload) {
        // Kéo cắt bắn NGAY vào lớp banner (z40) — KHÔNG đụng lớp mưa nên không bị combo mưa
        // chặn/đè. Kéo LIA QUA LẠI ~4 vòng (2.4s) rồi mới SNIP — tiếng "cut" phát đúng lúc snip.
        const targetPlant = (state.plants || []).find(p => p.id === payload?.plantId);
        // Độ cao cắt NGẪU NHIÊN theo cutT của server → kéo lia ở vị trí khác nhau mỗi lần
        // (không còn luôn sát gốc). Mặc định .62 nếu quà cũ chưa kèm cutT.
        const cutT = clamp(Number(payload?.cutT) || 0.62, 0.18, 0.95);
        const local = targetPlant ? plantPoint(targetPlant, cutT) : stemPoint(payload?.stemIndex || 0, cutT);
        const rect = $garden.getBoundingClientRect();
        const centerX = rect.left + local.x / 980 * rect.width;
        const centerY = rect.top + local.y / 1200 * rect.height;
        const s = document.createElement('div');
        s.className = 'tc-scissor';
        s.textContent = '✂️';
        s.style.setProperty('--x', (centerX + (Math.random() * 28 - 14)).toFixed(1) + 'px');
        s.style.setProperty('--y', (centerY + (Math.random() * 24 - 12)).toFixed(1) + 'px');
        s.style.setProperty('--s', (52 + Math.random() * 24).toFixed(1) + 'px');
        $banner.appendChild(s);
        // Khoảnh khắc SNIP (~76% của 2.4s): tiếng "rẹt" + LÁ bị cắt rụng xuống TRƯỚC, phần thân
        // cây tụt chiều cao SAU (server áp cut sau cutSnipDelaySec) → đúng thứ tự "cắt lá → cắt thân".
        setTimeout(() => { sfx('cut'); spawnCutLeaves(centerX, centerY); }, 1840);
        setTimeout(() => s.remove(), 2600);
    }
    // 🍃 Lá bị kéo cắt rơi rụng xuống (xoay tròn + héo dần nâu khi chạm đất).
    function spawnCutLeaves(cx, cy) {
        const leaves = ['🍃', '🍂', '🌿'];
        const n = 4 + Math.floor(Math.random() * 4);
        for (let i = 0; i < n; i++) {
            const el = document.createElement('div');
            el.className = 'tc-cutleaf';

    function spraySound() {

        try {

            if (audioCtx.state === 'suspended') audioCtx.resume();
            const dur = 0.55, sr = audioCtx.sampleRate;
            const buf = audioCtx.createBuffer(1, Math.floor(sr * dur), sr);
            const d = buf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.4);
            const src = audioCtx.createBufferSource(); src.buffer = buf;
            const bp = audioCtx.createBiquadFilter(); bp.type = 'highpass'; bp.frequency.value = 2200;
            const g = audioCtx.createGain(); g.gain.value = 0.13;
            src.connect(bp); bp.connect(g); g.connect(audioCtx.destination); src.start();
        } catch (e) {}
    }
    function playSpray(payload) {

        // còn xịt từ tít trên cao xuống. cũ chỉ có x → mặc định mặt đất.
        let aimGX = xPct / 100 * 980, aimGY = depthY(0.6);
        const aim = payload && payload.aim;
        if (aim) {
            if (!aim.ground && aim.plantId) {
                const p = (state.plants || []).find(pp => pp.id === aim.plantId);
                if (p) { const pt = plantPoint(p, .58); aimGX = pt.x; aimGY = pt.y; }
                else { const s = surfacePoint(aim.x ?? xPct, 0.6); aimGX = s.x; aimGY = s.y; }
            } else {
                const s = surfacePoint(aim.x ?? xPct, 0.6); aimGX = s.x; aimGY = s.y;
            }
        }
        const tx = rect.left + aimGX / 980 * rect.width;       // con sâu (px màn hình)
        const ty = rect.top + aimGY / 1200 * rect.height;
        // Bình xịt đứng CHẾCH trên một bên con sâu, vòi chĩa xuống ~45° vào sâu (xịt chân thực).
        const side = (xPct <= 50) ? 1 : -1;                    // sâu lệch trái → xịt từ trái qua
        const bx = tx + 118 * side, by = ty - 120;
        const baseAng = Math.atan2(ty - by, tx - bx);          // hướng từ vòi tới con sâu
        const bottle = document.createElement('div');
        bottle.className = 'tc-sprayer'; bottle.textContent = '🧴';
        bottle.style.left = bx.toFixed(0) + 'px'; bottle.style.top = by.toFixed(0) + 'px';
        bottle.style.setProperty('--rot', (side > 0 ? 34 : -34) + 'deg');   // nghiêng vòi ~45° về phía sâu
        $banner.appendChild(bottle);
        setTimeout(() => bottle.remove(), 1400);
        const reach = Math.hypot(tx - bx, ty - by);
        for (let i = 0; i < 26; i++) {
            const m = document.createElement('i'); m.className = 'tc-mist';
            const a = baseAng + (-0.32 + Math.random() * 0.64);            // chùm sương ±~18° quanh hướng tới sâu
            const dist = reach * (0.55 + Math.random() * 0.7);
            m.style.left = bx.toFixed(0) + 'px'; m.style.top = by.toFixed(0) + 'px';
            m.style.setProperty('--dx', (Math.cos(a) * dist).toFixed(0) + 'px');
            m.style.setProperty('--dy', (Math.sin(a) * dist).toFixed(0) + 'px');
            m.style.animationDelay = (Math.random() * .28).toFixed(2) + 's';
            $banner.appendChild(m);
            setTimeout(() => m.remove(), 1300);
        }
    }
