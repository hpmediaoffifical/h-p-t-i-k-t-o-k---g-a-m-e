<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HP — Danh sách quà</title>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
        margin: 0; height: 100%;
        background: #0b0d12; color: #e6e8ee;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
    }
    body { display: flex; flex-direction: column; }

    /* Thanh tiêu đề kéo được (frameless) */
    .gl-bar {
        display: flex; align-items: center; gap: 8px;
        padding: 7px 10px;
        background: linear-gradient(180deg, #14171f, #0f1218);
        border-bottom: 1px solid #1f2533;
        -webkit-app-region: drag;
        user-select: none;
        flex: none;
    }
    .gl-title { font-size: 12.5px; font-weight: 700; color: #ffd166; white-space: nowrap; }
    .gl-count { font-size: 11px; color: #8b93a7; }
    .gl-spacer { flex: 1; }
    .gl-search {
        -webkit-app-region: no-drag;
        background: #0f1218; border: 1px solid #1f2533; border-radius: 6px;
        color: #e6e8ee; padding: 4px 9px; font-size: 11px; outline: none;
        width: 130px; transition: border-color .15s ease, width .15s ease;
    }
    .gl-search:focus { border-color: #ff6b3d; width: 160px; }
    .gl-btn {
        -webkit-app-region: no-drag;
        background: #1a1f2b; border: 1px solid #2a3142; border-radius: 6px;
        color: #c8cee0; cursor: pointer; font-size: 13px;
        width: 28px; height: 26px; display: grid; place-items: center;
        transition: background .12s ease, border-color .12s ease;
    }
    .gl-btn:hover { background: #232b3a; border-color: #3a445a; }
    .gl-btn.on { background: #ff6b3d; border-color: #ff6b3d; color: #fff; }
    .gl-btn.close:hover { background: #b91c1c; border-color: #b91c1c; color: #fff; }

    /* Lưới quà — copy từ style.css .gift-catalog/.gift-card */
    .gl-catalog {
        flex: 1; min-height: 0; overflow-y: auto;
        padding: 8px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
        gap: 5px; align-content: start;
    }
    .gift-card {
        background: #0f1218; border: 1px solid #1f2533;
        border-radius: 8px; padding: 5px; text-align: center; cursor: pointer;
        transition: transform .1s ease, border-color .15s ease, box-shadow .15s ease;
        position: relative;
        user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
    }
    .gift-card:hover { border-color: #ff6b3d; transform: translateY(-2px); }
    .gift-card:active { transform: scale(.94); border-color: #ffd166; }
    .gift-card img { width: 48px; height: 48px; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
    .gift-card .name { font-size: 10px; color: #c8cee0; margin-top: 2px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gift-card .id { font-size: 9px; color: #ffd166; }
    .gift-card .diamond { font-size: 9px; color: #60a5fa; }

    .gl-empty { padding: 30px 16px; text-align: center; color: #8b93a7; font-size: 12px; }
    .gl-hint {
        flex: none; padding: 5px 10px; text-align: center;
        font-size: 10.5px; color: #6b7488;
        border-top: 1px solid #1f2533; background: #0d1016;
    }

    /* Scrollbar mảnh */
    .gl-catalog::-webkit-scrollbar { width: 9px; }
    .gl-catalog::-webkit-scrollbar-thumb { background: #2a3142; border-radius: 5px; border: 2px solid #0b0d12; }
    .gl-catalog::-webkit-scrollbar-thumb:hover { background: #3a445a; }

    /* Toast bấm thử */
    .gl-toast {
        position: fixed; left: 50%; bottom: 38px; transform: translateX(-50%) translateY(8px);
        background: #14171f; border: 1px solid #2a3142; border-radius: 8px;
        color: #e6e8ee; font-size: 12px; padding: 7px 14px;
        opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
        box-shadow: 0 6px 20px rgba(0,0,0,.5); white-space: nowrap; z-index: 50;
    }
    .gl-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
    <div class="gl-bar">
        <span class="gl-title">📦 Danh sách quà</span>
        <span class="gl-count" id="gl-count">…</span>
        <span class="gl-spacer"></span>
        <input id="gl-search" class="gl-search" type="text" placeholder="Tìm tên / ID…" />
        <button id="gl-pin" class="gl-btn" title="Ghim luôn nổi trên cùng">📌</button>
        <button id="gl-close" class="gl-btn close" title="Đóng cửa sổ">✕</button>
    </div>
    <div id="gl-catalog" class="gl-catalog"></div>
    <div class="gl-hint">Bấm 1 quà để thả thử vào game đang bật →</div>
    <div id="gl-toast" class="gl-toast"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
    (function () {
        const bridge = window.hpGiftList || null;
        const catalogEl = document.getElementById('gl-catalog');
        const countEl = document.getElementById('gl-count');
        const searchEl = document.getElementById('gl-search');
        const pinBtn = document.getElementById('gl-pin');
        const closeBtn = document.getElementById('gl-close');
        const toastEl = document.getElementById('gl-toast');

        const placeholderImg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="8" fill="%231a1f2b"/><text x="24" y="30" font-size="20" text-anchor="middle" fill="%23556">🎁</text></svg>';

        let giftSheet = [];

        function sortSheet(list) {
            return (list || []).slice().sort((a, b) => (a.diamond || 0) - (b.diamond || 0));
        }

        let toastTimer = null;
        function toast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
        }

        function render(filter = '') {
            catalogEl.innerHTML = '';
            const f = (filter || '').trim().toLowerCase();
            let list = giftSheet;
            if (f) {
                list = list.filter(g =>
                    String(g.id).toLowerCase().includes(f) ||
                    (g.name || '').toLowerCase().includes(f)
                );
            }
            countEl.textContent = f ? `${list.length}/${giftSheet.length}` : `${giftSheet.length} quà`;
            if (!list.length) {
                catalogEl.innerHTML = '<div class="gl-empty">Không có quà nào khớp.</div>';
                return;
            }
            const frag = document.createDocumentFragment();
            for (const g of list) {
                const card = document.createElement('div');
                card.className = 'gift-card';
                const im = document.createElement('img');
                im.loading = 'lazy';
                im.src = g.image || placeholderImg;
                im.onerror = () => { im.src = placeholderImg; };
                const nm = document.createElement('div');
                nm.className = 'name'; nm.title = g.name || ''; nm.textContent = g.name || '';
                const idL = document.createElement('div');
                idL.className = 'id'; idL.textContent = `ID ${g.id}`;
                const di = document.createElement('div');
                di.className = 'diamond'; di.textContent = `${g.diamond || 0}⭐`;
                card.append(im, nm, idL, di);
                card.addEventListener('click', () => {
                    // emitGift là broadcast toàn cục → game id chỉ để validate; 'thuytinh'
                    // luôn tồn tại. Main window route quà vào game đang bật qua socket 'gift'.
                    fetch('/api/games/thuytinh/test-gift', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ giftId: g.id, count: 1, nickname: 'preview' })
                    }).catch(() => {});
                    toast(`🎁 Đã thả thử: ${g.name || 'Quà'} (ID ${g.id})`);
                });
                frag.appendChild(card);
            }
            catalogEl.appendChild(frag);
        }

        function setGifts(list) {
            const usable = (list || []).filter(g => g && g.id);
            if (!usable.length) return;
            giftSheet = sortSheet(usable);
            render(searchEl.value);
        }

        // Nguồn 1: REST snapshot ngay khi mở (không phải đợi socket).
        fetch('/api/gifts').then(r => r.json()).then(setGifts).catch(() => {});

        // Nguồn 2: socket live — server emit 'giftSheet' khi refresh danh sách.
        try {
            const socket = io();
            socket.on('giftSheet', setGifts);
        } catch (_) {}

        searchEl.addEventListener('input', () => render(searchEl.value));

        // ── Pin / Close qua IPC (chỉ có trong Electron) ──
        let pinned = true;
        function reflectPin() {
            pinBtn.classList.toggle('on', pinned);
            pinBtn.title = pinned ? 'Đang ghim trên cùng — bấm để bỏ ghim' : 'Bấm để ghim luôn nổi trên cùng';
        }
        pinBtn.addEventListener('click', () => {
            pinned = !pinned;
            reflectPin();
            bridge?.setAlwaysOnTop(pinned);
        });
        closeBtn.addEventListener('click', () => bridge?.close());
        bridge?.onInitPin?.((on) => { pinned = !!on; reflectPin(); });
        reflectPin();

        // Phím tắt: Esc đóng, Ctrl/⌘+F focus ô tìm
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { bridge?.close(); }
            else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
                e.preventDefault(); searchEl.focus(); searchEl.select();
            }
        });
    })();
    </script>
</body>
</html>
